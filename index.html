<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ken 的小站入口：便宜、有用的技能与资源导航">
  <title>KEN · USE · 便宜、有用的，都在这</title>
  <style>/* ================= 1. 核心动态 CSS 变量体系（12 色弥散光晕 + 深色模式） ================= */
    :root{
      --hero-bg-base: #F4F8FC;
      --orb-color-1: #BCE0FD;
      --orb-color-2: #93C5FD;
      --refresh-btn-bg: #60A5FA;
      --refresh-btn-text: #FFFFFF;
      --send-circle-bg: #9CCAF9;
      --send-circle-icon: #0F172A;
      --theme-accent: #2563EB;
      --theme-tab-text: #0F172A;
      --theme-tag-bg: #EBF5FF;
      --theme-tag-text: #1D4ED8;
      --search-glow: rgba(147, 197, 253, 0.42);
      --outer-desk-bg: #E2E8F0;
      --page-bg: #F3F8FA;
      --card-bg: #FFFFFF;
      --card-border: rgba(226, 232, 240, 0.92);
      --screen-widget-bg: #F8FAFC;
      --screen-subcard-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --pill-surface: #FFFFFF;
      --pill-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }
[data-dark="true"]{
      --hero-bg-base: #0B1120;
      --outer-desk-bg: #03060C;
      --page-bg: #0B111E;
      --card-bg: #151F32;
      --card-border: #26334D;
      --screen-widget-bg: #0F172A;
      --screen-subcard-bg: #1E293B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --pill-surface: #1E293B;
      --pill-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
      --theme-tab-text: #F8FAFC;
    }
html, body, #masterPhoneChassis, #masterPhoneChassis *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
/* 页面与手机界面严格锁定一屏，禁止滚动 */
    html, body{
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }
body{
      background-color: var(--outer-desk-bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.4dvh, 14px) 16px;
      transition: background-color 0.35s ease, color 0.3s ease;
    }
#masterPhoneChassis{
      position: relative;
      width: min(100%, 404px);
      height: 100%;
      max-height: 840px;
      background: #07090E;
      border-radius: 50px;
      padding: 5px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16),
                  0 24px 56px -14px rgba(8, 12, 24, 0.34),
                  0 8px 22px rgba(8, 12, 24, 0.16);
      display: flex;
      flex-direction: column;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  max-width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  border-radius 0.35s ease;
    }
#masterPhoneChassis.wide-grid-chassis{
      width: 100%;
      max-width: 1200px;
    }
#masterPhoneChassis.wide-grid-chassis .iphone18-master-screen{
      overflow-y: auto;
      justify-content: flex-start;
      scrollbar-width: none;
    }
#masterPhoneChassis.wide-grid-chassis .iphone18-master-screen::-webkit-scrollbar{
      display: none;
    }
#masterPhoneChassis.wide-grid-chassis .flat-cards-grid.active-mode{
      flex: none;
      overflow-y: visible;
    }
#masterPhoneChassis::before{
      content: "";
      position: absolute;
      left: -2px;
      top: 116px;
      width: 2.5px;
      height: 30px;
      background: #1E293B;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 44px 0 #1E293B, 0 84px 0 #1E293B;
      pointer-events: none;
    }
#masterPhoneChassis::after{
      content: "";
      position: absolute;
      right: -2px;
      top: 150px;
      width: 2.5px;
      height: 50px;
      background: #1E293B;
      border-radius: 0 3px 3px 0;
      pointer-events: none;
    }
#masterPhoneChassis .iphone18-master-screen{
      position: relative;
      background-color: var(--page-bg);
      border-radius: 45px;
      width: 100%;
      height: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: background-color 0.35s ease;
    }
#masterPhoneChassis .aura-backdrop{
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 310px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      contain: strict;
    }
#masterPhoneChassis .aura-orb{
      position: absolute;
      border-radius: 50%;
      opacity: 0.78;
      pointer-events: none;
      transition: background 0.45s ease, transform 0.45s ease;
    }
[data-dark="true"] #masterPhoneChassis .aura-orb{ opacity: 0.25; }
#masterPhoneChassis .aura-orb.orb-left{
      width: 300px;
      height: 240px;
      top: -60px;
      left: -70px;
      background: radial-gradient(circle, var(--orb-color-1) 0%, transparent 72%);
    }
#masterPhoneChassis .aura-orb.orb-right{
      width: 320px;
      height: 260px;
      top: -50px;
      right: -70px;
      background: radial-gradient(circle, var(--orb-color-2) 0%, transparent 72%);
    }
#masterPhoneChassis .aura-orb.orb-center{
      width: 280px;
      height: 200px;
      top: 0;
      left: 50%;
      margin-left: -140px;
      background: radial-gradient(circle, #9EE0C5 0%, transparent 72%);
      opacity: 0;
    }
[data-holo="true"] #masterPhoneChassis .aura-orb.orb-center{ opacity: 0.65; }
[data-dark="true"][data-holo="true"] #masterPhoneChassis .aura-orb.orb-center{ opacity: 0.25; }
[data-holo="true"] #masterPhoneChassis .card-btn-primary{
      background: linear-gradient(120deg, #56C596 0%, #4FA8F6 100%);
    }
[data-holo="true"] #masterPhoneChassis .action-circle-btn{
      background: linear-gradient(135deg, #B2E2B4 0%, #98DBC5 50%, #9CC8F7 100%);
    }
#masterPhoneChassis .iphone18-top-statusbar{
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(7px, 1.3dvh, 11px) 22px clamp(3px, 0.7dvh, 6px);
      flex-shrink: 0;
    }
#masterPhoneChassis .ios18-clock{
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      width: 58px;
    }
#masterPhoneChassis .iphone18-dynamic-island{
      width: 92px;
      height: 22px;
      border-radius: 999px;
      background-color: #05070B;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22), inset 0 0 0 0.8px rgba(255, 255, 255, 0.15);
      transition: width 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
#masterPhoneChassis .iphone18-dynamic-island:hover{ width: 110px; }
#masterPhoneChassis .island-live-dot{
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 5px #10B981;
    }
#masterPhoneChassis .island-camera-eye{
      width: 7.5px;
      height: 7.5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38BDF8 0%, #1E1B4B 65%, #05070B 100%);
    }
#masterPhoneChassis .ios18-status-right{
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      width: 58px;
      color: var(--text-primary);
      font-size: 10.5px;
      font-weight: 800;
    }
#masterPhoneChassis .hero-header{
      position: relative;
      z-index: 15;
      padding: clamp(2px, 0.6dvh, 6px) 14px clamp(4px, 0.8dvh, 8px);
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      flex-shrink: 0;
    }
#masterPhoneChassis .top-nav-bar{
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 36px;
      margin-bottom: 12px;
    }
#masterPhoneChassis .brand-tag{
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      z-index: 2;
    }
#masterPhoneChassis .brand-bar{
      width: 3.5px;
      height: 13px;
      background-color: var(--theme-accent);
      border-radius: 3px;
      margin-right: 5px;
      transition: background-color 0.4s ease;
    }
#masterPhoneChassis .view-mode-row{
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
#masterPhoneChassis .view-mode-switch{
      position: relative;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      align-items: center;
    }
#masterPhoneChassis .tab-glider{
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background-color: var(--pill-surface);
      border-radius: 999px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
[data-dark="true"] #masterPhoneChassis .view-mode-switch{
      background: rgba(15, 23, 42, 0.45);
    }
[data-dark="true"] #masterPhoneChassis .lang-pill-btn, [data-dark="true"] #masterPhoneChassis .theme-mode-btn{
      border-color: rgba(255, 255, 255, 0.1);
    }
#masterPhoneChassis .view-mode-btn{
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.22s ease;
    }
#masterPhoneChassis .view-mode-btn.active{
      color: var(--theme-tab-text);
      font-weight: 700;
    }
#masterPhoneChassis .top-right-widgets{
      display: flex;
      align-items: center;
      gap: 5px;
      position: relative;
      flex-shrink: 0;
      z-index: 4;
    }
#masterPhoneChassis .lang-pill-btn{
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
#masterPhoneChassis .lang-pill-btn:active{ transform: scale(0.93); }
#masterPhoneChassis .globe-svg{
      width: 17px;
      height: 17px;
      stroke: var(--theme-accent);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
#masterPhoneChassis .lang-text{
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }
#masterPhoneChassis .theme-mode-btn{
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      user-select: none;
      touch-action: none;
      position: relative;
      z-index: 102;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
#masterPhoneChassis .theme-mode-btn.pressing{
      transform: scale(0.9);
      box-shadow: 0 0 0 4px var(--search-glow);
    }
#masterPhoneChassis .sun-moon-svg{
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
#masterPhoneChassis .theme-mode-btn.rotating .sun-moon-svg{
      transform: rotate(180deg) scale(0.85);
    }
#masterPhoneChassis .theme-panel-backdrop{
      position: fixed;
      inset: 0;
      z-index: 98;
      background: rgba(15, 23, 42, 0.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
#masterPhoneChassis .theme-panel-backdrop.open{
      opacity: 1;
      pointer-events: auto;
    }
#masterPhoneChassis .theme-popover-panel{
      position: absolute;
      top: 48px;
      right: 0;
      width: 292px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.18),
                  0 4px 16px rgba(15, 23, 42, 0.06);
      z-index: 101;
      opacity: 0;
      transform: translateY(-8px) scale(0.92);
      transform-origin: top right;
      pointer-events: none;
      user-select: none;
      touch-action: none;
      transition: opacity 0.24s ease, transform 0.28s cubic-bezier(.16, 1, .3, 1);
    }
#masterPhoneChassis .theme-popover-panel.open{
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
#masterPhoneChassis .panel-header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }
#masterPhoneChassis .panel-title{
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }
#masterPhoneChassis .panel-hint{
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }
#masterPhoneChassis .theme-swatch-grid{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }
#masterPhoneChassis .theme-swatch-item{
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.75);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
#masterPhoneChassis .theme-swatch-item.active, #masterPhoneChassis .theme-swatch-item.sliding-hover{
      background: var(--theme-tag-bg);
      border-color: var(--theme-accent);
      transform: scale(1.04);
      box-shadow: 0 6px 16px -4px var(--search-glow);
    }
[data-dark="true"] #masterPhoneChassis .theme-popover-panel{
      background: rgba(21, 31, 50, 0.94);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 22px 44px -8px rgba(0, 0, 0, 0.55);
    }
[data-dark="true"] #masterPhoneChassis .theme-swatch-item{
      background: rgba(30, 41, 59, 0.75);
    }
#masterPhoneChassis .swatch-orb-preview{
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(15, 23, 42, 0.1);
    }
#masterPhoneChassis .swatch-orb-preview.holo-animated{
      background: linear-gradient(135deg, #B2E2B4 0%, #8FDBB8 35%, #92C6F2 72%, #B9CFF8 100%) !important;
    }
#masterPhoneChassis .swatch-label{
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
#masterPhoneChassis .hero-center-block{
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }
#masterPhoneChassis .hero-eyebrow{ display: none; }
#masterPhoneChassis .portal-main-title{
      font-size: clamp(16.5px, 2.5dvh, 19px);
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      line-height: 1.25;
      margin-bottom: 5px;
      white-space: nowrap;
    }
#masterPhoneChassis .portal-subtitle{
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.35;
      font-weight: 500;
      white-space: nowrap;
    }
#masterPhoneChassis .gemini-search-card{
      background-color: var(--pill-surface);
      border-radius: 26px;
      padding: 6px 8px 6px 12px;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px -6px var(--search-glow), 0 2px 5px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.92);
      transition: box-shadow 0.35s ease, transform 0.25s ease;
    }
[data-dark="true"] #masterPhoneChassis .gemini-search-card{
      border-color: rgba(255, 255, 255, 0.1);
    }
#masterPhoneChassis .plus-action-btn{
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--theme-tag-bg);
      color: var(--theme-tag-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
[data-dark="true"] #masterPhoneChassis .plus-action-btn{
      background: rgba(255, 255, 255, 0.08);
      color: var(--orb-color-2);
    }
#masterPhoneChassis .search-input{
      border: none;
      outline: none;
      width: 100%;
      font-size: 13px;
      color: var(--text-primary);
      background: transparent;
      font-weight: 500;
      min-width: 0;
    }
#masterPhoneChassis .search-input::placeholder{
      color: var(--text-muted);
      font-weight: 400;
    }
#masterPhoneChassis .clear-input-btn{
      border: none;
      background: rgba(148, 163, 184, 0.18);
      color: var(--text-secondary);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
#masterPhoneChassis .clear-input-btn.visible{ display: inline-flex; }
#masterPhoneChassis .action-circle-btn{
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background-color: var(--send-circle-bg);
      color: var(--send-circle-icon);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
#masterPhoneChassis .arrow-up-svg{
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
#masterPhoneChassis .app-window-card{
      background-color: #FFFFFF;
      border-radius: 22px;
      padding: clamp(9px, 1.6dvh, 13px) 13px clamp(9px, 1.5dvh, 12px);
      border: 1px solid #E2E8F0;
      box-shadow: -8px 2px 18px rgba(15, 23, 42, 0.09),
                  0 8px 22px -4px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      user-select: none;
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
[data-dark="true"] #masterPhoneChassis .app-window-card{
      background-color: #151F32;
      border-color: #26334D;
      box-shadow: -10px 2px 22px rgba(0, 0, 0, 0.45),
                  0 8px 20px rgba(0, 0, 0, 0.3);
    }
#masterPhoneChassis .floating-card-app-header{
      position: absolute;
      top: clamp(-46px, -5.8dvh, -40px);
      left: 2px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      z-index: 5;
      transform-origin: left center;
      will-change: transform, opacity;
    }
#masterPhoneChassis .floating-squircle-icon{
      width: clamp(23px, 3.4dvh, 27px);
      height: clamp(23px, 3.4dvh, 27px);
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13.5px;
      flex-shrink: 0;
    }
#masterPhoneChassis .floating-app-name{
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
#masterPhoneChassis .app-window-card.is-non-focus .floating-app-name{
      opacity: 0;
      pointer-events: none;
      transform: translateX(-4px);
    }
#masterPhoneChassis .app-card-body{
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(5px, 1.05dvh, 8px);
      flex: 1;

    function startStackSpringToIndex(targetIdx, initialVelCardsPerSec = 0) {
      stopStackAnimation();
      const filtered = getStackProjects();
      if (!filtered.length) return;

      const clampedTarget = Math.max(0, Math.min(filtered.length - 1, targetIdx));
      activeStackIdx = clampedTarget;
      stackVelocity = initialVelCardsPerSec;
      stackLastFrameTime = performance.now();
      syncStackControlsUI(filtered);

      const step = (now) => {
        const dt = Math.min(0.032, Math.max(0.001, (now - stackLastFrameTime) / 1000));
        stackLastFrameTime = now;

        const dist = clampedTarget - stackScrollPos;
        if (Math.abs(dist) < 0.0012 && Math.abs(stackVelocity) < 0.008) {
          stackScrollPos = clampedTarget;
          stackVelocity = 0;
          stackAnimRaf = null;
          syncStackControlsUI(filtered);
          updateStackTransforms();
          return;
        }

        const nearFactor = Math.max(0, Math.min(1, 1 - Math.abs(dist) / 1.25));
        const stiffness = 120 + 70 * nearFactor;
        const damping = 19 + 8 * nearFactor;

        const accel = stiffness * dist - damping * stackVelocity;
        stackVelocity += accel * dt;
        stackScrollPos += stackVelocity * dt;

        const liveRounded = Math.max(0, Math.min(filtered.length - 1, Math.round(stackScrollPos)));
        if (liveRounded !== activeStackIdx) {
          activeStackIdx = liveRounded;
          syncStackControlsUI(filtered);
        }

        updateStackTransforms();
        stackAnimRaf = requestAnimationFrame(step);
      };

      stackAnimRaf = requestAnimationFrame(step);
    }

    // 模式 B：手指滑动松开后，复刻原生「高速低阻飞轮滑行 + 慢速细腻阻尼 + 首尾边界柔和回弹」
    function startStackFreeMomentum(initialVelCardsPerSec) {
      stopStackAnimation();
      const filtered = getStackProjects();
      if (!filtered.length) return;

      const maxIdx = Math.max(0, filtered.length - 1);
      stackVelocity = initialVelCardsPerSec;
      stackLastFrameTime = performance.now();
      let enteredBoundary = (stackScrollPos < 0 || stackScrollPos > maxIdx);

      const step = (now) => {
        const dt = Math.min(0.032, Math.max(0.001, (now - stackLastFrameTime) / 1000));
        stackLastFrameTime = now;

        if (stackScrollPos < 0 || stackScrollPos > maxIdx) {
          // 刚冲入首尾越界区时吸收多余冲击速度，使橡皮筋回弹紧凑自然
          if (!enteredBoundary) {
            enteredBoundary = true;
            stackVelocity = Math.sign(stackVelocity) * Math.min(Math.abs(stackVelocity), 3.8);

          const boundTarget = stackScrollPos < 0 ? 0 : maxIdx;
          const dist = boundTarget - stackScrollPos;
          const accel = 185 * dist - 27 * stackVelocity;
          stackVelocity += accel * dt;
          stackScrollPos += stackVelocity * dt;

            stackVelocity = 0;
            stackAnimRaf = null;
            activeStackIdx = boundTarget;
            syncStackControlsUI(filtered);
            updateStackTransforms();

          const spd = Math.abs(stackVelocity);
          const highSpeedFactor = Math.min(1, spd / 4.5);
          const dynamicFriction = 3.6 - 1.95 * highSpeedFactor;

          stackScrollPos += stackVelocity * dt;

            stackVelocity = 0;
            stackAnimRaf = null;
            const liveRounded = Math.max(0, Math.min(maxIdx, Math.round(stackScrollPos)));

            }
            updateStackTransforms();

        const liveRounded = Math.max(0, Math.min(maxIdx, Math.round(stackScrollPos)));
        if (liveRounded !== activeStackIdx) {
          activeStackIdx = liveRounded;
          syncStackControlsUI(filtered);
        }

        updateStackTransforms();
        stackAnimRaf = requestAnimationFrame(step);
      };

          setTimeout(() => {
            if (window.__hubTryEnter && window.__hubTryEnter(proj)) {
              // 交接给总汇后页面不卸载：飞出状态必须在这里收尾（与无 url
              // 分支同一套清理），否则焦点卡保持收缩/透明地留在层叠里，
              // 从子站返回时焦点区是空缺。__hubTryEnter 已在同一任务内
              // 同步点亮覆盖层，此刻复位不会被眼睛看到。
              if (stage) stage.style.zIndex = '';
              flyOffsetY = 0;
              flyShrinkK = 0;
              flyIdx = -1;
              updateStackTransforms();
              return;
            }
            window.location.href = proj.url;
          }, 200);
          return;
        }
        if (stage) stage.style.zIndex = '';
        flyOffsetY = 0;
        flyShrinkK = 0;
        flyIdx = -1;
        updateStackTransforms();
        openProjectPreview(proj.id);
      };

      if (!el) { finish(); return; }

      // 神奇效果目标（ken 2026-11-07 红圈定版）：吸进底部中间那颗
      // 「打开『当前项目』」胶囊钮的中心（圆点条就在它正上方、同属红圈区域）；
      // 位移在触发瞬间按真实矩形量好，之后每帧由层叠变换管线合成（不走 WAAPI）
      const target = document.getElementById('stackBottomPillBtn') || document.querySelector('#stackDotsBar .stack-dot.active') || document.querySelector('.gemini-search-card');
      const r = el.getBoundingClientRect();
      const tr = target.getBoundingClientRect();
      // 落点口径：层叠卡的 transform-origin 是 left center，收缩时整卡向
      // 「渲染后的左中点」塌缩，所以要让这个点落到胶囊钮中心，而不是卡片中心；
      // 位移还会被卡片当前的层叠缩放乘一次，先除掉
      const baseScale = el.offsetWidth ? (r.width / el.offsetWidth) : 1;
      flyShrinkDX = ((tr.left + tr.width / 2) - r.left) / baseScale;
      flyShrinkDY = ((tr.top + tr.height / 2) - (r.top + r.height / 2)) / baseScale;
      if (stage) stage.style.zIndex = '60';

      stopFlyAnimation();
      const start = performance.now();
      const DURATION = 460;
      const step = (now) => {
        const raw = Math.min(1, (now - start) / DURATION);
        flyShrinkK = raw < 0.5 ? 4 * raw * raw * raw : 1 - Math.pow(-2 * raw + 2, 3) / 2;
        updateStackTransforms();
        if (raw < 1) {
          flyAnimRaf = requestAnimationFrame(step);
        } else {
          flyAnimRaf = null;
          finish();
        }
      };
      flyAnimRaf = requestAnimationFrame(step);
    }
    function renderPortalCards() {
      stopStackAnimation();
      const filtered = getFilteredProjects();
      const grid = document.getElementById('contentGrid');
      const emptyHtml = `<div class="empty-state">${L(UI_TEXT.emptyState)}</div>`;

      grid.innerHTML = filtered.length === 0
        ? emptyHtml
        : filtered.map(proj => `<article class="app-window-card">${buildAppWindowCardHtml(proj, false)}</article>`).join('');

      const viewport = document.getElementById('stackViewport');
      const dotsBarEl = document.getElementById('stackDotsBar');

      if (filtered.length === 0) {
        viewport.innerHTML = emptyHtml;
        dotsBarEl.innerHTML = '';
        stackCardRefs = [];
        stackNameWidths = [];
        stackLastSig = [];
        return;
      }

      const stackList = filtered.filter(p => p.id !== STACK_EXCLUDED_ID);
      stackDomOrder = filtered.map(p => stackList.indexOf(p));
      activeStackIdx = Math.max(0, Math.min(stackList.length - 1, activeStackIdx));
      stackScrollPos = activeStackIdx;
      stackVelocity = 0;

      viewport.innerHTML = filtered.map((proj, idx) => {
        const stackPos = stackDomOrder[idx];
        return `
        <article
          class="app-window-card ${stackPos !== activeStackIdx ? 'is-stacked-card' : ''}"
          data-stack-idx="${stackPos}"
          ${stackPos >= 0 ? `onclick="handleStackCardClick(${stackPos})"` : 'style="display:none"'}
        >
          ${buildAppWindowCardHtml(proj, true)}
        </article>`;
      }).join('');

      dotsBarEl.innerHTML = stackList.map((_, idx) => `
        <button
          type="button"
          class="stack-dot ${idx === activeStackIdx ? 'active' : ''}"
          onclick="jumpToStackCard(${idx})"
          aria-label="切换到第 ${idx + 1} 张卡片"
        ></button>
      `).join('');

      // 性能：悬浮标题的元素引用与标题宽度在渲染时一次量好缓存，逐帧变换只读缓存，不再逐帧量布局
      stackCardRefs = Array.from(viewport.querySelectorAll('.app-window-card')).map(el => ({
        card: el,
        header: el.querySelector('.floating-card-app-header'),
        name: el.querySelector('.floating-app-name')
      }));
      stackNameWidths = stackCardRefs.map((refs, idx) => (stackDomOrder[idx] >= 0 && refs.name ? (refs.name.offsetWidth || 64) : 64));
      stackLastSig = [];
      measureStackMetrics();

      syncStackControlsUI(stackList);
      updateStackTransforms();
    }

    function syncStackControlsUI(filtered) {
      if (!filtered.length) return;
      const safeIdx = Math.max(0, Math.min(filtered.length - 1, activeStackIdx));
      const activeProj = filtered[safeIdx];
      const name = L(activeProj.shortApp);
      document.getElementById('stackViewport').querySelectorAll('.app-window-card').forEach((el, idx) => {
        el.classList.toggle('is-stacked-card', stackDomOrder[idx] !== safeIdx);
      });
      document.getElementById('stackDotsBar').querySelectorAll('.stack-dot').forEach((dot, idx) => {
        dot.classList.toggle('active', idx === safeIdx);
      });
      document.getElementById('stackBottomPillText').textContent = activeProj.url
        ? L([`打开「${name}」 ↗`, `Open ${name} ↗`])
        : L([`${name} · 筹备中`, `${name} · Upcoming`]);
    }

    // 复刻视频原生多任务连续指数阻尼曲线（左密 -> 中段双卡宽幅并排 -> 右侧平滑滑入）
    function measureStackMetrics() {
      const viewport = document.getElementById('stackViewport');
      const firstCard = stackCardRefs[0]?.card;
      stackMetrics = {
        vw: viewport.clientWidth || 376,
        cardH: firstCard?.offsetHeight || 330,
        cardW: firstCard?.offsetWidth || 290
      };
    }

    function updateStackTransforms(overridePos) {
      const cards = stackCardRefs;
      if (!cards.length) return;

      const pos = typeof overridePos === 'number' ? overridePos : stackScrollPos;
      const { vw, cardH, cardW } = stackMetrics;
      const focusLeft = Math.max(0, (vw - cardW) / 2);

      // 第一遍：按 C^∞ 连续指数+线性混合曲线计算每张卡片的像素坐标、缩放与透明度
      const states = cards.map(({ card: cardEl }, idx) => {
        const stackPos = typeof stackDomOrder[idx] === 'number' ? stackDomOrder[idx] : idx;
        const rel = stackPos - pos;
        const clampedRel = Math.max(-4.0, Math.min(1.5, rel));

        // 连续非对称指数展开曲线（经视频逐帧标尺拟合）：
        // rel=-2 -> 3.0%, rel=-1 -> 7.0%, rel=-0.5 -> 11.2%, rel=0 -> 19.6%, rel=+0.5 -> 41.8%, rel=+1.0 -> 97.6%
        const xPct = 7.2 + 2.3 * clampedRel + 12.4 * Math.pow(6.95, clampedRel);
        const tx = focusLeft + ((xPct - 19.6) * vw) / 100;

        const scale = rel <= 0
          ? Math.max(0.80, 1 + rel * 0.055)
          : 1 + Math.min(rel, 1.2) * 0.016;

        let opacity = 1;
        let visible = true;
        if (rel <= -3.35) {
          opacity = 0;
          visible = false;
        } else if (rel < -2.35) {
          opacity = (rel + 3.35) / 1.0;
        } else if (rel >= 1.15) {
          opacity = 0;
          visible = false;
        } else if (rel > 1.03) {
          opacity = 1 - (rel - 1.03) / 0.12;
        }

        // 层级口径：滑动时按原稿单调递增（右侧/前面的卡自然压住左侧卡）；
        // 只有正在上滑飞出的那张卡置顶 999，压过所有邻卡（ken 定：飞出卡在最上层）
        let zIndex = 20 + idx;
        if (stackPos === flyIdx && (flyShrinkK > 0 || flyOffsetY !== 0)) zIndex = 999;
        return { cardEl, idx, stackPos, rel, tx, scale, opacity, visible, zIndex };
      });

      // 第二遍：应用卡片矩阵，并根据相邻卡片实时像素间距计算顶部「图标+标题」同显与零碰撞避让
      states.forEach((st, idx) => {
        const { cardEl, stackPos, rel, tx, scale, opacity, visible, zIndex } = st;
        if (typeof stackPos === 'number' && stackPos < 0) {
          if (stackLastSig[idx] !== 'parked') {
            stackLastSig[idx] = 'parked';
            cardEl.style.display = 'none';
            cardEl.style.visibility = 'hidden';
            cardEl.style.pointerEvents = 'none';
          }
          return;
        }
        cardEl.classList.remove('is-non-focus');

        let finalOpacity = opacity;
        let flyTy = 0;
        let shrinkTf = '';
        let shrinkRadius = '';
        if (stackPos === flyIdx && flyOffsetY !== 0) {
          // 上推跟手全程不透明（ken 定）：透明只发生在松手后的神奇收缩里
          flyTy = flyOffsetY;
        }
        if (stackPos === flyIdx && flyShrinkK > 0) {
          const sx = flyShrinkDX * flyShrinkK;
          const sy = flyShrinkDY * flyShrinkK;
          const ssx = 1 - 0.96 * flyShrinkK;
          const ssy = 1 - 0.985 * flyShrinkK;
          shrinkTf = ` translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) scale(${ssx.toFixed(3)}, ${ssy.toFixed(3)})`;
          shrinkRadius = (flyShrinkK * 50).toFixed(1) + '%';
          finalOpacity = finalOpacity * Math.max(0, 1 - Math.max(0, (flyShrinkK - 0.72) / 0.28));
        }
        const cardTf = `translate3d(${tx.toFixed(1)}px, 0, 0) scale(${scale.toFixed(3)}) translateY(${flyTy.toFixed(1)}px)${shrinkTf}`;
        const cardOp = finalOpacity.toFixed(3);
        let headerTf = '', headerOp = '', nameTf = '', nameOp = '';

        const refs = stackCardRefs[idx];
        const headerEl = refs ? refs.header : cardEl.querySelector('.floating-card-app-header');
        const nameEl = refs ? refs.name : cardEl.querySelector('.floating-app-name');
        if (headerEl && nameEl) {
          // 抵消卡片中心缩放带来的顶部下沉，使焦点区与左侧卡片图标保持同一水平基线（还原视频顶栏轨道）
          const topDrop = (1 - scale) * (cardH * 0.5);
          const desiredDrop = rel < -1.15
            ? Math.min(10, Math.pow(Math.abs(rel + 1.15), 1.15) * 5.2)
            : 0;
          const headerTy = (desiredDrop - topDrop) / scale;
          const iconScale = (rel < -1.2 ? Math.max(0.86, 1 + (rel + 1.2) * 0.07) : 1) / scale;
          headerTf = `translate3d(0, ${headerTy.toFixed(1)}px, 0) scale(${iconScale.toFixed(3)})`;

          // 右侧边缘进入时的图标平滑渐显（避免静止时右侧边缘露半个图标）
          const rightEdgeFade = Math.max(0, Math.min(1, (vw - 10 - tx) / 22));
          const leftStackFade = rel >= -1.4 ? 1 : rel <= -2.05 ? 0 : (rel + 2.05) / 0.65;
          headerOp = (rightEdgeFade * leftStackFade).toFixed(3);

          // 计算当前卡片左边缘到右侧相邻卡片左边缘（或屏幕右界）的真实像素净空
          const rightBound = vw - 8;
          const nextCardTx = (idx + 1 < states.length && states[idx + 1].visible)
            ? Math.min(rightBound, states[idx + 1].tx)
            : rightBound;
          const availPx = Math.min(nextCardTx - tx, rightBound - tx);

          // 根据当前标题真实像素宽度动态计算显隐阈值，确保多卡并排时双标题同显、收拢时在触碰右侧图标前平滑淡出
          const textWidth = stackNameWidths[idx] || 64;
          const neededPx = 34 + textWidth;
          const fadeStart = neededPx - 8;
          const nameAlpha = Math.max(0, Math.min(1, (availPx - fadeStart) / 24));
          const nameShiftX = (1 - nameAlpha) * -5;
          nameOp = nameAlpha.toFixed(3);
          nameTf = `translate3d(${nameShiftX.toFixed(1)}px, 0, 0)`;
        }

        // 状态签名未变的卡片整帧跳过写入（静止/隐藏卡不再逐帧刷样式）
        const sig = [tx.toFixed(1), scale.toFixed(3), cardOp, flyTy.toFixed(1), flyShrinkK.toFixed(3), zIndex, shrinkRadius, visible ? 1 : 0, headerTf, headerOp, nameTf, nameOp].join('|');
        if (stackLastSig[idx] !== sig) {
          stackLastSig[idx] = sig;
          cardEl.style.display = '';
          cardEl.style.zIndex = String(zIndex);
          cardEl.style.visibility = visible ? 'visible' : 'hidden';
          cardEl.style.opacity = cardOp;
          cardEl.style.transform = cardTf;
          cardEl.style.borderRadius = shrinkRadius;
          cardEl.style.pointerEvents = visible ? 'auto' : 'none';
          if (headerEl && nameEl) {
            headerEl.style.transform = headerTf;
            headerEl.style.opacity = headerOp;
            nameEl.style.opacity = nameOp;
            nameEl.style.transform = nameTf;
          }
        }
      });
    }

    function handleStackCardClick(idx) {
      if (stackDragMoved) return;
      if (idx !== activeStackIdx || Math.abs(stackScrollPos - idx) > 0.04) {
        jumpToStackCard(idx);
      }
    }

    function jumpToStackCard(idx) {
      const filtered = getStackProjects();
      if (!filtered.length) return;
      const target = Math.max(0, Math.min(filtered.length - 1, idx));
      startStackSpringToIndex(target, stackVelocity * 0.35);
    }

    function stepStackCard(delta) {
      const filtered = getStackProjects();
      if (!filtered.length) return;
      const nextIdx = (activeStackIdx + delta + filtered.length) % filtered.length;
      startStackSpringToIndex(nextIdx, 0);
    }

    function triggerActiveCardAction() {
      // 点底部胶囊钮与上滑松手走同一条路：先神奇收缩吸进胶囊钮，再进项目
      triggerActiveCardFlyOut();
    }

    (function initStackCarouselGestures() {
      const viewport = document.getElementById('stackViewport');
      let startX = 0;
      let startY = 0;
      let dragAxis = null;
      let dragStartPos = 0;
      let samples = [];
      let vSamples = [];
      let downY = 0;
      let dragPaintRaf = null;
      function scheduleDragPaint() {
        if (dragPaintRaf !== null) return;
        dragPaintRaf = requestAnimationFrame(() => {
          dragPaintRaf = null;
          updateStackTransforms();
        });
      }
      function flushDragPaint() {
        if (dragPaintRaf === null) return;
        cancelAnimationFrame(dragPaintRaf);
        dragPaintRaf = null;
        updateStackTransforms();
      }

      function applyRubberBand(rawPos, maxIdx) {
        if (rawPos < 0) {
          return -0.42 * (1 - Math.exp(rawPos / 0.42));
        }
        if (rawPos > maxIdx) {
          const over = rawPos - maxIdx;
          return maxIdx + 0.42 * (1 - Math.exp(-over / 0.42));
        }
        return rawPos;
      }

      viewport.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        if (e.target.closest('button, a')) return;
        const filtered = getStackProjects();
        if (!filtered.length) return;

        // 支持在惯性滑行途中随时手指按住截停接管（Catch in flight）
        stopStackAnimation();
        stopFlyAnimation();
        flyShrinkK = 0;
        flyOffsetY = 0;
        document.getElementById('stackStageWrapper').style.zIndex = '';
        isStackDragging = true;
        downY = e.clientY;
        stackDragMoved = false;
        dragAxis = null;
        startX = e.clientX;
        startY = e.clientY;
        dragStartPos = stackScrollPos;
        stackVelocity = 0;
        vSamples = [];
        samples = [{ t: performance.now(), pos: stackScrollPos }];
        try { viewport.setPointerCapture(e.pointerId); } catch (_) {}
      });

      viewport.addEventListener('pointermove', (e) => {
        if (!isStackDragging) return;
        const filtered = getStackProjects();
        if (!filtered.length) return;

        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        const rawDY = e.clientY - downY;
        const mvNow = performance.now();
        vSamples.push({ t: mvNow, y: rawDY });
        while (vSamples.length > 1 && mvNow - vSamples[0].t > 100) vSamples.shift();

        // 等主导方向明确后锁轴；保留起始坐标并处理本次事件，避免首段位移丢失
        if (!dragAxis) {
          const ax = Math.abs(deltaX), ay = Math.abs(deltaY);
          if (ay > 8 && ay > ax * 1.15) dragAxis = 'v';
          else if (ax > 8 && ax > ay * 1.15) dragAxis = 'h';
          else if (ax > 24 || ay > 24) dragAxis = ay > ax ? 'v' : 'h';
          if (!dragAxis) return;
          if (dragAxis === 'v') {
            flyIdx = activeStackIdx;
            document.getElementById('stackStageWrapper').style.zIndex = '60';
          }
        }
        if (dragAxis === 'v') {
          stackDragMoved = true;
          flyOffsetY = deltaY < 0 ? deltaY : deltaY * 0.25;
          scheduleDragPaint();
          return;
        }
        if (Math.abs(deltaX) > 4) stackDragMoved = true;

        // 1:1 真实像素跟手比例：手指在主交互区划动距离与卡片实际位移严格匹配
        const pxPerCard = Math.max(132, stackMetrics.vw * 0.43);
        const rawPos = dragStartPos - deltaX / pxPerCard;
        stackScrollPos = applyRubberBand(rawPos, Math.max(0, filtered.length - 1));

        const now = performance.now();
        samples.push({ t: now, pos: stackScrollPos });
        while (samples.length > 1 && now - samples[0].t > 90) {
          samples.shift();
        }

        const liveRounded = Math.max(0, Math.min(filtered.length - 1, Math.round(stackScrollPos)));
        if (liveRounded !== activeStackIdx) {
          activeStackIdx = liveRounded;
          syncStackControlsUI(filtered);
        }

        scheduleDragPaint();
      });

      const endDrag = () => {
        if (!isStackDragging) return;
        isStackDragging = false;
        flushDragPaint();

        if (dragAxis === 'v') {
          dragAxis = null;
          // 触发口径：推过 -45px，或者短距离快速上甩（末段速度够快）；
          // 原 -70px 在真机上约等于 185 物理像素，多数自然推滑到不了
          let vVel = 0;
          let rawY = flyOffsetY;
          if (vSamples.length >= 2) {
            const va = vSamples[0], vb = vSamples[vSamples.length - 1];
            rawY = vb.y;
            if (vb.t > va.t) vVel = (vb.y - va.y) / (vb.t - va.t);
          }
          if (rawY < -45 || (rawY < -25 && vVel < -0.4)) {
            triggerActiveCardFlyOut();
          } else if (flyOffsetY !== 0) {
            tweenFlyTo(0, 220, (k) => 1 - Math.pow(1 - k, 3), () => {
              flyIdx = -1;
              document.getElementById('stackStageWrapper').style.zIndex = '';
            });
          }
          setTimeout(() => { stackDragMoved = false; }, 0);
          return;
        }
        dragAxis = null;

        const filtered = getStackProjects();
        if (!filtered.length) return;

        const now = performance.now();
        while (samples.length > 1 && now - samples[0].t > 90) {
          samples.shift();
        }

        let rawVel = 0;
        const last = samples[samples.length - 1];
        if (last && now - last.t < 75 && samples.length >= 2) {
          // 优先提取离屏前最后 20~48ms 冲刺段的峰值速度，避免起步慢速段拉低大力甩动的爆发力
          const first = samples[0];
          const dtTotal = (last.t - first.t) / 1000;
          if (dtTotal > 0.006) {
            rawVel = (last.pos - first.pos) / dtTotal;
          }
          for (let i = samples.length - 2; i >= 0; i--) {
            const dtSeg = (last.t - samples[i].t) / 1000;
            if (dtSeg >= 0.014 && dtSeg <= 0.052) {
              const segVel = (last.pos - samples[i].pos) / dtSeg;
              if (segVel * rawVel >= 0 && Math.abs(segVel) > Math.abs(rawVel)) {
                rawVel = segVel;
              }
            }
          }
        }

        // 高速轻拂非线性动能放大（Fling Boost）：慢划保持细腻可控，大力快甩自动激发飞轮长距滑行
        const speed = Math.abs(rawVel);
        const boostedSpeed = speed <= 2.4
          ? speed
          : 2.4 + Math.pow(speed - 2.4, 1.26) * 1.58;
        const releaseVel = Math.sign(rawVel) * Math.min(42, boostedSpeed);

        startStackFreeMomentum(releaseVel);
        setTimeout(() => { stackDragMoved = false; }, 0);
      };

      // 松手监听挂在 window 上：上推时手指常停在卡片区之外的页头区域，
      // 个别浏览器不认指针捕获时，绑在卡片区上的 pointerup 会丢、整轮手势不结算
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      // 支持触控板双指连续滑动与鼠标滚轮流体推动
      viewport.addEventListener('wheel', (e) => {
        const filtered = getStackProjects();
        if (filtered.length <= 1) return;
        const dominantDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(dominantDelta) < 1) return;
        e.preventDefault();

        stopStackAnimation();
        const vw = viewport.clientWidth || 376;
        const pxPerCard = Math.max(132, vw * 0.43);
        const maxIdx = Math.max(0, filtered.length - 1);
        stackScrollPos = applyRubberBand(stackScrollPos + dominantDelta / pxPerCard, maxIdx);

        const liveRounded = Math.max(0, Math.min(maxIdx, Math.round(stackScrollPos)));
        if (liveRounded !== activeStackIdx) {
          activeStackIdx = liveRounded;
          syncStackControlsUI(filtered);
        }
        updateStackTransforms();

        startStackFreeMomentum((dominantDelta / pxPerCard) * 5.2);
      }, { passive: false });

      window.addEventListener('resize', () => {
        if (currentDisplayMode === 'stack') { measureStackMetrics(); updateStackTransforms(); }
      });
      if ('ResizeObserver' in window) {
        new ResizeObserver(() => {
          if (currentDisplayMode === 'stack') { measureStackMetrics(); updateStackTransforms(); }
        }).observe(viewport);
      }
    })();

    // ================= 7. 12 色主题渲染与手势 =================
    function applyThemeByGlobalIndex(index) {
      currentGlobalThemeIndex = index;
      const t = allThemes[index];
      if (!t) return;

      const root = document.documentElement;
      root.style.setProperty('--orb-color-1', t.orb1);
      root.style.setProperty('--orb-color-2', t.orb2);
      root.style.setProperty('--refresh-btn-bg', t.refreshBg);
      root.style.setProperty('--send-circle-bg', t.sendCircleBg);
      root.style.setProperty('--theme-accent', t.accent);
      root.style.setProperty('--theme-tag-bg', t.tagBg);
      root.style.setProperty('--theme-tag-text', t.tagText);
      root.style.setProperty('--search-glow', t.glow);

      if (t.isHolo) root.setAttribute('data-holo', 'true');
      else root.removeAttribute('data-holo');

      if (!isDarkMode) root.style.setProperty('--page-bg', t.pageBg);

      const orbLeft = document.getElementById('orbLeft');
      const orbRight = document.getElementById('orbRight');
      if (!t.isHolo) {
        const shift = index % 2 === 0 ? 1 : -1;
        orbLeft.style.transform = `translate3d(${shift * 14}px, ${-shift * 8}px, 0) scale(${1 + shift * 0.04})`;
        orbRight.style.transform = `translate3d(${-shift * 14}px, ${shift * 8}px, 0) scale(${1 - shift * 0.04})`;
      } else {
        orbLeft.style.transform = orbRight.style.transform = '';
      }

      document.querySelectorAll('.theme-swatch-item').forEach(el => {
        el.classList.toggle('active', Number(el.getAttribute('data-theme-idx')) === currentGlobalThemeIndex);
      });
    }

    function renderThemeSwatches() {
      document.getElementById('themeSwatchGrid').innerHTML = allThemes.map((t, idx) => `
        <div class="theme-swatch-item ${idx === currentGlobalThemeIndex ? 'active' : ''}" data-theme-idx="${idx}" onclick="selectThemeFromPanel(${idx})">
          <span class="swatch-orb-preview ${t.isHolo ? 'holo-animated' : ''}" style="background: linear-gradient(135deg, ${t.orb1} 0%, ${t.orb2} 65%, ${t.refreshBg} 100%);"></span>
          <span class="swatch-label">${t.num} · ${L(t.label)}</span>
        </div>
      `).join('');
    }

    function openThemePanel() {
      document.getElementById('themePopover').classList.add('open');
      document.getElementById('themeBackdrop').classList.add('open');
      if (navigator.vibrate) navigator.vibrate(18);
    }

    function closeThemePanel() {
      document.getElementById('themePopover').classList.remove('open');
      document.getElementById('themeBackdrop').classList.remove('open');
      document.querySelectorAll('.theme-swatch-item').forEach(el => el.classList.remove('sliding-hover'));
    }

    function selectThemeFromPanel(idx) {
      applyThemeByGlobalIndex(idx);
      saveHomePrefs();
      writeSharedA();
      closeThemePanel();
    }

    (function initThemeButtonGestures() {
      const btn = document.getElementById('darkModeBtn');
      let pressTimer = null, isLongPress = false, isDown = false, lastIdx = null;

      btn.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        isDown = true;
        isLongPress = false;
        lastIdx = null;
        btn.classList.add('pressing');
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        pressTimer = setTimeout(() => {
          if (isDown) { isLongPress = true; openThemePanel(); }
        }, 340);
      });

      btn.addEventListener('pointermove', (e) => {
        if (!isDown || !isLongPress) return;
        const target = document.elementFromPoint(e.clientX, e.clientY);
        const swatch = target ? target.closest('.theme-swatch-item') : null;
        document.querySelectorAll('.theme-swatch-item').forEach(el => el.classList.toggle('sliding-hover', el === swatch));
        if (swatch) {
          const idx = Number(swatch.getAttribute('data-theme-idx'));
          if (idx !== lastIdx) {
            lastIdx = idx;
            applyThemeByGlobalIndex(idx);
            if (navigator.vibrate) navigator.vibrate(8);
          }
        }
      });

      const finish = () => {
        if (!isDown) return;
        isDown = false;
        clearTimeout(pressTimer);
        btn.classList.remove('pressing');
        if (!isLongPress) {
          if (document.getElementById('themePopover').classList.contains('open')) closeThemePanel();
          else toggleDarkMode();
        } else if (lastIdx !== null) {
          saveHomePrefs();
          writeSharedA();
          closeThemePanel();
        }
      };

      btn.addEventListener('pointerup', finish);
      btn.addEventListener('pointercancel', finish);
      btn.addEventListener('contextmenu', e => e.preventDefault());
    })();

    // ================= 7b. 跨子域名共享偏好 Cookie A + 本站持久化（与 ip-check / cloud-phone 同口径） =================
    function readSharedA(){try{var m=document.cookie.match(/(?:^|;\s*)A=(\d{3,4})(?:;|$)/);if(!m)return null;var v=m[1],tt=parseInt(v.slice(2),10);if(v.charAt(1)!=='0'&&v.charAt(1)!=='1')return null;if(!(tt>=1&&tt<=12))return null;return{l:v.charAt(0),m:v.charAt(1),t:tt};}catch(e){return null;}}
    function writeSharedA(){try{var h=location.hostname,s='A='+(currentLang==='en'?'1':'0')+(isDarkMode?'0':'1')+(currentGlobalThemeIndex+1)+';path=/;max-age=31536000;SameSite=Lax';if(h==='jpedu.asia'||h.slice(-11)==='.jpedu.asia')s+=';domain=jpedu.asia';if(location.protocol==='https:')s+=';Secure';document.cookie=s;}catch(e){}}
    function saveHomePrefs(){try{localStorage.setItem('home-theme-idx',String(currentGlobalThemeIndex));localStorage.setItem('home-dark',isDarkMode?'1':'0');localStorage.setItem('home-lang',currentLang);}catch(e){}}
    if (window.__homeInit && window.__homeInit.seed) writeSharedA();

    // ================= 8. 统一的多语言渲染与日夜切换 =================
    function syncStaticUIText() {
      [
        'langText', 'heroEyebrow', 'mainTitle', 'subTitle',
        'panelTitle', 'panelHint'
      ].forEach(id => {
        document.getElementById(id).textContent = L(UI_TEXT[id]);
      });
      document.getElementById('modeStackLabel').textContent = L(UI_TEXT.modeStackBtn);
      document.getElementById('modeGridLabel').textContent = L(UI_TEXT.modeGridBtn);
      document.getElementById('searchInput').placeholder = L(UI_TEXT.searchPlaceholder);
      applyThemeByGlobalIndex(currentGlobalThemeIndex);
      renderThemeSwatches();
      renderPortalCards();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
      saveHomePrefs();
      writeSharedA();
      syncStaticUIText();
    }

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      const root = document.documentElement;
      const btn = document.getElementById('darkModeBtn');
      btn.classList.add('rotating');
      setTimeout(() => btn.classList.remove('rotating'), 450);

      if (isDarkMode) {
        root.setAttribute('data-dark', 'true');
        root.style.setProperty('--page-bg', '#0B111E');
      } else {
        root.removeAttribute('data-dark');
        root.style.setProperty('--page-bg', allThemes[currentGlobalThemeIndex].pageBg);
      }
      document.getElementById('sunMoonIcon').innerHTML = isDarkMode ? MOON_SVG : SUN_SVG;
      saveHomePrefs();
      writeSharedA();
    }

    // ================= 9. 搜索与弹窗逻辑 =================
    function resetCategoryFilter() {
      clearSearch();
    }

    let searchRenderTimer = null;
    function handleSearchInput() {
      const val = document.getElementById('searchInput').value.trim();
      document.getElementById('clearBtn').classList.toggle('visible', val.length > 0);
      activeStackIdx = portalProjects.length - 1;
      if (searchRenderTimer) clearTimeout(searchRenderTimer);
      searchRenderTimer = setTimeout(() => { searchRenderTimer = null; renderPortalCards(); }, 140);
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      if (searchRenderTimer) { clearTimeout(searchRenderTimer); searchRenderTimer = null; }
      document.getElementById('clearBtn').classList.remove('visible');
      activeStackIdx = portalProjects.length - 1;
      renderPortalCards();
    }

    function triggerSearchFocus() {
      const input = document.getElementById('searchInput');
      if (!input.value.trim()) input.focus();
      else renderPortalCards();
    }

    function openProjectPreview(projectId) {
      const proj = portalProjects.find(p => p.id === projectId);
      if (!proj) return;

      document.getElementById('modalItemTitle').innerHTML = `<span style="color:${proj.iconColor}">${proj.icon}</span> ${siteEscape(L(proj.title))}`;
      document.getElementById('modalItemSub').textContent = `${L(proj.status)} · ${proj.path || L(['筹备中', 'Coming Soon'])}`;

      const targetHref = proj.url || './';
      const actionLabel = proj.url ? L(['进入 ↗', 'Open ↗']) : L(['筹备中', 'Soon']);
      document.getElementById('modalSellerList').innerHTML = proj.modules.map(([tag, name, desc]) => `
        <a class="modal-seller-item" href="${siteEscape(targetHref)}">
          <span class="modal-seller-price">${siteEscape(tag)}</span>
          <div class="modal-seller-info">
            <div class="modal-seller-shop">${siteEscape(name)}</div>
            <div class="modal-seller-meta">${siteEscape(desc)}</div>
          </div>
          <span class="site-offer-link">${actionLabel}</span>
        </a>
      `).join('');

      document.getElementById('sameSourceModalBackdrop').classList.add('open');
    }

    function closeSameSourceModal(e) {
      if (e && e.target && e.target.id !== 'sameSourceModalBackdrop') return;
      document.getElementById('sameSourceModalBackdrop').classList.remove('open');
    }

    // 初始化渲染
    document.getElementById('sunMoonIcon').innerHTML = isDarkMode ? MOON_SVG : SUN_SVG;
    syncStaticUIText();
  </script>
