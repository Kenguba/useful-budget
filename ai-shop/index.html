}
function norm(s){return String(s??'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');}
function subseq(needle,hay){let i=0; for(const ch of hay){if(ch===needle[i]) i++; if(i===needle.length) return true;} return i===needle.length;}
function fuzzy(q){
  const texts=Array.prototype.slice.call(arguments,1).join(' ');
  const hay=norm(texts);
  const nq=norm(q);
  if(!nq) return true;
  if(hay.includes(nq)) return true;
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(tok=>{const nt=norm(tok); return !nt||hay.includes(nt)||(nt.length>=3&&subseq(nt,hay));});
}

    let shown=0;
    const rows=g.items.map((it,ii)=>{
        if(q&&!fuzzy(q,it.title,it.shop,it.platform)) return '';
        shown++;
        return '<div class="row" id="it-'+esc(g.id)+'-'+ii+'"><div class="price">'+fmtP(it.price)+'<small>'+esc(it.platform)+'</small></div><div class="main"><div class="title"><a data-anchor="it-'+esc(g.id)+'-'+ii+'" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></div><div class="info">'+(it.stock===0?'<span class="tag soldout">已售罄</span>':'')+(it.kind?'<span class="tag">'+esc(it.kind)+'</span>':'')+(it.same_source>1?'<button type="button" class="tag grey srcbtn" data-src="'+gi+':'+ii+'" aria-haspopup="dialog">同源铺货共 '+it.same_source+' 家</button>':'')+esc(it.shop)+' · '+stockTxt(it)+'</div></div></div>';
      }).join('');
    if(q&&!shown) return '';
    return '<div class="group" id="grp-'+esc(g.id)+'"><h2>'+esc(g.name)+'</h2><div class="cnt">有货最低 '+g.items.length+' 条'+(g.items.length<30?'（不足 30 条，如实显示）':'')+'</div>'+rows+'</div>';
  }).join('')||'<p class="sub">'+(q?'没有匹配的报价。报价单只收录每组最低 30 条，找某家店请切到「店铺目录」搜。':'没有匹配的报价。')+'</p>';
  document.querySelectorAll('.leader').forEach(el=>{
    el.addEventListener('click',()=>{
      const t=document.getElementById('grp-'+el.dataset.gid);
      if(!t) return;
      try{ history.pushState(null,'','#grp-'+el.dataset.gid); }catch(e){}
      t.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
  const go=$('#gotoShops');
  if(go) go.onclick=()=>{ shopShown=300; switchTab(true); renderShops(); };
}
function renderShops(){
  if(!shops){$('#shopList').innerHTML=SKEL_SHOPS;return;}
  const q=$('#q').value.trim().toLowerCase();
  const list=shops.shops.filter(s=>(shopFilter==='全部'||s.platform===shopFilter)&&(!q||fuzzy(q,s.name,s.platform,s.code)));
  $('#shopMeta').textContent='共 '+list.length+' 家（目录快照 '+shops.updated_at+' · 同店多平台/多代码分别列）';
  shopListTotal=list.length;
  $('#shopList').innerHTML=list.slice(0,shopShown).map(s=>'<div class="shop">'+(s.url?'':'<span class="only">仅店名</span>')+'<div class="nm">'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+' ↗</a>':esc(s.name))+'</div><div class="pf">'+esc(s.platform)+(s.code?' · '+esc(s.code):'')+'</div></div>').join('');
}
function switchTab(shopsView){
  $('#q').placeholder=shopsView?'搜店名，如 985ai':'搜商品或店名，如 xai 超市';
  $('#tabBoard').classList.toggle('on',!shopsView);
  $('#tabShops').classList.toggle('on',shopsView);
  $('#viewBoard').classList.toggle('hide',shopsView);
  $('#viewShops').classList.toggle('hide',!shopsView);
  if(shopsView&&!shops)renderShops();
}
/* 同源店铺弹窗：单一状态源 + 打开/关闭生命周期（遮罩/Esc/焦点还原/inert/减少动态），样式与交互语言对齐 daymark 弹窗规范 */
const srcOverlay=$('#srcOverlay'), srcSheet=$('#srcSheet'), pageWrap=document.querySelector('.wrap');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let srcIsOpen=false, srcOpener=null, srcCloseTimer=0, srcHist=false, srcScrollY=0, srcLocked=false, srcPrevSR=null;
function lockScroll(){
  if(srcLocked) return;
  srcLocked=true;
  srcScrollY=window.scrollY||0;
  const b=document.body;
  b.style.overflow='hidden'; b.style.position='fixed'; b.style.top=(-srcScrollY)+'px';
  b.style.left='0'; b.style.right='0'; b.style.width='100%';
}
function unlockScroll(){
  if(!srcLocked) return;
  srcLocked=false;
  const b=document.body;
  b.style.overflow=''; b.style.position=''; b.style.top=''; b.style.left=''; b.style.right=''; b.style.width='';
  window.scrollTo(0,srcScrollY);
}
function openSrc(gi,ii,btn){
  const g=board&&board.groups[gi]; const it=g&&g.items[ii]; if(!it) return;
  const list=(it.sources&&it.sources.length)?it.sources:[{price:it.price,shop:it.shop,platform:it.platform,stock:it.stock,url:it.url}];
  $('#srcTitle').textContent=it.title;
  $('#srcPill').textContent='共 '+it.same_source+' 家';
  $('#srcList').innerHTML=list.map((s,i)=>'<a class="src-row" style="--i:'+Math.min(i,12)+'" data-anchor="it-'+esc(g.id)+'-'+ii+'" href="'+esc(s.url)+'" target="_blank" rel="noopener"><span class="sp">'+fmtP(s.price)+'</span><span class="sm2"><span class="sn">'+esc(s.shop)+(i===0?'<span class="lowtag">最低价</span>':'')+'</span><span class="si">'+esc(s.platform||'')+' · '+stockTxt(s)+'</span></span><span class="go">›</span></a>').join('');
  const extra=it.same_source-list.length;
  const note=$('#srcNote');
  note.textContent=extra>0?('已列出 '+list.length+' 家有独立商品链接的；其余 '+extra+' 家是聚合站的同源合并计数，没有单独链接。'):'';
  note.style.display=extra>0?'':'none';
  clearTimeout(srcCloseTimer);
  srcOpener=btn||document.activeElement;
  try{ srcPrevSR=history.scrollRestoration; history.scrollRestoration='manual'; }catch(e){ srcPrevSR=null; }
  try{ history.pushState({museSrcPopup:1},''); srcHist=true; }catch(e){ srcHist=false; }
  srcOverlay.hidden=false;
  srcOverlay.setAttribute('aria-hidden','false');
  if('inert' in pageWrap) pageWrap.inert=true;
  lockScroll();
  srcSheet.scrollTop=0;
  void srcOverlay.offsetHeight;
  requestAnimationFrame(()=>{ if(srcOverlay.hidden) return; srcOverlay.classList.add('open'); srcIsOpen=true; const c=srcSheet.querySelector('.btn-close'); if(c) c.focus({preventScroll:true}); });
}
function closeSrc(fromPop){
  if(!srcIsOpen) return;
  srcIsOpen=false;
  if(!fromPop&&srcHist){ srcHist=false; try{ history.back(); }catch(e){} }
  srcOverlay.classList.remove('open');
  srcOverlay.setAttribute('aria-hidden','true');
  if('inert' in pageWrap) pageWrap.inert=false;
  const back=srcOpener; srcOpener=null;
  if(back&&back.isConnected) back.focus({preventScroll:true});
  clearTimeout(srcCloseTimer);
  /* 背景保持冻结，直到面板完全落下才在同一帧里解锁+还原位置+隐藏，避免返回时背景抢先重排闪一帧 */
  srcCloseTimer=setTimeout(()=>{
    if(srcIsOpen) return;
    srcOverlay.hidden=true;
    unlockScroll();
    if(srcPrevSR!==null){ try{ history.scrollRestoration=srcPrevSR; }catch(e){} srcPrevSR=null; }
  }, reducedMotion?0:580);
}
window.addEventListener('popstate',()=>{ if(srcIsOpen){ srcHist=false; closeSrc(true); } });
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-src]');
  if(b&&board){ const p=b.dataset.src.split(':'); openSrc(Number(p[0]),Number(p[1]),b); }
});
srcOverlay.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSrc(); });
document.addEventListener('keydown',e=>{
  if(!srcIsOpen) return;
  if(e.key==='Escape'){ e.preventDefault(); closeSrc(); return; }
  if(e.key!=='Tab') return;
  const f=[...srcSheet.querySelectorAll('a[href],button:not([disabled])')].filter(n=>n.getClientRects().length);
  if(!f.length){ e.preventDefault(); return; }
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
});
$('#tabBoard').onclick=()=>switchTab(false);
$('#tabShops').onclick=()=>switchTab(true);
$('#q').oninput=()=>{ if($('#viewShops').classList.contains('hide')) renderBoard(); else { shopShown=300; renderShops(); } };
// 触底加载：哨兵进入视口附近时自动加载下一批，带加载特效
new IntersectionObserver(es=>{
  if(!es[0].isIntersecting||shopLoading||!shops) return;
  if($('#viewShops').classList.contains('hide')) return;
  if(shopShown>=shopListTotal) return;
  shopLoading=true;
  $('#shopLoading').classList.remove('hide');
  setTimeout(()=>{ shopShown+=300; renderShops(); $('#shopLoading').classList.add('hide'); shopLoading=false; },350);
},{rootMargin:'300px'}).observe($('#shopSentinel'));
// 锚点路由：点商品离开前先把 #it-<组>-<序号>（或 #grp-<组>）写入地址并留一条历史，
// 从商品页返回时按锚点滚回那一条并高亮；带锚点的链接也可直接分享定位。
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-anchor]');
  if(a){ try{ history.pushState(null,'','#'+a.dataset.anchor); }catch(err){} }
});
function jumpToHash(){
  const id=(location.hash||'').slice(1);
  if(!id) return;
  const el=document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({block:'start'});
}
window.addEventListener('hashchange',jumpToHash);
window.addEventListener('scroll',()=>{
  if(window.scrollY<=0&&location.hash&&!srcIsOpen){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }
},{passive:true});
window.addEventListener('pageshow',()=>setTimeout(jumpToHash,60));
const REFRESH_API='https://ai.jpedu.asia/api/refresh-board';
const STOCK_API='https://ai.jpedu.asia/api/stock-check';
let stockVerifiedFor=null;
async function verifyStocks(){
  if(!board||stockVerifiedFor===board.updated_at) return;
  const ver=board.updated_at; stockVerifiedFor=ver;
  try{
    const all=await Promise.all(board.groups.map(async (g,gi)=>{
      const r=await fetch(STOCK_API+'?group='+encodeURIComponent(g.id)+(gi===0?'&esc=1':'')).then(x=>x.json()).catch(()=>null);
      return (r&&r.ok)?r.results:null;
    }));
    let changed=false;
    board.groups.forEach((g,gi)=>{
      const res=all[gi]; if(!res) return;
      const kept=[];
      g.items.forEach(it=>{
        const v=Object.prototype.hasOwnProperty.call(res,it.url)?res[it.url]:undefined;
        if(typeof v==='number'&&v<=0){ changed=true; return; } // 找不到(-1)/没库存(0)：去除
        if(typeof v==='number'&&it.stock!==v){
          it.stock=v; changed=true;
          (it.sources||[]).forEach(s=>{if(s.url===it.url) s.stock=v;});
        }
        kept.push(it);
      });
      g.items=kept;
    });
    if(changed&&board&&board.updated_at===ver) renderBoard();
  }catch(e){}
}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
async function reloadData(){const [b,s]=await Promise.all([fetch('data/board.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('data/shops.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())]);board=b;shops=s;fillMeta(b);renderBoard();renderShops();verifyStocks();}
$('#refreshBtn').onclick=async()=>{const btn=$('#refreshBtn');const oldMeta=board?board.updated_at:null;btn.disabled=true;btn.classList.add('loading');try{const r=await fetch(REFRESH_API,{method:'POST'});const j=await r.json().catch(()=>({}));if(j&&j.mode==='cooldown'){await reloadData();showToast(j.source==='auto'?'系统刚自动刷新过，数据更新中':'5 分钟内已刷新过，已加载最新快照');}else if(j&&j.ok){showToast('正在刷新，稍等片刻');let done=false;for(let i=0;i<20;i++){await new Promise(res=>setTimeout(res,8000));try{const nb=await fetch('data/board.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.json());if(nb.updated_at&&nb.updated_at!==oldMeta){await reloadData();showToast('已刷新到最新数据');done=true;break;}}catch(e){}}if(!done)showToast('刷新超时，请稍后再点一次');}else{showToast('刷新服务暂不可用');}}catch(e){showToast('刷新服务暂不可用');}btn.disabled=false;btn.classList.remove('loading');};
function fillMeta(b){const mt=$('#metaTime'),mc=$('#metaCount');mt.textContent=b.updated_at;mt.className='';mc.textContent=b.groups.reduce((a,g)=>a+g.items.length,0);mc.className='';}
if(window.INLINE_BOARD){
  board=window.INLINE_BOARD;
  fillMeta(board);
  renderBoard();
  verifyStocks();
  setTimeout(jumpToHash,60);
}else{
  $('#refreshBtn').classList.add('loading');
}
fetch('data/board.json',{cache:'no-store'}).then(r=>r.json()).then(b=>{
  $('#refreshBtn').classList.remove('loading');
  if(!board||b.updated_at!==board.updated_at){board=b;fillMeta(board);renderBoard();}
  verifyStocks();
}).catch(e=>{$('#refreshBtn').classList.remove('loading');if(!board){const mt=$('#metaTime'),mc=$('#metaCount');mt.textContent='—';mt.className='';mc.textContent='—';mc.className='';$('#leaders').innerHTML='';$('#groups').innerHTML='<p class="sub">数据加载失败，请稍后刷新。</p>';}});
fetch('data/shops.json').then(r=>r.json()).then(s=>{
  shops=s;
  const plats=['全部',...new Set(s.shops.map(x=>x.platform))];
  $('#chips').innerHTML=plats.map(p=>'<button data-p="'+esc(p)+'"'+(p==='全部'?' class="on"':'')+'>'+esc(p)+'</button>').join('');
  document.querySelectorAll('#chips button').forEach(btn=>btn.onclick=()=>{shopFilter=btn.dataset.p;shopShown=300;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===btn));renderShops();});
  renderShops();
  if(board)renderBoard();
}).catch(e=>{});
</script>
</body>
