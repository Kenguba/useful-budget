<style>
    /* ================= 1. 核心动态 CSS 变量体系 ================= */
    :root {
      /* 顶部弥散渐变与双光斑色值（默认01：冰川晴空） */
      --hero-bg-base: #FFFFFF;
      --orb-color-1: #BCE0FD;
      --orb-color-2: #93C5FD;
      
      /* 按钮与组件专属联动色 */
      --refresh-btn-bg: #74B9FF;       /* 刷新数据按钮底色 */
      --refresh-btn-text: #FFFFFF;     /* 刷新按钮文字色 */
      --send-circle-bg: #9CCAF9;       /* 搜索框右侧圆形按钮色 */
      --send-circle-icon: #0F172A;     /* 搜索框右侧圆形按钮箭头色 */
      
      /* 主题强调色与标签配比（联动下方列表与右上角地球图标） */
      --theme-accent: #2563EB;         /* 价格、地球图标、品牌竖条、激活色 */
      --theme-tab-text: #0F172A;       /* Tab 选中文字色 */
      --theme-tag-bg: #EBF5FF;         /* 商品卡片标签底色 */
      --theme-tag-text: #1D4ED8;       /* 商品卡片标签文字色 */
      --search-glow: rgba(147, 197, 253, 0.38); /* 搜索框弥散光晕阴影 */

      /* 下方页面背景与卡片表面色（随主题微染 + 支持深色模式） */
      --page-bg: #F4F8FC;
      --card-bg: #FFFFFF;
      --card-border: rgba(226, 232, 240, 0.75);
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --pill-surface: #FFFFFF;
      --pill-shadow: 0 6px 20px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    /* 深色模式覆盖变量（单击右上角太阳按钮切换） */
    [data-dark="true"] {
      --hero-bg-base: #0B1120;
      --page-bg: #090D16;
      --card-bg: #151F32;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --pill-surface: #1E293B;
      --pill-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --theme-tab-text: #F8FAFC;
    }

    [data-dark="true"] body {
      background-image: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-variant-numeric: tabular-nums;
      background-color: var(--page-bg);
      background-image:
        radial-gradient(120% 700px at 26% 0%, color-mix(in srgb, var(--orb-color-1) 8%, transparent) 0%, transparent 100%),
        radial-gradient(120% 700px at 74% 0%, color-mix(in srgb, var(--orb-color-2) 8%, transparent) 0%, transparent 100%);
      background-repeat: no-repeat;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.55s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
    }

    /* 居中移动端/平板自适应容器 */
    .app-container {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 48px;
    }

    /* ================= 2. 顶部弥散渐变区域 ================= */
    .hero-header {
      position: relative;
      background-color: var(--hero-bg-base);
      background-image:
        radial-gradient(115% 185px at 26% calc(100% - 120px), color-mix(in srgb, var(--orb-color-1) 42%, transparent) 0%, transparent 88%),
        radial-gradient(115% 185px at 74% calc(100% - 120px), color-mix(in srgb, var(--orb-color-2) 42%, transparent) 0%, transparent 88%);
      padding: 16px 18px 26px;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      box-shadow: 0 10px 24px -12px rgba(15, 23, 42, 0.12);
      transition: background-color 0.55s ease, box-shadow 0.6s ease;
      z-index: 10;
    }

    [data-dark="true"] .hero-header {
      background-image: none;
    }



    /* 第12号全息主题：按钮流光渐变（保留静态渐变与流光，去光斑后仍为该主题签名） */
    @keyframes videoHoloBtn {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    [data-holo="true"] .refresh-btn {
      background: linear-gradient(120deg, #56C596, #4FA8F6, #74B9FF, #68D391);
      background-size: 240% 240%;
      animation: videoHoloBtn 4.2s ease infinite;
    }

    [data-holo="true"] .action-circle-btn {
      background: linear-gradient(135deg, #B2E2B4 0%, #98DBC5 45%, #9CC8F7 100%);
      background-size: 200% 200%;
      animation: videoHoloBtn 4.2s ease infinite;
    }

    /* 顶部第一行：左侧品牌标识 + 右上角组件 */
    .top-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.6px;
      color: var(--text-secondary);
    }

    .brand-bar {
      width: 4px;
      height: 15px;
      background-color: var(--theme-accent);
      border-radius: 3px;
      margin-right: 8px;
      transition: background-color 0.45s ease;
    }

    /* ================= 3. 右上角语言胶囊 + 日夜圆形按钮（支持单击&长按） ================= */
    .top-right-widgets {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    /* 「🌐 中文」胶囊按钮 */
    .lang-pill-btn {
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease,
                  background-color 0.4s ease;
    }

    [data-dark="true"] .lang-pill-btn,
    [data-dark="true"] .theme-mode-btn {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .lang-pill-btn:hover {
      transform: translateY(-1px);
    }

    .lang-pill-btn:active {
      transform: scale(0.93);
    }

    .globe-svg {
      width: 18px;
      height: 18px;
      stroke: var(--theme-accent);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.45s ease, transform 0.4s ease;
    }

    .lang-pill-btn:hover .globe-svg {
      transform: rotate(15deg);
    }

    .lang-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    /* 右侧「☀️/🌙」独立圆形按钮（单击切换日夜，长按弹出12色主题面板） */
    .theme-mode-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      position: relative;
      z-index: 102;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease,
                  color 0.3s ease,
                  box-shadow 0.3s ease;
    }

    .theme-mode-btn.pressing {
      transform: scale(0.9);
      box-shadow: 0 0 0 4px var(--search-glow);
    }

    .sun-moon-svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .theme-mode-btn.rotating .sun-moon-svg {
      transform: rotate(180deg) scale(0.85);
    }

    /* ================= 3.5 长按弹出的 12 色主题悬浮面板 ================= */
    .theme-panel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 98;
      background: rgba(15, 23, 42, 0.06);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .theme-panel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .theme-popover-panel {
      position: absolute;
      top: 48px;
      right: 0;
      width: 292px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.18),
                  0 4px 16px rgba(15, 23, 42, 0.06);
      z-index: 101;
      opacity: 0;
      transform: translateY(-10px) scale(0.92);
      transform-origin: top right;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-dark="true"] .theme-popover-panel {
      background: rgba(21, 31, 50, 0.94);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 22px 44px -8px rgba(0, 0, 0, 0.55);
    }

    .theme-popover-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .panel-hint {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .theme-swatch-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .theme-swatch-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.75);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    [data-dark="true"] .theme-swatch-item {
      background: rgba(30, 41, 59, 0.75);
    }

    [data-dark="true"] .theme-swatch-item.active,
    [data-dark="true"] .theme-swatch-item.sliding-hover {
      background: rgba(30, 41, 59, 0.75);
    }

    .theme-swatch-item.active,
    .theme-swatch-item.sliding-hover {
      background: var(--theme-tag-bg);
      border-color: var(--theme-accent);
      transform: scale(1.04);
      box-shadow: 0 6px 16px -4px var(--search-glow);
    }

    .swatch-orb-preview {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(15, 23, 42, 0.1);
    }

    .swatch-orb-preview.holo-animated {
      background: linear-gradient(135deg, #B2E2B4 0%, #8FDBB8 35%, #92C6F2 72%, #B9CFF8 100%) !important;
      background-size: 220% 220% !important;
      animation: videoHoloBtn 3.2s ease infinite;
    }

    .swatch-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* ================= 4. 主标题与刷新数据行 ================= */
    button{font-variant-numeric:inherit}
    .shop-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .shop-title {
      font-size: 25px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .shop-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .update-time {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 刷新数据按钮（随12种渐变独立变色） */
    .refresh-btn {
      background-color: var(--refresh-btn-bg);
      color: var(--refresh-btn-text);
      border: none;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
      transition: background-color 0.45s ease,
                  transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.45s ease;
    }

    .refresh-btn:hover {
      filter: brightness(1.04);
      transform: translateY(-1px);
    }

    .refresh-btn:active {
      transform: scale(0.94);
    }

    .refresh-svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .refresh-btn.spinning .refresh-svg {
      transform: rotate(360deg);
    }

    /* ================= 5. 悬浮滑动胶囊 Tab ================= */
    .gemini-tab-section {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .gemini-tabs {
      position: relative;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }

    [data-dark="true"] .gemini-tabs {
      background: rgba(15, 23, 42, 0.45);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .tab-glider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background-color: var(--pill-surface);
      border-radius: 999px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease;
      z-index: 0;
    }

    .gemini-tabs[data-active="shop"] .tab-glider {
      transform: translateX(100%);
    }

    .gemini-tab-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .gemini-tab-btn.active {
      color: var(--theme-tab-text);
      font-weight: 700;
    }

    /* ================= 6. 大圆角悬浮搜索框 + 变色圆形发送按钮 ================= */
    .gemini-search-card {
      background-color: var(--pill-surface);
      border-radius: 26px;
      padding: 10px 10px 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 28px -10px rgba(15, 23, 42, 0.10),
                  0 2px 6px rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.92);
      transition: box-shadow 0.45s ease,
                  transform 0.25s ease,
                  border-color 0.35s ease,
                  background-color 0.4s ease;
    }

    [data-dark="true"] .gemini-search-card {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .gemini-search-card:focus-within {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px -4px var(--search-glow);
    }

    .plus-action-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .plus-action-btn:hover {
      background-color: var(--theme-tag-bg);
    }

    .plus-action-btn:active {
      transform: scale(0.9);
    }
    /* 深色模式下 + 钮的悬停/点按底色改走白色微透，不再借用浅色主题的标签底色（避免点后发白） */
    [data-dark="true"] .plus-action-btn:hover {

    /* === 真实官网三栏商品行结构 ===
       左栏：蓝色粗体价格 ¥X.XX + 下方浅灰平台徽章（链动小铺 / 16688 / 云猫寄售）
       中栏：商品完整标题 + 彩色属性胶囊 Tag（未接码/已接码/激活链接·需绑卡/成品号/代充等） + 灰字店铺名 + 同源铺货胶囊按钮
       右栏：库存状态（库存 XX / 橙红预警 只剩 X 个）+ 直达链接
    */
    .real-offer-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 2px;
    }

    .real-offer-row + .real-offer-row {

    }

    /* 右滑操作：克制的小按钮、明确的点击热区，不再铺满整行 */
    .swipe { position: relative; overflow: hidden; isolation: isolate; }
    .swipe + .swipe { border-top: 1px solid var(--card-border); }
    .swipe .real-offer-row {
      position: relative; z-index: 1; background: var(--card-bg);
      touch-action: pan-y; -webkit-tap-highlight-color: transparent;
    }
    .swipe.is-dragging .real-offer-row { will-change: transform; user-select: none; -webkit-user-select: none; }
    .swipe[data-open="1"] .real-offer-row { will-change: transform; }
    .swipe-actions {
      position: absolute; inset: 0 auto 0 0; width: 144px;
      box-sizing: border-box; padding: 7px; gap: 6px;
      display: flex; align-items: center; z-index: 0;
      pointer-events: none;
    }
    .swipe[data-open="1"] .swipe-actions,
    .swipe.is-dragging .swipe-actions { pointer-events: auto; }
    .swipe-actions button {
      flex: 1; min-width: 0; min-height: 64px; max-height: 84px;
      height: calc(100% - 6px); box-sizing: border-box; padding: 7px 2px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      border: 1px solid transparent; border-radius: 13px;
      font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer;
      box-shadow: 0 2px 7px rgba(15, 23, 42, .055);
      -webkit-tap-highlight-color: transparent;
      transition: filter .12s ease, background-color .15s ease;
    }
    .swipe-actions button svg {
      width: 19px; height: 19px; flex-shrink: 0; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .swipe-actions button:active { filter: brightness(.93); }
    .swipe-actions button:focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 1px; }
    .swipe-actions .sw-fav { background: #fff5e5; color: #9a651b; border-color: #f5dfbc; }

    .swipe-actions-r { position: absolute; inset: 0 0 0 auto; width: 76px; box-sizing: border-box; padding: 7px; display: flex; align-items: center; z-index: 0; pointer-events: none; }
    .swipe[data-open="r"] .swipe-actions-r, .swipe.is-dragging .swipe-actions-r { pointer-events: auto; }
    .swipe-actions-r button { flex: 1; min-width: 0; min-height: 64px; max-height: 84px; height: calc(100% - 6px); box-sizing: border-box; padding: 7px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: 1px solid transparent; border-radius: 13px; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer; box-shadow: 0 2px 7px rgba(15, 23, 42, .055); -webkit-tap-highlight-color: transparent; transition: filter .12s ease, background-color .15s ease; }

    .swipe-actions-r button:active { filter: brightness(.93); }

/* 元信息骨架（页头先行：时间/条数未到位时灰块流光） */

function stockTxt(it){
  if(it.stock===null||it.stock===undefined||it.stock<0) return '有货';
  if(it.stock===0) return '库存 0';
  if(it.stock<=2) return '<span class="stk-urgent">只剩 '+it.stock+' 个</span>';

  return '库存 '+it.stock;
}
function norm(s){return String(s??'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');}
function subseq(needle,hay){let i=0; for(const ch of hay){if(ch===needle[i]) i++; if(i===needle.length) return true;} return i===needle.length;}
function fuzzy(q){
  const texts=Array.prototype.slice.call(arguments,1).join(' ');
  const hay=norm(texts);
  const nq=norm(q);
  if(!nq) return true;
  if(hay.includes(nq)) return true;
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(tok=>{const nt=norm(tok); return !nt||hay.includes(nt)||(nt.length>=3&&subseq(nt,hay));});
}
/* 链接粗匹配（ken 2026-11-05，2026-11-10 改走平台映射反向索引）：搜索框直接粘贴店铺/商品链接时，
   先按 maps 的 goods/shop 前缀反向匹配（revLookup，与变价弹窗 pcKeyOf 共用同一套，不许两套）提代码：
   店铺链接→店铺码、商品链接→商品 ID（多 goods 前缀平台取剩余段尾节），目录按店铺代码对、
   看板按商品链接对（含同源来源里的链接）；映射未加载或非平台链接时退回原有尾段提取 */
function linkCodeOf(q){
  q=String(q||'');
  const r=revLookup(q);
  if(r&&r.rest){
    let seg=r.rest;
    if(r.kind==='goods'&&pcPlat&&pcPlat[r.code]&&(pcPlat[r.code].goods||[]).length>1) seg=seg.split('/').pop();
    if(seg) return String(seg).toLowerCase();
  }
  const m=q.match(/shop\/([A-Za-z0-9_-]{3,})/i)||q.match(/goods\/(G\d+)/i)||q.match(/item\/([A-Za-z0-9_-]+)/i)||q.match(/product\/(\d+)/i);
  if(m) return m[1].toLowerCase();
  if(/:\/\//.test(q)||/\.(cn|com|xyz|top|shop|net)\//.test(q)){
    const seg=(q.split(/[?#]/)[0].split('/').filter(Boolean).pop()||'');
    if(/^[A-Za-z0-9_-]{4,}$/.test(seg)) return seg.toLowerCase();
  }
  return '';
}
function itemLinkHit(it,code){
  if(!code) return false;
  if(String(it.url||'').toLowerCase().indexOf(code)>=0) return true;
  const ss=it.sources||[];
  for(let i=0;i<ss.length;i++){ if(String(ss[i].url||'').toLowerCase().indexOf(code)>=0) return true; }
  return false;
}

function revLookup(raw){
  const u=String(raw||'').split('?')[0].replace(/^(https?:\/\/)www\./,'$1');
  if(!pcPlat||!u) return null;

  for(const code in pcPlat){ const ent=pcPlat[code]; if(!ent) continue;
    const gs=ent.goods||[];
    for(let i=0;i<gs.length;i++){ const p=gs[i]; if(p&&u.indexOf(p)===0&&(!best||p.length>best.len)){
      let rest;
      if(gs.length>1){ const m=u.match(/^https?:\/\/[^/]+\/(.*)$/); rest=m?m[1]:u.slice(p.length); }
      else rest=u.slice(p.length);
      best={code:code,kind:'goods',len:p.length,rest:rest};
    } }
    const sp=ent.shop;
    if(sp&&u.indexOf(sp)===0&&(!best||sp.length>best.len)) best={code:code,kind:'shop',len:sp.length,rest:u.slice(sp.length)};

/* 长按整行外框才可左右滑：右滑开收藏/删除，左滑开引流。标签行固定不滑。 */
(function(){
  const box=$('#groups'); if(!box) return;
  const WIDTH=144, WIDTH_R=76;
  const SNAP='transform .22s cubic-bezier(.22, 1, .36, 1)';
  let openRow=null, suppressedRow=null, suppressUntil=0;
  const clamp=(v,wrap)=>Math.max(wrap.querySelector('.swipe-actions-r')?-WIDTH_R:0,Math.min(WIDTH,v));
  const position=(row,x)=>{ row.style.transform='translate3d('+x+'px,0,0)'; };
  function snap(row,open){
    if(!row||!row.isConnected) return;
    row.style.transition=SNAP;
    position(row,open?WIDTH:0);
    row.parentElement.dataset.open=open?'1':'';
    if(open)openRow=row;
    else if(openRow===row) openRow=null;
  }
  function snapR(row,open){
    if(!row||!row.isConnected) return;
    row.style.transition=SNAP;
    position(row,open?-WIDTH_R:0);
    row.parentElement.dataset.open=open?'r':'';
    if(open)openRow=row;
    else if(openRow===row)openRow=null;
  }
  function closeRow(row){ if(!row||!row.parentElement) return; if(row.parentElement.dataset.open==='r')snapR(row,false); else snap(row,false); }
  function closeOther(keep){
    let other=openRow&&openRow.isConnected?openRow:box.querySelector('.swipe[data-open="1"] .real-offer-row, .swipe[data-open="r"] .real-offer-row');
    if(other&&other!==keep) closeRow(other);
    if(openRow&&!openRow.isConnected)openRow=null;
  }
  window.addEventListener('aishop:openrestore',e=>{
    const w=[...box.querySelectorAll('.swipe')].find(x=>x.dataset.surl===e.detail);
    if(!w) return;
    const row=w.querySelector('.real-offer-row');
    if(!row) return;
    row.style.transition='none';
    position(row,WIDTH);
    w.dataset.open='1';
    openRow=row;
  });
  box.addEventListener('pointerdown',()=>{ suppressedRow=null; },true);
  box.addEventListener('pointerdown',e=>{
    if(e.isPrimary===false||e.button!==0||e.target.closest('.offer-badges-line')) return;
    const row=e.target.closest('.swipe .real-offer-row');
    if(!row||!box.contains(row)) return;
    if(drag) return;
    closeOther(row);
    const isOpen=row.parentElement.dataset.open==='1';
    const isOpenR=row.parentElement.dataset.open==='r';
    drag={id:e.pointerId,row,wrap:row.parentElement,x:e.clientX,y:e.clientY,
      base:isOpen?WIDTH:(isOpenR?-WIDTH_R:0),value:isOpen?WIDTH:(isOpenR?-WIDTH_R:0),wasOpen:isOpen,wasOpenR:isOpenR,axis:null,armed:false};
    const gd=drag;
    gd.lpT=setTimeout(()=>{ if(drag===gd&&gd.axis===null){ gd.armed=true; gd.wrap.classList.add('is-dragging'); if(navigator.vibrate)navigator.vibrate(10); } }, 500);
  });
  box.addEventListener('pointermove',e=>{
    const g=drag;
    if(!g||e.pointerId!==g.id||!g.row.isConnected) return;
    const dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(g.axis===null){
      if(!g.armed){ if(Math.abs(dx)>9||Math.abs(dy)>9){clearTimeout(g.lpT);g.lpT=null;} return; }
      if(Math.abs(dx)<5||Math.abs(dx)<=Math.abs(dy)) return;
      g.axis='x';
      g.row.style.transition='none';
      try{g.row.setPointerCapture(g.id);}catch(_){}
    }
    if(e.cancelable)e.preventDefault();
    g.value=clamp(g.base+dx,g.wrap);
    position(g.row,g.value);
  });
  function finish(e,cancelled){
    const g=drag;
    if(g&&g.lpT){clearTimeout(g.lpT);g.lpT=null;}
    if(!g||e.pointerId!==g.id)return;
    drag=null;
    if(pendingSwipeRender){
      pendingSwipeRender=false; renderBoard();
      const w=[...box.querySelectorAll('.swipe')].find(w=>w.dataset.surl===g.wrap.dataset.surl);
      if(w){g.wrap=w;g.row=w.querySelector('.real-offer-row');}
    }
    if(g.axis==='x'){
      const dx=e.clientX-g.x;
      let shouldOpen=g.wasOpen, shouldOpenR=!!g.wasOpenR;
      if(!cancelled){
        if(g.wasOpenR){ if(dx>=16)shouldOpenR=false; }
        else if(g.wasOpen){ if(dx<=-16)shouldOpen=false; }
        else if(dx>=16)shouldOpen=true;
        else if(dx<=-16)shouldOpenR=!!g.wrap.querySelector('.swipe-actions-r');
      }
      if(shouldOpen)snap(g.row,true);
      else if(shouldOpenR)snapR(g.row,true);
      else if(g.wasOpenR)snapR(g.row,false);
      else snap(g.row,false);
      if(shouldOpen||shouldOpenR)closeOther(g.row);
      suppressedRow=g.row;
      suppressUntil=performance.now()+350;
    }
    else if(g.armed&&!cancelled){suppressedRow=g.row;suppressUntil=performance.now()+350;}
    g.wrap.classList.remove('is-dragging');
    try{if(g.row.hasPointerCapture(g.id))g.row.releasePointerCapture(g.id);}catch(_){}
  }
  box.addEventListener('pointerup',e=>finish(e,false));
  box.addEventListener('pointercancel',e=>finish(e,true));
  box.addEventListener('lostpointercapture',e=>{if(drag&&e.target===drag.row)finish(e,true);});
  box.addEventListener('click',e=>{
    const btn=e.target.closest('.swipe-actions button, .swipe-actions-r button');
    if(btn){
      e.preventDefault();e.stopImmediatePropagation();
      const wrap=btn.closest('.swipe'), url=wrap&&wrap.dataset.surl;
      if(!url)return;
      pinnedLeaderGroup=null;
      if(btn.dataset.act==='del'){
        hiddenSet.add(url);saveHidden();wrap.remove();showToast('已从当前列表隐藏');requestAnimationFrame(()=>renderBoard());
      }else if(btn.dataset.act==='fav'){
        const removing=favSet.has(url);toggleFav(url,wrap);
        showToast(removing?'已取消收藏':'已收藏');
      }else if(btn.dataset.act==='baitq'){
        if(window.queueBaitFromBoard)window.queueBaitFromBoard(url,wrap);
        else showToast('引流待审还没加载好，稍后再试');
      }
      openRow=null; suppressedRow=null;
      return;
    }
    const row=e.target.closest('.swipe .real-offer-row');
    if(!row)return;
    if((row===suppressedRow&&performance.now()<suppressUntil)||row.parentElement.dataset.open){
      e.preventDefault();e.stopImmediatePropagation();
      if(row.parentElement.dataset.open&&(row!==suppressedRow||performance.now()>=suppressUntil))closeRow(row);
      suppressedRow=null;
    }
  },true);
})();

const REFRESH_API='https://ai.jpedu.asia/api/refresh-board';
const STOCK_API='https://ai.jpedu.asia/api/stock-check';
let stockVerifiedFor=null;
async function verifyStocks(){
  if(!board||stockVerifiedFor===board.updated_at) return;
  const ver=board.updated_at; stockVerifiedFor=ver;
  try{
    const all=await Promise.all(board.groups.map(async (g,gi)=>{
      const r=await fetch(STOCK_API+'?group='+encodeURIComponent(g.id)+(gi===0?'&esc=1':'')).then(x=>x.json()).catch(()=>null);
      return (r&&r.ok)?r.results:null;
    }));
    let changed=false;
    board.groups.forEach((g,gi)=>{
      const res=all[gi]; if(!res) return;
      const kept=[];
      g.items.forEach(it=>{
        const v=Object.prototype.hasOwnProperty.call(res,it.url)?res[it.url]:undefined;
        if(typeof v==='number'&&v<=0){ changed=true; return; } // 找不到(-1)/没库存(0)：去除
        if(typeof v==='number'&&it.stock!==v){
          it.stock=v; changed=true;
          (it.sources||[]).forEach(s=>{if(s.url===it.url) s.stock=v;});
        }
        kept.push(it);
      });
      g.items=kept;
    });
    if(changed&&board&&board.updated_at===ver){ if(srcIsOpen||srcLocked||pcIsOpen||pcLockedFlag){ srcPendingRender=true; } else renderBoard(); }
  }catch(e){}
}

  const cw=row.clientWidth, sw=row.scrollWidth;

    const pt=parseFloat(cs.paddingTop)||8, pl=parseFloat(cs.paddingLeft)||15;
    const over=sw-cw, bw=btn.offsetWidth||80;
    let fs=Math.max(10,Math.floor((f0*Math.max(0.75,(bw-over)/bw))*2)/2);

function readSharedA(){try{var m=document.cookie.match(/(?:^|;\s*)A=(\d{3,4})(?:;|$)/);if(!m)return null;var v=m[1],t=parseInt(v.slice(2),10);if(v.charAt(1)!=='0'&&v.charAt(1)!=='1')return null;if(!(t>=1&&t<=12))return null;return{l:v.charAt(0),m:v.charAt(1),t:t};}catch(e){return null;}}
function writeSharedA(){try{var a=readSharedA(),l=a?a.l:'0',h=location.hostname,s='A='+l+(themeState.d?'0':'1')+(curThemeGlobal+1)+';path=/;max-age=31536000;SameSite=Lax';if(h==='jpedu.asia'||h.slice(-11)==='.jpedu.asia')s+=';domain=jpedu.asia';if(location.protocol==='https:')s+=';Secure';document.cookie=s;}catch(e){}}
(function(){var a=readSharedA();if(a){themeState.d=a.m==='0';themeState.t=a.t-1;}curThemeGlobal=themeState.t;if(!a){try{if(localStorage.getItem('aishop.theme.v1'))writeSharedA();}catch(e){}}})();
function saveThemeState(){try{localStorage.setItem('aishop.theme.v1',JSON.stringify(themeState));}catch(e){}}
function applyTheme(idx){
  const t=THEMES12[idx]; if(!t) return;
  curThemeGlobal=idx;
  themeState.t=idx;
  const root=document.documentElement;
  root.style.setProperty('--orb-color-1',t.orb1);
  root.style.setProperty('--orb-color-2',t.orb2);
  root.style.setProperty('--refresh-btn-bg',t.refreshBg);
  root.style.setProperty('--send-circle-bg',t.sendCircleBg);
  root.style.setProperty('--theme-accent',t.accent);
  root.style.setProperty('--theme-tag-bg',t.tagBg);
  root.style.setProperty('--theme-tag-text',t.tagText);
  root.style.setProperty('--search-glow',t.glow);
  if(t.isHolo)root.setAttribute('data-holo','true'); else root.removeAttribute('data-holo');
  if(themeState.d)root.style.removeProperty('--page-bg'); else root.style.setProperty('--page-bg',t.pageBg);
  const mtc=document.querySelector('meta[name="theme-color"]');if(mtc)mtc.setAttribute('content',themeState.d?'#090D16':t.pageBg);
  document.querySelectorAll('.theme-swatch-item').forEach(el=>{el.classList.toggle('active',Number(el.getAttribute('data-theme-idx'))===idx);});
  saveThemeState();
}
function setDark(on){
  themeState.d=on;
  const root=document.documentElement;
  if(on)root.setAttribute('data-dark','true'); else root.removeAttribute('data-dark');
  const ic=document.getElementById('sunMoonIcon');
  if(ic)ic.innerHTML=on?MOON_PATHS:SUN_PATHS;
  applyTheme(curThemeGlobal);
}
function renderSwatches(){
  const grid=document.getElementById('themeSwatchGrid');
  if(!grid) return;
  grid.innerHTML=THEMES12.map((t,idx)=>'<div class="theme-swatch-item'+(idx===curThemeGlobal?' active':'')+'" data-theme-idx="'+idx+'"><span class="swatch-orb-preview'+(t.isHolo?' holo-animated':'')+'" style="background: linear-gradient(135deg, '+t.orb1+' 0%, '+t.orb2+' 65%, '+t.refreshBg+' 100%);"></span><span class="swatch-label">'+t.name+'</span></div>').join('');
  grid.querySelectorAll('.theme-swatch-item').forEach(el=>{
    el.addEventListener('click',()=>{applyTheme(Number(el.getAttribute('data-theme-idx')));writeSharedA();closeThemePanel();});
  });
}
function openThemePanel(){
  document.getElementById('themePopover').classList.add('open');
  document.getElementById('themeBackdrop').classList.add('open');
  if(navigator.vibrate)try{navigator.vibrate(18);}catch(e){}
}
function closeThemePanel(){
  document.getElementById('themePopover').classList.remove('open');
  document.getElementById('themeBackdrop').classList.remove('open');
  document.querySelectorAll('.theme-swatch-item').forEach(el=>el.classList.remove('sliding-hover'));
}
window.__applyTabTheme=function(){}; /* 全站单槽：切页签不换主题 */
(function initTheme(){
  renderSwatches();
  setDark(themeState.d);
  document.getElementById('themeBackdrop').addEventListener('click',closeThemePanel);
  const btn=document.getElementById('darkModeBtn');
  let pressTimer=null,isLong=false,isDown=false,lastIdx=null;
  btn.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0) return;
    isDown=true;isLong=false;lastIdx=null;
    btn.classList.add('pressing');
    try{btn.setPointerCapture(e.pointerId);}catch(_){}
    pressTimer=setTimeout(()=>{if(!isDown)return;isLong=true;openThemePanel();},340);
  });
  btn.addEventListener('pointermove',e=>{
    if(!isDown||!isLong) return;
    const targetEl=document.elementFromPoint(e.clientX,e.clientY);
    const sw=targetEl?targetEl.closest('.theme-swatch-item'):null;
    document.querySelectorAll('.theme-swatch-item').forEach(el=>el.classList.toggle('sliding-hover',el===sw));
    if(sw){
      const idx=Number(sw.getAttribute('data-theme-idx'));
      if(idx!==lastIdx){lastIdx=idx;applyTheme(idx);if(navigator.vibrate)try{navigator.vibrate(8);}catch(_){}}
    }
  });
  const finish=()=>{
    if(!isDown) return;
    isDown=false;clearTimeout(pressTimer);btn.classList.remove('pressing');
    if(!isLong){
      const pop=document.getElementById('themePopover');
      if(pop.classList.contains('open'))closeThemePanel();
      else{btn.classList.add('rotating');setTimeout(()=>btn.classList.remove('rotating'),520);setDark(!themeState.d);writeSharedA();}
    }else if(lastIdx!==null){writeSharedA();closeThemePanel();}
  };
  btn.addEventListener('pointerup',finish);
  btn.addEventListener('pointercancel',finish);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
})();

</script>

<script>
/* 引流人工终审（ken 2026-11-18 定版，滑动照 Gmail 归档）：筛选条末尾「引流」页签，
   待审数据来自 data/bait.json（条目 b=0 低价引流待审）。无按钮，两方向都是过阈值提交：
   右滑 = 拉黑（b=1，该链接永不进排序），左滑 = 恢复正常（回看板、不带 b）。卡片跟手、
   身后露动作底，松手飞出、该行收起补位，底部出撤销条；结论先攒本地，撤销条消失才
   POST 到 ai.jpedu.asia/api/review 落库，撤销即取消发送；refresh.py 每轮读回合并。
   主看板条目另有左滑引流（2026-11-19）：口令已存才露右侧引流按钮，点后以 a=queue 加进本待审清单。
   审核口令只第一次填、存本机 localStorage（aishop.reviewkey）。 */
window.selBait = false; window.baitCount = 0;
(function(){
  var API = 'https://ai.jpedu.asia/api/review';
  var KKEY = 'aishop.reviewkey';
  var BAR_MS = 5000;
  var baitData = null, baitLoading = false, bDrag = null, bSuppressUntil = 0;
  var hiddenUrls = new Set();
  var localQueued = [];
  var batch = [], barTimer = 0;
  var BAIT_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var PASS_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>';
  function key(){ try { return localStorage.getItem(KKEY) || ''; } catch(e){ return ''; } }
  function setKey(v){ try { if(v) localStorage.setItem(KKEY, v); else localStorage.removeItem(KKEY); } catch(e){} }
  function gname(g){
    if(g === 'blocked') return '已定点拉黑';
    if(typeof board !== 'undefined' && board && board.groups) for(var i = 0; i < board.groups.length; i++) if(board.groups[i].id === g) return board.groups[i].name;
    return g;
  }
  function visibleItems(){ return (baitData || []).filter(function(it){ return !hiddenUrls.has(it.url); }); }
  function pendingItems(){ return visibleItems().filter(function(it){ return it.s !== 'banned'; }); }
  function updateCount(){
    window.baitCount = pendingItems().length;
    window.paintBaitChip();
    if(window.selBait){ var lc = document.getElementById('listCount'); if(lc) lc.textContent = '待审 ' + window.baitCount + ' 条'; }
  }
  window.paintBaitChip = function(){
    document.querySelectorAll('#categoryBar .cat-chip').forEach(function(x){
      if(x.dataset.cat === '__bait'){ x.classList.toggle('active', !!window.selBait); x.textContent = '引流' + (window.baitCount ? ' (' + window.baitCount + ')' : ''); }
    });
  };
  window.baitExit = function(){
    var lt = document.getElementById('listTitle'); if(lt) lt.textContent = '10 大分组 · 真实报价明细';
    var ls = document.getElementById('listSub'); if(ls) ls.textContent = '按有货价格从低到高 · 含发卡平台标签、属性胶囊与同源商铺';
  };
  function keyBarHtml(){
    return '<div class="bait-keybar" id="baitKeyBar"><span>审核口令</span><input type="text" id="baitKeyInput" placeholder="填一次，本机记住" inputmode="text" autocomplete="off" autocapitalize="none" style="-webkit-text-security:disc"><button type="button" id="baitKeySave">保存</button></div>';
  }
  function bindKeyBar(){
    var b = document.getElementById('baitKeySave');
    if(b) b.onclick = function(){
      var v = (document.getElementById('baitKeyInput').value || '').trim();
      if(!v){ showToast('口令不能为空'); return; }
      setKey(v);
      var bar = document.getElementById('baitKeyBar'); if(bar) bar.remove();
      showToast('口令已保存，现在可以滑动审核');
    };
  }
  window.renderBaitView = function(){
    var box = document.getElementById('groups'); if(!box) return;
    document.getElementById('leaders').style.display = 'none';
    document.getElementById('featuredHint').style.display = 'none';
    document.getElementById('listTitle').textContent = '引流待审 · 人工终审';
    document.getElementById('listSub').textContent = '右滑 = 拉黑，永不进排序；左滑 = 恢复正常，回看板；提交后数秒内可撤销';
    window.paintBaitChip();
    if(baitData){ drawBait(box); return; }
    box.innerHTML = '<p class="sub">待审清单加载中…</p>';
    loadBait(true);
  };
  function loadBait(redraw){
    if(baitLoading) return; baitLoading = true;
    fetch('data/bait.json?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      baitLoading = false;
      baitData = (j && j.items) || [];
      localQueued.forEach(function(q){
        if(baitData.some(function(x){ return x.url === q.url; })) return;
        var bi = baitData.findIndex(function(x){ return x.s === 'banned'; });
        if(bi < 0) baitData.push(q); else baitData.splice(bi, 0, q);
      });
      updateCount();
      if(redraw && window.selBait) drawBait(document.getElementById('groups'));
    }).catch(function(){
      baitLoading = false;
      if(redraw && window.selBait) document.getElementById('groups').innerHTML = '<p class="sub">待审清单没拉下来，检查网络后重新点一次「引流」页签</p>';
    });
  }
  function drawBait(box){
    var items = visibleItems();
    document.getElementById('listCount').textContent = '待审 ' + pendingItems().length + ' 条';
    var head = key() ? '' : keyBarHtml();
    if(!items.length){
      box.innerHTML = head + '<div class="site-list-group open"><div style="padding:15px"><div class="site-list-name">暂无待审条目</div><p class="sub" style="margin-top:6px">拦下的低价与定点拉黑复审都会出现在这里</p></div></div>';
      bindKeyBar(); return;
    }
    var seenBanned = false;
    var rows = items.map(function(it){
      if(it.s === 'banned'){
        var div = seenBanned ? '' : '<div class="bait-divider">已拉黑 · 左滑可恢复正常</div>';
        seenBanned = true;
        var btags = '<span class="attr-pill-tag tag-sold">已拉黑</span>'
          + (it.minq ? '<span class="attr-pill-tag tag-amber">' + it.minq + ' 个起购</span>' : '');
        return div + '<div class="bait-row banned" data-banned="1" data-burl="' + esc(it.url) + '">'
        + '<div class="bait-bg"><span class="bic bic-r">' + PASS_ICON + '</span></div>'
        + '<div class="bait-card"><div class="real-offer-row"><div class="offer-col-left"><span class="offer-price-val">' + fmtP(it.price) + '</span><span class="platform-source-badge">' + esc(it.platform) + '</span></div><div class="offer-col-mid"><div class="offer-item-title"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></div><div class="offer-badges-line">' + btags + '</div><div class="shoprow"><span class="shopname">' + esc(it.shop) + '</span><span class="stk">' + stockTxt(it) + '</span></div></div></div></div>'
        + '</div>';
      }
      var tags = '<span class="attr-pill-tag ' + (it.s === 'blocked' ? 'tag-sold' : 'tag-amber') + '">' + (it.s === 'blocked' ? '机审拉黑 · 待复审' : '低价引流 · 待审') + '</span>'
        + '<span class="attr-pill-tag tag-gray">' + esc(gname(it.g)) + '</span>'
        + (it.minq ? '<span class="attr-pill-tag tag-amber">' + it.minq + ' 个起购</span>' : '');
      return '<div class="bait-row" data-burl="' + esc(it.url) + '">'
        + '<div class="bait-bg"><span class="bic bic-l">' + BAIT_ICON + '</span>'
        + '<span class="bic bic-r">' + PASS_ICON + '</span></div>'
        + '<div class="bait-card"><div class="real-offer-row"><div class="offer-col-left"><span class="offer-price-val">' + fmtP(it.price) + '</span><span class="platform-source-badge">' + esc(it.platform) + '</span></div><div class="offer-col-mid"><div class="offer-item-title"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></div><div class="offer-badges-line">' + tags + '</div><div class="shoprow"><span class="shopname">' + esc(it.shop) + '</span><span class="stk">' + stockTxt(it) + '</span></div></div></div></div>'
        + '</div>';
    }).join('');
    box.innerHTML = head + '<div class="site-list-group open"><div class="site-list-offers">' + rows + '</div></div>';
    bindKeyBar();
  }
  function snapBait(row){
    var card = row.querySelector('.bait-card'); if(!card) return;
    var bg = row.querySelector('.bait-bg');
    if(bg){ bg.style.transition = 'width .38s cubic-bezier(.25, 1.35, .35, 1)'; bg.style.width = '0px'; }
    card.style.transition = 'transform .38s cubic-bezier(.25, 1.35, .35, 1)';
    card.style.transform = 'translate3d(0,0,0)';
    row.classList.remove('armed');
    delete row.dataset.dir;
  }
  /* ---------- 撤销条与攒批落库 ---------- */
  var undoEl = null, undoTxt = null;
  function ensureUndoBar(){
    if(undoEl) return;
    undoEl = document.createElement('div');
    undoEl.id = 'baitUndo';
    undoEl.innerHTML = '<span id="baitUndoTxt"></span><button type="button" id="baitUndoBtn">撤销</button>';
    document.body.appendChild(undoEl);
    undoTxt = undoEl.querySelector('#baitUndoTxt');
    undoEl.querySelector('#baitUndoBtn').addEventListener('click', undoBatch);
  }
  function actLabel(act){ return act === 'bait' ? '已拉黑' : '已恢复正常'; }
  function showUndoBar(act){
    ensureUndoBar();
    undoTxt.textContent = actLabel(act) + (batch.length > 1 ? ' · 共 ' + batch.length + ' 条' : '');
    undoEl.classList.add('show');
    clearTimeout(barTimer);
    barTimer = setTimeout(flushBatch, BAR_MS);
  }
  function hideUndoBar(){ if(undoEl) undoEl.classList.remove('show'); clearTimeout(barTimer); }
  function undoBatch(){
    var entries = batch; batch = [];
    hideUndoBar();
    entries.forEach(function(en){ hiddenUrls.delete(en.it.url); });
    updateCount();
    if(window.selBait) drawBait(document.getElementById('groups'));
    showToast('已撤销，结论未提交');
  }
  function flushBatch(){
    var entries = batch; batch = [];
    hideUndoBar();
    entries.forEach(sendVerdict);
  }
  function sendVerdict(en){
    var it = en.it, act = en.act, k = key();
    fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Review-Key': k}, body: JSON.stringify({u: it.url, a: act})})
    .then(function(r){ return r.json().then(function(j){ return {s: r.status, j: j}; }); })
    .then(function(res){
      if(res.s === 401){ setKey(''); restoreItem(it); if(window.selBait) window.renderBaitView(); showToast('口令不对，重新填一次'); return; }
      if(!res.j || !res.j.ok) throw new Error('bad');
      baitData = baitData.filter(function(x){ return x.url !== it.url; });
      if(act === 'bait'){ it.s = 'banned'; it.b = '1'; baitData.push(it); }
      hiddenUrls.delete(it.url);
      updateCount();
      if(window.selBait) drawBait(document.getElementById('groups'));
    })
    .catch(function(){ restoreItem(it); showToast('提交失败，已恢复到待审'); });
  }
  function restoreItem(it){
    hiddenUrls.delete(it.url);
    updateCount();
    if(window.selBait) drawBait(document.getElementById('groups'));
  }
  /* 主看板左滑「引流」（ken 2026-11-19 定）：口令已存才渲染该按钮；点后这条加进
     引流待审（a=queue，refresh 合并为 b=0、不进看板），本机先隐藏，提交失败恢复 */
  window.queueBaitFromBoard = function(url, wrap){
    if(!key()){ showToast('先在引流页签填一次审核口令'); return; }
    var f = (typeof findItem === 'function') ? findItem(url) : null;
    if(!f){ showToast('没找到这条，刷新后再试'); return; }
    var it = f.it;
    var entry = {g: f.g.id, price: it.price, shop: it.shop, platform: it.platform, stock: (it.stock == null ? null : it.stock), title: it.title, url: it.url, s: 'pending', b: '0'};
    if(it.minq) entry.minq = it.minq;
    if(!localQueued.some(function(x){ return x.url === url; })) localQueued.push(entry);
    if(baitData && !baitData.some(function(x){ return x.url === url; })){
      var bi = baitData.findIndex(function(x){ return x.s === 'banned'; });
      if(bi < 0) baitData.push(entry); else baitData.splice(bi, 0, entry);
      updateCount();
    } else if(!baitData){ window.baitCount = (window.baitCount || 0) + 1; window.paintBaitChip(); }
    hiddenSet.add(url); saveHidden();
    if(wrap) wrap.remove();
    showToast('已加进引流待审');
    requestAnimationFrame(function(){ renderBoard(); });
    fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Review-Key': key()}, body: JSON.stringify({u: url, a: 'queue'})})
    .then(function(r){ return r.json().then(function(j){ return {s: r.status, j: j}; }); })
    .then(function(res){
      if(res.s === 401){ setKey(''); throw new Error('key'); }
      if(!res.j || !res.j.ok) throw new Error('bad');
    })
    .catch(function(){
      localQueued = localQueued.filter(function(x){ return x.url !== url; });
      if(baitData) baitData = baitData.filter(function(x){ return x.url !== url; });
      hiddenSet.delete(url); saveHidden();
      if(baitData) updateCount();
      if(!window.selBait) renderBoard();
      showToast('提交失败，已恢复到看板');
    });
  };
  /* ---------- 提交：飞出 + 收起补位 ---------- */
  function commit(row, act, dir){
    var url = row.dataset.burl;
    var it = null;
    (baitData || []).forEach(function(x){ if(x.url === url) it = x; });
    if(!it || hiddenUrls.has(url)) return;
    if(!key()){ snapBait(row); showToast('先填一次审核口令'); var inp = document.getElementById('baitKeyInput'); if(inp) inp.focus(); return; }
    hiddenUrls.add(url);
    batch.push({it: it, act: act});
    updateCount();
    showUndoBar(act);
    var card = row.querySelector('.bait-card');
    var bg = row.querySelector('.bait-bg');
    if(bg){
      bg.style.transition = 'width .25s ease';
      bg.style.left = '0px'; bg.style.right = '0px'; bg.style.width = 'auto';
      bg.querySelectorAll('.bic').forEach(function(s){ s.style.display = 'none'; });
    }
    var W = row.offsetWidth || 360;
    card.style.transition = 'transform .28s cubic-bezier(.35,.65,.25,1)';
    card.style.transform = 'translate3d(' + (dir > 0 ? (W + 60) : -(W + 60)) + 'px,0,0)';
    setTimeout(function(){
      if(!row.isConnected) return;
      var bg2 = row.querySelector('.bait-bg');
      setTimeout(function(){
        if(!row.isConnected) return;
        var H = row.offsetHeight;
        row.style.height = H + 'px';
        row.style.overflow = 'hidden';
        if(bg2){ bg2.style.transition = 'opacity .25s ease'; bg2.style.opacity = '0'; }
        requestAnimationFrame(function(){
          row.style.transition = 'height .3s ease, opacity .3s ease';
          row.style.height = '0px';
          row.style.opacity = '0';
        });
        setTimeout(function(){ if(row.isConnected) row.remove(); }, 320);
      }, 480);
    }, 290);
  }
  /* ---------- 手势：横向明显大于纵向才接管 ---------- */
  var box = document.getElementById('groups');
  if(box){
    box.addEventListener('pointerdown', function(e){
      if(!window.selBait || e.isPrimary === false || e.button !== 0) return;
      var card = e.target.closest('.bait-card');
      if(!card||e.target.closest('.offer-badges-line')) return;
      var row = card.closest('.bait-row');
      bDrag = {id: e.pointerId, row: row, card: card, x: e.clientX, y: e.clientY, dx: 0, axis: null};
    }, true);
    box.addEventListener('pointermove', function(e){
      var g = bDrag;
      if(!g || e.pointerId !== g.id || !g.row.isConnected) return;
      var dx = e.clientX - g.x, dy = e.clientY - g.y;
      if(g.axis === null){
        if(Math.abs(dy) >= 10 && Math.abs(dy) >= Math.abs(dx)){ g.axis = 'y'; return; }
        if(Math.abs(dx) < 10 || Math.abs(dx) <= Math.abs(dy) * 1.5) return;
        g.axis = 'x';
        g.card.style.transition = 'none';
        try { g.card.setPointerCapture(g.id); } catch(_){}
      }
      if(g.axis !== 'x') return;
      if(e.cancelable) e.preventDefault();
      var W = g.row.offsetWidth || 360;
      g.dx = Math.max(-(W + 60), Math.min(W + 60, dx));
      if(g.row.dataset.banned === '1' && g.dx > 0) g.dx = 0;
      g.card.style.transform = 'translate3d(' + g.dx + 'px,0,0)';
      g.row.classList.toggle('armed', Math.abs(g.dx) > 40);
      var bgx = g.row.querySelector('.bait-bg');
      if(bgx){
        bgx.style.transition = 'none';
        if(g.dx > 0){
          g.row.dataset.dir = 'r';
          bgx.style.left = '0px'; bgx.style.right = 'auto';
          bgx.style.width = Math.max(0, g.dx - 8) + 'px';
        } else if(g.dx < 0){
          g.row.dataset.dir = 'l';
          bgx.style.right = '0px'; bgx.style.left = 'auto';
          bgx.style.width = Math.max(0, -g.dx - 8) + 'px';
        } else {
          bgx.style.width = '0px';
        }
      }
    }, true);
    function bFinish(e, cancelled){
      var g = bDrag;
      if(!g || e.pointerId !== g.id) return;
      bDrag = null;
      if(g.axis === 'x'){
        bSuppressUntil = performance.now() + 350;
        var W = g.row.offsetWidth || 360;
        if(!cancelled && g.dx >= W * 0.4){
          commit(g.row, 'bait', 1);
        } else if(!cancelled && g.dx <= -W * 0.4){
          commit(g.row, 'pass', -1);
        } else {
          snapBait(g.row);
        }
      }
      try { if(g.card.hasPointerCapture(g.id)) g.card.releasePointerCapture(g.id); } catch(_){}
    }
    box.addEventListener('pointerup', function(e){ bFinish(e, false); }, true);
    box.addEventListener('pointercancel', function(e){ bFinish(e, true); }, true);
    box.addEventListener('click', function(e){
      if(!window.selBait) return;
      if(performance.now() < bSuppressUntil){ e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
  }
  if('requestIdleCallback' in window) requestIdleCallback(()=>loadBait(false),{timeout:2500});
  else setTimeout(()=>loadBait(false),400);
})();
</script>
</body>
</html>
