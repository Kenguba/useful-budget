<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>媒体笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4efe6;
    --bg-soft:#ece4d4;
    --surface:#fffdf7;
    --surface-2:#f8f2e4;
    --ink:#2b241a;
    --ink-2:#5c5344;
    --ink-3:#8a7f6c;
    --line:#ddd2bc;
    --accent:#9a3f2c;
    --accent-soft:#f3ddd2;
    --shelf:#7a5a3a;
    --shelf-dark:#5d422a;
    --shelf-face:#8a6845;
    --code-bg:#2b241a;
    --code-ink:#f2e9d8;
    --shadow:0 10px 30px rgba(60,42,18,.14);
    --radius:14px;
  }
  html[data-theme="dark"]{
    --bg:#171410;
    --bg-soft:#1f1a15;
    --surface:#221d17;
    --surface-2:#29221b;
    --ink:#ece3d2;
    --ink-2:#bcae97;
    --ink-3:#8d8171;
    --line:#3a3227;
    --accent:#e08a6d;
    --accent-soft:#3d2a22;
    --shelf:#4a3826;
    --shelf-dark:#332619;
    --shelf-face:#57432c;
    --code-bg:#100d0a;
    --code-ink:#ece3d2;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.75;font-size:16px;
    transition:background .25s ease,color .25s ease;
  }
  button{font:inherit;cursor:pointer;min-height:44px}
  a{color:var(--accent)}
  .wrap{max-width:1020px;margin:0 auto;padding:0 18px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{display:flex;align-items:center;gap:12px;padding:10px 18px}
  .brand{display:flex;align-items:center;gap:10px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:18px;letter-spacing:.04em;background:none;border:0;padding:0;color:inherit;cursor:pointer}
  .brand svg{flex:none}
  .topbar .spacer{flex:1}
  .count-chip{font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:44px;height:44px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);
  }
  .icon-btn:active{background:var(--accent-soft)}
  .icon-btn svg{width:20px;height:20px}

  /* ---------- hero ---------- */
  .hero{padding:38px 0 8px}
  .hero h1{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:clamp(30px,6vw,44px);line-height:1.25;margin:0 0 10px;letter-spacing:.02em;
  }
  .hero p{margin:0;color:var(--ink-2);max-width:34em;font-size:15.5px}
  .hero .rule{width:56px;height:3px;background:var(--accent);border-radius:2px;margin:18px 0 0}

  /* ---------- shelf ---------- */
  .shelf-block{margin:26px 0 8px;scroll-margin-top:64px}
  .shelf-label{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
  .shelf-label h2{font-family:"Noto Serif SC",serif;font-size:19px;margin:0;font-weight:700}
  .shelf-label span{font-size:13px;color:var(--ink-3)}
  .shelf{
    position:relative;padding:26px 18px 0;
    background:linear-gradient(180deg,var(--bg-soft),transparent 78%);
    border-radius:18px 18px 0 0;
  }
  .books{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  .book{
    --c1:#9a3f2c;--c2:#7c2f20;
    position:relative;border:0;padding:0;text-align:left;background:none;
    width:148px;flex:0 0 auto;
    transition:transform .18s ease;
  }
  .book:hover{transform:translateY(-6px)}
  .book:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
  .book-cover{
    height:218px;border-radius:5px 9px 9px 5px;overflow:hidden;position:relative;
    background:linear-gradient(150deg,var(--c1),var(--c2));
    box-shadow:inset 5px 0 10px rgba(0,0,0,.28),inset -1px 0 0 rgba(255,255,255,.18),var(--shadow);
    color:#f7efe0;display:flex;flex-direction:column;
  }
  .book-cover::before{
    content:"";position:absolute;left:9px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28);
  }
  .book-cover::after{
    content:"";position:absolute;inset:10px 10px 10px 16px;border:1px solid rgba(247,239,224,.4);border-radius:3px;pointer-events:none;
  }
  .book-no{font-size:11px;letter-spacing:.28em;padding:16px 14px 0 20px;opacity:.85}
  .book-title{
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;line-height:1.5;
    padding:8px 14px 0 20px;letter-spacing:.03em;
  }
  .book-sub{font-size:12px;line-height:1.6;padding:6px 14px 0 20px;opacity:.88}
  .book-author{margin-top:auto;padding:0 14px 14px 20px;font-size:11.5px;opacity:.85;border-top:0}
  .book-meta{padding:10px 2px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
  .book-meta b{display:block;color:var(--ink);font-weight:700;font-size:13px}
  .shelf-board{
    height:16px;margin-top:2px;border-radius:3px;
    background:linear-gradient(180deg,var(--shelf-face),var(--shelf) 55%,var(--shelf-dark));
    box-shadow:0 12px 18px rgba(50,32,10,.28);
  }
  .shelf-shadow{height:22px;background:radial-gradient(60% 100% at 50% 0,rgba(50,32,10,.20),transparent 70%)}

  .tip{
    margin:22px 0 0;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--radius);
    background:var(--surface);color:var(--ink-2);font-size:14px;display:flex;gap:10px;align-items:flex-start;
  }
  .tip svg{flex:none;margin-top:3px;color:var(--accent)}
  footer{padding:34px 0 46px;color:var(--ink-3);font-size:13px;text-align:center}

  /* ---------- reader ---------- */
  .reader{display:none}
  body.reading .home{display:none}
  body.reading .reader{display:block}
  .reader-top{display:flex;align-items:center;gap:10px;padding:16px 0 4px;flex-wrap:wrap}
  .back-btn{
    display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px 8px 12px;font-weight:500;
  }
  .back-btn:active{background:var(--accent-soft)}
  .back-btn svg{width:18px;height:18px}
  .reader-nav{margin-left:auto;display:flex;gap:8px}
  .nav-btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:14px;
  }
  .nav-btn:disabled{opacity:.4;cursor:default}
  .nav-btn svg{width:16px;height:16px}
  .article-head{padding:18px 0 6px;border-bottom:2px solid var(--ink);margin-bottom:8px}
  .article-kicker{font-size:12.5px;letter-spacing:.22em;color:var(--accent);font-weight:700;margin-bottom:10px}
  .article-head h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(26px,5.4vw,38px);line-height:1.35;margin:0 0 10px}
  .article-head .lede{color:var(--ink-2);font-size:16px;margin:0 0 16px;max-width:38em}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:18px}
  .meta-chip{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;
  }
  .meta-chip svg{width:15px;height:15px;color:var(--accent);flex:none}
  .article-body{padding:10px 0 6px;max-width:44em}
  .article-body h2{
    font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;margin:30px 0 10px;
    display:flex;align-items:center;gap:10px;
  }
  .article-body h2::before{content:"";width:8px;height:22px;background:var(--accent);border-radius:2px;flex:none}
  .article-body p{margin:0 0 12px}
  .steps{margin:0 0 14px;padding:0;list-style:none;counter-reset:step}
  .steps li{
    counter-increment:step;position:relative;padding:10px 14px 10px 52px;margin-bottom:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
  }
  .steps li::before{
    content:counter(step);position:absolute;left:13px;top:11px;width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  html[data-theme="dark"] .steps li::before{color:#1d1712}
  .params{width:100%;border-collapse:collapse;margin:4px 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .params th,.params td{padding:10px 14px;text-align:left;font-size:14.5px;vertical-align:top}
  .params th{width:34%;color:var(--ink-2);font-weight:500;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .params td{border-bottom:1px solid var(--line);font-weight:500}
  .params tr:last-child th,.params tr:last-child td{border-bottom:0}
  .callout{
    border-radius:12px;padding:14px 16px;margin:6px 0 16px;font-size:15px;
    background:var(--accent-soft);color:var(--ink);
  }
  .callout b{color:var(--accent)}
  html[data-theme="dark"] .callout b{color:var(--accent)}
  .callout .callout-t{font-weight:700;display:block;margin-bottom:4px;font-size:13px;letter-spacing:.14em;color:var(--accent)}
  .diagram{
    margin:8px 0 18px;padding:18px 14px 10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  }
  .diagram svg{width:100%;height:auto;display:block}
  .diagram figcaption{text-align:center;font-size:13px;color:var(--ink-3);padding:8px 0 6px}
  .prompt-box{margin:8px 0 18px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  .prompt-head{
    display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  }
  .prompt-head span{font-weight:700;font-size:14.5px}
  .copy-btn{
    margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;
    background:var(--accent);color:#fff;padding:8px 16px;font-weight:700;font-size:14px;min-height:40px;
  }
  html[data-theme="dark"] .copy-btn{color:#1d1712}
  .copy-btn svg{width:16px;height:16px}
  .copy-btn.copied{background:#3e7d4e}
  html[data-theme="dark"] .copy-btn.copied{color:#fff}
  .prompt-text{
    margin:0;padding:16px;background:var(--code-bg);color:var(--code-ink);
    font-size:14.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
    font-family:"Noto Sans SC",system-ui,sans-serif;
  }
  .mnemonic{
    margin:0 0 18px;padding:14px 16px;border-left:4px solid var(--accent);
    background:var(--surface);border-radius:0 12px 12px 0;border-top:1px solid var(--line);
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;
  }
  .mnemonic .callout-t{font-weight:700;display:block;margin-bottom:4px;font-size:13px;letter-spacing:.14em;color:var(--accent)}
  .source-box{
    margin:26px 0 8px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  }
  .source-box .sb-t{font-weight:700;font-size:14.5px}
  .source-box .sb-s{font-size:13px;color:var(--ink-2)}
  .source-link{
    margin-left:auto;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;min-height:44px;
  }
  .source-link svg{width:16px;height:16px}
  .next-bar{display:flex;gap:10px;padding:22px 0 44px;flex-wrap:wrap}
  .next-btn{
    flex:1;min-width:200px;display:flex;align-items:center;gap:10px;text-align:left;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:14px 16px;
  }
  .next-btn small{display:block;color:var(--ink-3);font-size:12px}
  .next-btn b{font-family:"Noto Serif SC",serif;font-size:16px}
  .next-btn svg{width:18px;height:18px;margin-left:auto;flex:none;color:var(--accent)}
  .next-btn:disabled{opacity:.45;cursor:default}

.layout{display:grid;grid-template-columns:104px 1fr;align-items:start}#side{position:sticky;top:64px}#side a{display:block;padding:10px;margin-bottom:6px;border-radius:10px;background:var(--surface-2);text-decoration:none}@media(max-width:760px){body{touch-action:pan-y}.layout{grid-template-columns:1fr}#side{position:fixed;inset:0 auto 0 0;width:180px;z-index:60;background:var(--surface);padding:70px 14px;transform:translateX(-105%)}#side.open{transform:none}#side.open::after{content:"";position:fixed;inset:0 0 0 180px;background:#0006}}
  @media (max-width:640px){
    .books{gap:12px}
    .book{width:calc(50% - 6px)}
    .book-cover{height:204px}
    .book-title{font-size:17px}
    .params th{width:40%}
    .source-link{margin-left:0;width:100%;justify-content:center}
    .count-chip{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <button class="brand" id="brandBtn" type="button" aria-label="分组导航">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="13" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 8.5 20 10v10h-4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.5 9h6M6.5 12.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>媒体笔记</span>
    </button>
    <div class="spacer"></div>
    <span class="count-chip" id="countChip"></span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅主题"></button>
  </div>
</header>

<!-- ======================= 首页 · 书架 ======================= -->
<div class="home">
  <div class="wrap">
    <section class="hero">
      <h1>把画面、声音和镜头<br />都记成能照着做的笔记</h1>
      <p>这里收着 PS 溶图手艺、AI 运镜库和代码出片工具的拆解，按组排在下面的书架上；点开任意一本就能读全文，参数和出处都在篇里</p>
      <div class="rule"></div>
    </section>

    <div class="layout"><nav id="side"></nav><div id="shelves"></div></div>
      <div class="tip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="8" r="1.3" fill="currentColor"/></svg>
        <span>练 PS 溶图按组内顺序走：先抠图、再融合、最后用灰色观察层验收调色；做视频先翻视频制作组挑工具，再去提示词组抄一条验证过的提示词，配音与配乐各有一组专门讲</span>
      </div>

    <footer>每篇都标注了作者与出处，链接在篇末</footer>
  </div>
</div>

<!-- ======================= 阅读页 ======================= -->
<div class="reader">
  <div class="wrap">
    <div class="reader-top">
      <button class="back-btn" id="backBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        回到书架
      </button>
      <div class="reader-nav">
        <button class="nav-btn" id="prevBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          上一篇
        </button>
        <button class="nav-btn" id="nextBtn" type="button">
          下一篇
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <article id="articleRoot"></article>
    <div class="next-bar" id="nextBar"></div>
  </div>
</div>

<script>
/* ==================== 数据层：加新篇只往这里加一条 ==================== */
var ARTICLES = [
  {
    id: "grey-layer",
    group: "PS技巧",
    no: "第 一 本",
    title: "灰色观察层调色",
    sub: "先看明度，再动饱和",
    author: "设计师(PS+AI合成教学)",
    date: "2026-11-15",
    duration: "原片 39 秒",
    douyin: "7708278014978991464",
    colors: ["#8a4b2f", "#6d3820"],
    lede: "溶图调色不要一上来就拧饱和度；先盖一层中性灰当观察层，只看明度，明度关系顺了再正式调色",
    diagram: "grey",
    sections: [
      {
        h: "这一招在解决什么",
        paras: [
          "人物溶进新背景之后最容易露馅的地方，是主体和背景的亮暗关系对不上，颜色再准也像贴上去的",
          "灰色观察层的做法，是先把颜色放到一边，只用明度判断衔接是否成立，再回头处理颜色"
        ]
      },
      {
        h: "操作顺序",
        steps: [
          "在图层上方加一层中性灰作为观察层，盖住全图用来观察",
          "切到观察状态后只看明度：全图有哪些颜色、谁亮谁暗会一下子变得非常明显",
          "先确认主体与背景的明度关系是否衔接，亮暗顺了再进入正式调色",
          "正式调色用色相/饱和度、自然饱和度、色彩平衡三个调整层逐项统一",
          "最后关掉观察层，做一次调色前后的对比收尾"
        ]
      },
      {
        h: "要记住的点",
        paras: [
          "灰层只是用来观察的，它不改变画面原本的颜色，示范里青蓝色块融进灰色后颜色看着并没有变",
          "原片示范图是一个金发角色站在霓虹街景里，文件名叫精准调色，整套动作都围绕先看清全图颜色分布再下手"
        ],
        callout: { t: "口诀", text: "先明度，后饱和；不要盲拧滑块" }
      }
    ]
  },
  {
    id: "bg-eraser",
    group: "PS技巧",
    no: "第 二 本",
    title: "背景橡皮擦抠纯色底",
    sub: "网眼缝隙里的背景也能擦净",
    author: "琎哥哥探设计",
    date: "2026-08-28",
    duration: "原片 33 秒",
    douyin: "7679055022700629288",
    colors: ["#2f5d8a", "#214263"],
    lede: "遇到浑身是孔眼、缝隙里全是背景的图，别一个孔一个孔去抠；背景橡皮擦一次拖过去，连网眼里的背景也能擦净",
    diagram: "eraser",
    sections: [
      {
        h: "这一招在解决什么",
        paras: [
          "示范图是纯蓝底上的一只网兜，装着青苹果、柠檬和橙子，网眼里全是蓝色，常规选区很难把这些零碎背景清干净",
          "背景橡皮擦的思路是反过来告诉工具：哪个颜色是要删的、哪个颜色是绝对不能动的，剩下的交给它自己分辨"
        ]
      },
      {

var GROUPS = ["PS技巧", "运镜", "提示词", "视频制作", "配音", "配乐"];

function renderShelf() {
  $("#countChip").textContent = "共 " + ARTICLES.length + " 本";
  var html = "", nav = "";
  GROUPS.forEach(function (g, gi) {
    var idxs = [];
    ARTICLES.forEach(function (a, i) { if (a.group === g) idxs.push(i); });
    if (!idxs.length) return;
    nav += '<a href="#g' + gi + '">' + esc(g) + ' ' + idxs.length + '</a>';
    html += '<section class="shelf-block" id="g' + gi + '" aria-label="' + esc(g) + '">' +
      '<div class="shelf-label"><h2>' + esc(g) + '</h2><span>' + idxs.length + ' 本</span></div>' +
      '<div class="shelf"><div class="books">';
    idxs.forEach(function (i) {
      var a = ARTICLES[i];
      html += '<button class="book" type="button" data-open="' + i + '" aria-label="打开《' + esc(a.title) + '》">' +
        '<span class="book-cover" style="--c1:' + a.colors[0] + ';--c2:' + a.colors[1] + '">' +
        '<span class="book-no">' + esc(a.no) + '</span>' +
        '<span class="book-title">' + esc(a.title) + '</span>' +
        '<span class="book-sub">' + esc(a.sub) + '</span>' +
        '<span class="book-author">' + esc(a.author) + '</span>' +
        '</span>' +
        '<span class="book-meta"><b>' + esc(a.date) + '</b>' + esc(a.duration) + '</span>' +
        '</button>';
    });
    html += '</div><div class="shelf-board"></div><div class="shelf-shadow"></div></div></section>';
  });
  $("#shelves").innerHTML = html;
  $("#side").innerHTML = nav;
  var btns = document.querySelectorAll("[data-open]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () { openArticle(parseInt(this.getAttribute("data-open"), 10)); });
  }
}

var sideEl=$("#side");
$("#brandBtn").onclick=function(){sideEl.classList.toggle("open")};
sideEl.onclick=function(){sideEl.classList.remove("open")};
var swX=null,swY=null,swOpen=false,swOn=false;
addEventListener("touchstart",function(e){
  swOpen=sideEl.classList.contains("open");
  swX=e.touches[0].clientX;swY=e.touches[0].clientY;swOn=false;
  if(!swOpen&&swX>24)swX=null;
},{passive:true});
addEventListener("touchmove",function(e){
  if(swX===null)return;
  var dx=e.touches[0].clientX-swX,dy=e.touches[0].clientY-swY;
  if(!swOn){
    if(Math.abs(dx)<8)return;
    if(Math.abs(dy)>Math.abs(dx)){swX=null;return}
    swOn=true;sideEl.classList.add("open");
  }
  var p=swOpen?1+dx/180:dx/180;
  p=Math.max(0,Math.min(1,p));
  sideEl.style.transform="translateX("+(-(1-p)*105)+"%)";
},{passive:true});
addEventListener("touchend",function(e){
  if(swX===null)return;
  if(swOn){
    var dx=e.changedTouches[0].clientX-swX;
    var p=swOpen?1+dx/180:dx/180;
    if(p<=0.5)sideEl.classList.remove("open");
    sideEl.style.transform="";
  }
  swX=null;
});

function sectionHTML(sec) {
  var h = '<h2>' + esc(sec.h) + '</h2>';
  (sec.paras || []).forEach(function (p) { h += '<p>' + esc(p) + '</p>'; });
  if (sec.params) {
    h += '<table class="params"><tbody>';
    sec.params.forEach(function (row) {
      h += '<tr><th scope="row">' + esc(row[0]) + '</th><td>' + esc(row[1]) + '</td></tr>';
    });
    h += '</tbody></table>';
  }
  if (sec.steps) {
    h += '<ol class="steps">';
    sec.steps.forEach(function (s) { h += '<li>' + esc(s) + '</li>'; });
    h += '</ol>';
  }
  if (sec.callout) {
    h += '<div class="callout"><span class="callout-t">' + esc(sec.callout.t) + '</span>' + esc(sec.callout.text) + '</div>';
  }
  return h;
}

function renderArticle(i) {
  var a = ARTICLES[i];
  var h = '';
  h += '<div class="article-head">' +
    '<div class="article-kicker">' + esc(a.no) + ' · 媒体笔记</div>' +
    '<h1>' + esc(a.title) + '</h1>' +
    '<p class="lede">' + esc(a.lede) + '</p>' +
    '<div class="meta-row">' +
    '<span class="meta-chip">' + ICON_USER + esc(a.author) + '</span>' +
    '<span class="meta-chip">' + ICON_CAL + esc(a.date) + '</span>' +
    '<span class="meta-chip">' + ICON_CLOCK + esc(a.duration) + '</span>' +
    '</div></div>';

  h += '<div class="article-body">';
  if (a.diagram) {
    var cap = a.id === "combo-prompt" ? "三合一总流程：抠图、融合、调色验收" :
      a.id === "grey-layer" ? "灰色观察层的图层位置与用法" :
      a.id === "bg-eraser" ? "背景橡皮擦处理网眼背景的前后对比" :
      a.id === "lamp-light" ? "开灯效果点光前后的画面差别" : "自动混合前后的画面差别";
    h += '<figure class="diagram" style="margin-top:14px">' + diagramSVG(a.diagram) + '<figcaption>' + cap + '</figcaption></figure>';
  }
  a.sections.forEach(function (sec) { h += sectionHTML(sec); });

  if (a.prompt) {
    h += '<h2>提示词正文</h2>';
    h += '<div class="prompt-box"><div class="prompt-head"><span>' + esc(a.promptTitle) + '</span>' +
      '<button class="copy-btn" id="copyBtn" type="button">' + ICON_COPY + '<span>复制提示词</span></button></div>' +
      '<p class="prompt-text" id="promptText">' + esc(a.prompt) + '</p></div>';
    h += '<div class="mnemonic"><span class="callout-t">PS 口诀版</span>' + esc(a.mnemonic) + '</div>';
    h += '<p>这一篇是前三篇的合成版，没有单独的原片；三条出处分别在前三篇的文末，照着顺序读就能对上每一步的来历</p>';
  }
  h += '</div>';

  if (a.douyin) {
    var url = "https://www.douyin.com/video/" + a.douyin;
    h += '<div class="source-box"><div><div class="sb-t">原片出处</div>' +
      '<div class="sb-s">' + esc(a.author) + ' · 抖音视频 ' + esc(a.douyin) + '</div></div>' +
      '<a class="source-link" href="' + url + '" target="_blank" rel="noopener noreferrer">打开原片 ' + ICON_LINK + '</a></div>';
  }

  if (a.source) {
    h += '<div class="source-box"><div><div class="sb-t">出处</div>' +
      '<div class="sb-s">' + esc(a.source.note) + '</div></div>' +
      '<a class="source-link" href="' + a.source.url + '" target="_blank" rel="noopener noreferrer">打开出处 ' + ICON_LINK + '</a></div>';
  }

  $("#articleRoot").innerHTML = h;

  var copyBtn = $("#copyBtn");
  if (copyBtn) {
    copyBtn.addEventListener("click", function () { copyPrompt(a.prompt, copyBtn); });
  }

  /* 上一篇 / 下一篇 */
  $("#prevBtn").disabled = i === 0;
  $("#nextBtn").disabled = i === ARTICLES.length - 1;
  var nb = "";
  if (i < ARTICLES.length - 1) {
    var n = ARTICLES[i + 1];
    nb = '<button class="next-btn" id="nextCard" type="button"><span><small>接着读下一篇</small><b>《' + esc(n.title) + '》</b></span>' + ICON_NEXT + '</button>';
  } else {
    nb = '<button class="next-btn" id="nextCard" type="button"><span><small>已经读到最后一本</small><b>回书架再挑一本</b></span>' + ICON_NEXT + '</button>';
  }
  $("#nextBar").innerHTML = nb;
  $("#nextCard").addEventListener("click", function () {
    if (i < ARTICLES.length - 1) { openArticle(i + 1); } else { closeArticle(); }
  });
}

function copyPrompt(text, btn) {
  function done() {
    var label = btn.querySelector("span");
    var old = label.textContent;
    btn.classList.add("copied");
    btn.innerHTML = ICON_CHECK + "<span>已复制，去粘贴吧</span>";
    setTimeout(function () {
      btn.classList.remove("copied");
      btn.innerHTML = ICON_COPY + "<span>" + old + "</span>";
    }, 2200);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

function openArticle(i) {
  if (ARTICLES[i].href) { window.location.href = ARTICLES[i].href; return; }
  current = i;
  renderArticle(i);
  document.body.classList.add("reading");
  window.scrollTo(0, 0);
  try { history.replaceState(null, "", "#/" + ARTICLES[i].id); } catch (e) {}
}
function closeArticle() {
  current = -1;
  document.body.classList.remove("reading");
  window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}

$("#backBtn").addEventListener("click", closeArticle);
$("#prevBtn").addEventListener("click", function () { if (current > 0) openArticle(current - 1); });
$("#nextBtn").addEventListener("click", function () { if (current < ARTICLES.length - 1) openArticle(current + 1); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && current >= 0) closeArticle();
});

/* ---------- 主题：存档优先（与子页共用 mp-theme），否则跟随系统，可手动切换 ---------- */
var themeBtn = $("#themeBtn");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.innerHTML = t === "dark" ? SUN : MOON;
  themeBtn.setAttribute("aria-label", t === "dark" ? "切换到浅色主题" : "切换到深色主题");
}
var savedTheme = null;
try { savedTheme = localStorage.getItem("mp-theme"); } catch (e) {}
var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
applyTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme : (prefersDark ? "dark" : "light"));
themeBtn.addEventListener("click", function () {
  var now = document.documentElement.getAttribute("data-theme");
  var next = now === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("mp-theme", next); } catch (e) {}
});

/* ---------- 启动 ---------- */
renderShelf();
(function () {
  var m = (location.hash || "").match(/^#\/(.+)$/);
  if (m) {
    for (var i = 0; i < ARTICLES.length; i++) {
      if (ARTICLES[i].id === m[1]) { openArticle(i); break; }
    }
  }
})();
</script>
</body>
</html>
