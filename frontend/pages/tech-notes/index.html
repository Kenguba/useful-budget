<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>技术开发文档</title>
<style>
:root{
  --bg:#000000;
  --card:#0A0A0C;
  --card2:#121214;
  --card3:#1C1C1E;
  --line:rgba(235,235,245,.12);
  --line2:rgba(235,235,245,.08);
  --t100:rgba(235,235,245,1);
  --t60:rgba(235,235,245,.6);
  --t30:rgba(235,235,245,.3);
  --orange:#FF9F0A;
  --orange-dim:rgba(255,159,10,.14);
  --blue:#409CFF;
  --green:#30D158;
  --red:#FF453A;
  --radius:14px;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t100);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(255,159,10,.35)}

/* ---------- 吸顶导航 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line2);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
.topnav{display:flex;gap:4px;margin-left:8px}
.topnav a{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--t60);min-height:36px;display:inline-flex;align-items:center}
.topnav a.on{color:var(--t100);background:var(--card3)}
.topbar .sp{flex:1}
.count-badge{
  font-family:var(--mono);font-size:12px;color:var(--orange);
  background:var(--orange-dim);border:1px solid rgba(255,159,10,.4);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- Hero ---------- */
.hero{padding:52px 0 8px}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.12;font-weight:900;margin:0 0 14px;letter-spacing:.01em}
.hero h1 .accent{color:var(--orange)}
.hero p{margin:0;color:var(--t60);font-size:16px;max-width:640px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{
  font-family:var(--mono);font-size:12.5px;color:var(--orange);
  background:var(--card2);border:1px solid rgba(255,159,10,.45);
  padding:4px 10px;border-radius:8px;white-space:nowrap;
}
.chip.gray{color:var(--t60);border-color:var(--line)}

/* ---------- 筛选条 + 搜索 ---------- */
.filterbar{
  display:flex;gap:8px;overflow-x:auto;white-space:nowrap;
  padding:26px 2px 12px;scrollbar-width:none;-ms-overflow-style:none;
}
.filterbar::-webkit-scrollbar{display:none}
.fbtn{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--t60);
  font-size:14px;padding:8px 16px;border-radius:999px;min-height:38px;
}
.fbtn.on{color:#000;background:var(--t100);border-color:var(--t100);font-weight:700}
.searchbox{position:relative;margin-bottom:8px}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.searchbox input{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  color:var(--t100);font-size:15px;padding:13px 14px 13px 42px;outline:none;font-family:inherit;min-height:48px;
}
.searchbox input:focus{border-color:rgba(255,159,10,.6)}
.searchbox input::placeholder{color:var(--t30)}

/* ---------- 书架 ---------- */
.shelf{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:26px 20px;padding:22px 0 10px;
}
.book{
  display:block;background:none;border:none;padding:0;text-align:left;width:100%;
}
.book-cover{
  position:relative;aspect-ratio:3/4;border-radius:6px 12px 12px 6px;
  padding:20px 16px 16px 22px;display:flex;flex-direction:column;
  box-shadow:6px 6px 0 -1px #2a2a2e, 7px 7px 0 -1px #3a3a3e, 0 18px 34px rgba(0,0,0,.55);
  transition:transform .25s ease, box-shadow .25s ease;
  overflow:hidden;
}
.book-cover::before{ /* 书脊高光 */
  content:"";position:absolute;left:0;top:0;bottom:0;width:14px;
  background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.14) 55%,rgba(0,0,0,.25));
}
.book-cover::after{ /* 书页厚度边 */
  content:"";position:absolute;right:0;top:3px;bottom:3px;width:4px;
  background:repeating-linear-gradient(90deg,#e8e4da 0 1px,#c9c4b8 1px 2px);
  border-radius:0 2px 2px 0;opacity:.85;
}
.book:hover .book-cover,.book:focus-visible .book-cover{
  transform:translateY(-8px);
  box-shadow:6px 6px 0 -1px #2a2a2e, 7px 7px 0 -1px #3a3a3e, 0 30px 44px rgba(0,0,0,.65);
}
.book-cat{font-family:var(--mono);font-size:11px;letter-spacing:.14em;opacity:.75;text-transform:uppercase;flex:none}
.book-title{font-size:19px;font-weight:800;line-height:1.35;margin-top:10px;flex:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book-sub{font-size:12.5px;line-height:1.5;opacity:.78;margin-top:8px;min-height:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.book-foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px;flex:none}
.status{
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.35);color:#fff;white-space:nowrap;
}
.book-date{font-family:var(--mono);font-size:11px;opacity:.7}
.book-meta{padding:16px 2px 0;position:relative;z-index:1}
.book-meta .m-title{display:block;font-size:14.5px;font-weight:700;line-height:1.45}
.book-meta .m-desc{font-size:12.5px;color:var(--t60);line-height:1.55;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-note{color:var(--t60);font-size:14px;padding:28px 0;text-align:center}
.end-note{text-align:center;color:var(--t30);font-size:13px;padding:26px 0 6px;font-family:var(--mono)}
.howto{
  background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);
  padding:18px 20px;margin:14px 0 8px;color:var(--t60);font-size:14px;line-height:1.7;
}
.howto b{color:var(--t100)}
.howto code{font-family:var(--mono);color:var(--orange);font-size:13px}
footer.site{border-top:1px solid var(--line2);margin-top:44px;padding:26px 0 40px;color:var(--t30);font-size:13px}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}

/* ---------- 阅读页 ---------- */
.doc-head{padding:44px 0 6px}
.backlink{
  display:inline-flex;align-items:center;gap:6px;color:var(--t60);font-size:14px;
  padding:8px 4px;min-height:38px;background:none;border:none;
}
.backlink:active{color:var(--t100)}
.doc-head h1{font-size:clamp(30px,5.4vw,50px);line-height:1.18;font-weight:900;margin:10px 0 16px}
.doc-sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--t60);font-size:15px}
.doc-sub .sep{color:var(--t30)}
.doc-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--t60)}
.doc-status.done{color:var(--green);border-color:rgba(48,209,88,.45)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 6px}
.toc a{
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;
  color:var(--t100);background:var(--card);min-height:40px;display:inline-flex;align-items:center;
}
.toc a:active{background:var(--card3)}
section.blk{padding-top:38px;scroll-margin-top:76px}
section.blk h2{
  font-size:clamp(21px,3.4vw,27px);font-weight:800;line-height:1.35;margin:0 0 16px;
  padding-left:14px;border-left:4px solid var(--blue);
}
section.blk p{color:var(--t60);font-size:15.5px;margin:0 0 14px}
section.blk p b,section.blk li b{color:var(--t100)}
section.blk ul{margin:0 0 14px;padding-left:20px;color:var(--t60);font-size:15.5px}
section.blk li{margin-bottom:7px}
section.blk li::marker{color:var(--orange)}
code.inl{font-family:var(--mono);font-size:.88em;color:var(--orange);background:var(--orange-dim);padding:1px 6px;border-radius:6px;white-space:nowrap}
.codecard{
  background:var(--card2);border:1px solid var(--line2);border-radius:var(--radius);
  margin:0 0 16px;overflow:hidden;
}
.codecard .cc-head{
  display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line2);
  font-family:var(--mono);font-size:12px;color:var(--t30);
}
.codecard .dot{width:9px;height:9px;border-radius:50%}
.codecard pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.7;color:#d7d7de}
.codecard pre .tk-com{color:#84848f;font-style:italic}
.codecard pre .tk-kw{color:#C586C0}
.codecard pre .tk-tag{color:#569CD6}
.codecard pre .tk-attr{color:#9CDCFE}
.codecard pre .tk-str{color:#E5C07B}
.codecard pre .tk-num{color:#B5CEA8}
.codecard pre .tk-fn{color:#DCDCAA}
.codecard pre .tk-punc{color:#8E8E93}
.tablecard{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);margin:0 0 16px;overflow:hidden}
.tablecard table{width:100%;border-collapse:collapse;font-size:14px}
.tablecard th{
  text-align:left;padding:11px 14px;background:var(--card2);color:var(--t100);
  font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tablecard td{padding:11px 14px;color:var(--t60);border-bottom:1px solid var(--line2);vertical-align:top}
.tablecard tr:last-child td{border-bottom:none}
.tablecard td b{color:var(--t100)}
.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:0 0 16px}
.concept{
  background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);padding:16px 18px;
}
.concept .c-name{font-size:16.5px;font-weight:800;margin-bottom:4px}
.concept .c-en{font-family:var(--mono);font-size:12px;color:var(--orange);margin-bottom:8px}
.concept p{font-size:13.5px;margin:0;color:var(--t60)}
.callout{
  background:var(--card2);border:1px solid rgba(255,159,10,.35);border-radius:var(--radius);
  padding:14px 18px;margin:0 0 16px;font-size:14.5px;color:var(--t60);
}
.callout b{color:var(--orange)}
.callout.blue{border-color:rgba(64,156,255,.4)}
.callout.blue b{color:var(--blue)}
/* 时间线图 */
.timeline{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);padding:18px;margin:0 0 16px;overflow-x:auto}
.tl-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-width:520px}
.tl-row:last-child{margin-bottom:4px}
.tl-name{width:86px;flex:none;font-family:var(--mono);font-size:13px;color:var(--t100)}
.tl-track{flex:1;display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--card3)}
.tl-seg{display:flex;align-items:center;justify-content:center;font-size:11px;color:#000;font-weight:700;white-space:nowrap;overflow:hidden}
.seg-parse{background:#8E8E93;color:#fff}
.seg-dl{background:#409CFF;color:#fff}
.seg-exec{background:#FF9F0A}
.seg-wait{background:transparent}
.tl-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--t60);margin-top:6px;min-width:520px}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.doc-foot-nav{margin:44px 0 10px;display:flex;gap:10px;flex-wrap:wrap}
.doc-foot-nav button{
  border:1px solid var(--line);background:var(--card);color:var(--t100);
  border-radius:999px;padding:10px 18px;font-size:14px;min-height:42px;
}
/* ---- 图三：阶梯时间轴 ---- */
.staircard{background:linear-gradient(180deg,#0b1e3a,#081426);border:1px solid rgba(64,156,255,.25);border-radius:14px;padding:18px 16px 14px;margin:0 0 14px;overflow:hidden}
.stair-labels{position:relative;height:118px}
.stair-tag{position:absolute;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:700;line-height:1.35;border:1.5px solid;white-space:normal}
.stair-tag small{display:block;font-weight:600;opacity:.9}
.stag-blue{left:0;top:0;width:34%;background:rgba(64,156,255,.18);border-color:#409CFF;color:#9ecbff}
.stag-pink{left:22%;top:32px;width:38%;background:rgba(255,107,157,.16);border-color:#ff6b9d;color:#ffb3c9}
.stag-green{left:46%;top:64px;width:36%;background:rgba(48,209,88,.16);border-color:#30D158;color:#8be9a8}
.stag-orange{left:66%;top:88px;width:34%;background:rgba(255,159,10,.18);border-color:#FF9F0A;color:#ffcf7a}
.stair-axis{position:relative;height:2px;background:rgba(235,235,245,.35);margin:10px 2px 0}
.stair-ticks{display:flex;justify-content:space-between;margin-top:10px}
.stair-ticks span{font-size:12px;color:var(--t60);position:relative;padding-top:2px}
.stair-ticks span::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:10px;background:rgba(235,235,245,.5)}
/* ---- 图三：四张彩色概念卡 ---- */
.concept4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}
.c4{border-radius:12px;padding:14px 14px 12px;background:#0a1526;border:1px solid var(--line2);border-top:4px solid}
.c4.blue{border-top-color:#409CFF}.c4.green{border-top-color:#30D158}.c4.orange{border-top-color:#FF9F0A}.c4.pink{border-top-color:#ff6b9d}
.c4-head{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14.5px;line-height:1.3;margin-bottom:8px}
.c4-dot{width:11px;height:11px;border-radius:50%;flex:none}
.c4 p{font-size:13px !important;margin:0 0 8px !important;line-height:1.6}
.c4 ul{font-size:13px !important;padding-left:16px !important;margin:0 !important}
.c4 li{margin-bottom:5px;line-height:1.55}
.c4 .ex{font-size:12.5px;color:var(--t60);line-height:1.6;margin-top:8px;border-top:1px dashed rgba(235,235,245,.15);padding-top:8px}
.c4 code{font-family:var(--mono);font-size:11.5px;color:#FFD60A;background:rgba(255,214,10,.12);padding:1px 5px;border-radius:5px}
/* ---- 通用徽标 ---- */
.type-badge{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;line-height:1.5;white-space:nowrap}
.tb-script{background:#2f6fd6;color:#fff}.tb-fetch{background:#1a9e4b;color:#fff}.tb-xhr{background:#c75b12;color:#fff}.tb-gray{background:#3a3a3e;color:#d7d7de}.tb-doc{background:#5e5ce6;color:#fff}
/* ---- 图一：口诀条 ---- */
.mnemonic{background:linear-gradient(90deg,#3a2f00,#2a2200);border-left:5px solid #FFD60A;border-radius:10px;padding:13px 16px;margin:0 0 16px;font-size:14.5px;line-height:1.65;color:#f5e6a0}
.mnemonic b{color:#FFD60A}
.mnemonic code{font-family:var(--mono);color:#FFD60A;background:rgba(255,214,10,.15);padding:1px 6px;border-radius:6px;font-size:.88em}
/* ---- 图二：DevTools 示意 ---- */
.devtools{background:#1e1e1e;border:1px solid #3a3a3e;border-radius:12px;overflow:hidden;margin:0 0 16px}
.dt-tabs{display:flex;gap:0;background:#2c2c2e;border-bottom:1px solid #3a3a3e;padding:0 10px;overflow-x:auto;white-space:nowrap}
.dt-tabs span{font-size:12.5px;color:#aeaeb2;padding:9px 12px}
.dt-tabs span.on{color:#fff;border-bottom:2px solid #409CFF;font-weight:700}
.dt-filters{display:flex;gap:6px;padding:8px 10px;background:#252526;border-bottom:1px solid #3a3a3e;overflow-x:auto;white-space:nowrap}
.dt-filters span{font-size:12px;color:#aeaeb2;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.dt-filters span.on{background:#409CFF;color:#fff;font-weight:700}
.dt-scroll{overflow-x:auto}
.dt-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.dt-table th{text-align:left;padding:8px 12px;background:#2c2c2e;color:#aeaeb2;font-weight:600;border-bottom:1px solid #3a3a3e;white-space:nowrap}
.dt-table td{padding:8px 12px;color:#e5e5ea;border-bottom:1px solid #2c2c2e;vertical-align:top}
.dt-table tr.hl td{background:rgba(255,159,10,.28);color:#fff}
.dt-table td.mono{font-family:var(--mono);font-size:12.5px}
/* ---- 图四上：四者区别时间线 ---- */
.tl2{background:linear-gradient(180deg,#0b1e3a,#081426);border:1px solid rgba(64,156,255,.22);border-radius:14px;padding:16px;margin:0 0 10px;overflow-x:auto}
.tl2-title{font-weight:800;font-size:15px;margin-bottom:10px;min-width:560px}
.tl2-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--t60);margin-bottom:14px;min-width:560px}
.tl2-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tl2-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:560px}
.tl2-name{width:110px;flex:none;font-family:var(--mono);font-size:12.5px;color:var(--t100)}
.tl2-track{flex:1;position:relative;height:26px;background:rgba(255,255,255,.04);border-radius:6px}
.tl2-seg{position:absolute;top:3px;height:20px;border-radius:5px}
.s-parse{background:#5b7aa6}.s-dl{background:#7dd3fc}.s-dep{background:#30D158}.s-exec{background:#ff8fab}
.tl2-note{font-size:13.5px;color:var(--t60);line-height:1.65;margin:0 0 16px}
/* ---- 图四下：甘特图 ---- */
.gantt{background:linear-gradient(180deg,#0b1e3a,#081426);border:1px solid rgba(64,156,255,.22);border-radius:14px;padding:16px;margin:0 0 16px;overflow-x:auto}
.gantt-title{font-weight:800;font-size:15px;margin-bottom:12px;min-width:620px}
.gantt-body{position:relative;min-width:620px}
.g-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.g-name{width:190px;flex:none;font-family:var(--mono);font-size:11.5px;color:#d7d7de;text-align:right;padding-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{flex:1;position:relative;height:20px}
.g-bar{position:absolute;top:2px;height:16px;border-radius:5px}
.g-bar span{position:absolute;left:100%;top:0;margin-left:6px;font-size:11px;white-space:nowrap;color:var(--t60)}
.gb-pre{background:#7dd3fc}.gb-ondemand{background:#30D158}.gb-delay{background:#ff8fab}.gb-prefetch{background:#409CFF}.gb-click{background:#FF9F0A}.gb-doc{background:#e9a8e9}
.g-vline{position:absolute;top:0;bottom:22px;width:0;border-left:2px dashed}
.g-vline.green{border-color:#30D158}.g-vline.yellow{border-color:#FFD60A}
.g-vlabel{position:absolute;top:-2px;font-size:11px;font-weight:700;white-space:nowrap;transform:translateX(6px)}
.g-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--t60);margin-top:10px;min-width:620px}
.g-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---- SVG 图表（全站图表一律 SVG） ---- */
.svgcard{background:linear-gradient(180deg,#0b1e3a,#081426);border:1px solid rgba(64,156,255,.25);border-radius:14px;padding:14px 14px 10px;margin:0 0 14px}
.svgcard svg,.c4-svg{display:block;width:100%;height:auto}
.svgcard svg text{font-family:var(--sans)}
.c4-svg{margin:2px 0 10px;background:rgba(255,255,255,.03);border-radius:8px}
[hidden]{display:none !important}

@media (max-width:640px){
  .topbar-in{padding:0 14px;gap:8px}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ---------- 轻量语法高亮：先分词、逐段转义再包 span，尖括号不会被当真标签 ---------- */
function highlightJS(code){
  var re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`(?:\\.|[^`\\])*`)|\b(var|let|const|function|return|if|else|for|while|do|new|await|async|import|from|export|default|typeof|instanceof|in|of|break|continue|switch|case|try|catch|finally|throw|class|extends|delete|void|yield)\b|\b(true|false|null|undefined|this)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)(?=\s*:)/g;
  var out = "", last = 0, m;
  while ((m = re.exec(code)) !== null){
    out += esc(code.slice(last, m.index));
    var cls = m[1] ? "tk-com" : m[2] ? "tk-str" : m[3] ? "tk-kw" : m[4] ? "tk-kw" : m[5] ? "tk-num" : m[6] ? "tk-fn" : "tk-attr";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}
function highlightCSS(code){
  var re = /(\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|(@[\w-]+)|([a-zA-Z-]+)(\s*:)|(\b\d+(?:\.\d+)?(?:px|em|rem|%|ms|s|vh|vw)?\b)|([A-Za-z_-][\w-]*)(?=\s*\()/g;
  var out = "", last = 0, m;
  while ((m = re.exec(code)) !== null){
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-com">' + esc(m[0]) + "</span>";
    else if (m[2]) out += '<span class="tk-str">' + esc(m[0]) + "</span>";
    else if (m[3]) out += '<span class="tk-kw">' + esc(m[0]) + "</span>";
    else if (m[4]) out += '<span class="tk-attr">' + esc(m[4]) + "</span>" + esc(m[5] || "");
    else if (m[6]) out += '<span class="tk-num">' + esc(m[0]) + "</span>";
    else out += '<span class="tk-fn">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}
function highlightHTML(code){
  var out = "", i = 0, n = code.length, mode = null;
  while (i < n){
    if (code.substr(i, 4) === "<!--"){
      var endC = code.indexOf("-->", i + 4);
      if (endC < 0) endC = n - 3;
      out += '<span class="tk-com">' + esc(code.slice(i, endC + 3)) + "</span>";
      i = endC + 3;
    } else if (code[i] === "<" && /[\/!a-zA-Z]/.test(code[i + 1] || "")){
      var j = i + 1, closing = false;
      var tagHtml = '<span class="tk-punc">&lt;</span>';
      if (code[j] === "/"){ closing = true; tagHtml += '<span class="tk-punc">/</span>'; j++; }
      var nameStart = j;
      while (j < n && /[\w-]/.test(code[j])) j++;
      var tagName = code.slice(nameStart, j);
      tagHtml += '<span class="tk-tag">' + esc(tagName) + "</span>";
      while (j < n && code[j] !== ">"){
        if (code[j] === "/" && code[j + 1] === ">"){ tagHtml += '<span class="tk-punc">/</span>'; j++; break; }
        if (/\s/.test(code[j])){ tagHtml += esc(code[j]); j++; continue; }
        var aStart = j;
        while (j < n && /[\w-]/.test(code[j])) j++;
        if (j === aStart){ tagHtml += esc(code[j]); j++; continue; }
        tagHtml += '<span class="tk-attr">' + esc(code.slice(aStart, j)) + "</span>";
        var k = j;
        while (k < n && /\s/.test(code[k])) k++;
        if (code[k] === "="){
          tagHtml += esc(code.slice(j, k)) + '<span class="tk-punc">=</span>';
          k++;
          var vStart = k;
          while (vStart < n && /\s/.test(code[vStart])) vStart++;
          tagHtml += esc(code.slice(k, vStart));
          var q = code[vStart];
          if (q === '"' || q === "'"){
            var vEnd = code.indexOf(q, vStart + 1);
            if (vEnd < 0) vEnd = n - 1;
            tagHtml += '<span class="tk-str">' + esc(code.slice(vStart, vEnd + 1)) + "</span>";
            j = vEnd + 1;
          } else {
            var uEnd = vStart;
            while (uEnd < n && !/[\s>]/.test(code[uEnd])) uEnd++;
            tagHtml += '<span class="tk-str">' + esc(code.slice(vStart, uEnd)) + "</span>";
            j = uEnd;
          }
        }
      }
      if (j < n && code[j] === ">"){ tagHtml += '<span class="tk-punc">&gt;</span>'; j++; }
      out += tagHtml;
      var ln = tagName.toLowerCase();
      if (!closing && ln === "script") mode = "js";
      else if (!closing && ln === "style") mode = "css";
      else if (closing && (ln === "script" || ln === "style")) mode = null;
      i = j;
    } else {
      var next = code.indexOf("<", i);
      if (next < 0) next = n;
      if (next === i) next = i + 1;
      var text = code.slice(i, next);
      out += mode === "js" ? highlightJS(text) : mode === "css" ? highlightCSS(text) : esc(text);
      i = next;
    }
  }
  return out;
}
function highlightCode(code, lang){
  lang = (lang || "").toLowerCase();
  if (!lang) lang = /^\s*</.test(code) ? "html" : "js";
  if (lang.indexOf("html") >= 0) return highlightHTML(code);
  if (lang.indexOf("css") >= 0) return highlightCSS(code);
  return highlightJS(code);
}

var currentDoc = null;
function renderDoc(id){
  var d = null;
  DOCS.forEach(function(x){ if (x.id === id) d = x; });
  if (!d){ location.hash = "#/"; return; }
  currentDoc = id;
  var root = document.getElementById("docRoot");
  var statusCls = d.status === "已完成" ? " done" : "";
  var toc = d.sections.map(function(s, i){
    return '<a href="#/doc/' + d.id + '" data-sec="' + i + '">' + (CIRCLED[i] || (i + 1)) + " " + s.title.split("：")[0].split("，")[0] + "</a>";
  }).join("");
  var body = d.sections.map(function(s, i){
    return '<section class="blk" id="sec-' + i + '"><h2>' + (CIRCLED[i] || (i + 1)) + " " + s.title + "</h2>" +
      s.blocks.map(blockHTML).join("") + "</section>";
  }).join("");
  root.innerHTML =
    '<div class="doc-head">' +
      '<button class="backlink" id="backBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>返回书架</button>' +
      "<h1>" + d.title + "</h1>" +
      '<div class="doc-sub"><span class="doc-status' + statusCls + '">' + d.status + '</span><span>' + d.category + '</span><span class="sep">·</span><span>' + d.date + "</span>" +
      d.chips.map(function(c){ return '<span class="chip">' + c + "</span>"; }).join("") + "</div>" +
      '<nav class="toc">' + toc + "</nav>" +
    "</div>" + body +
    '<div class="doc-foot-nav"><button id="backBtn2">返回书架</button></div>';
  document.getElementById("backBtn").addEventListener("click", goHome);
  document.getElementById("backBtn2").addEventListener("click", goHome);
  root.querySelectorAll(".toc a").forEach(function(a){
    a.addEventListener("click", function(ev){
      ev.preventDefault();
      var el = document.getElementById("sec-" + a.getAttribute("data-sec"));
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  window.scrollTo(0, 0);
}
function goHome(){ location.hash = "#/"; }

/* ---------- 路由 ---------- */
function route(){
  var h = location.hash || "#/";
  var m = h.match(/^#\/doc\/(.+)$/);
  var home = document.getElementById("viewHome");
  var doc = document.getElementById("viewDoc");
  document.getElementById("navHome").classList.toggle("on", !m);
  document.getElementById("navAll").classList.toggle("on", false);
  if (m){
    home.hidden = true; doc.hidden = false;
    var targetId = decodeURIComponent(m[1]);
    if (targetId !== currentDoc) renderDoc(targetId);
  } else {
    currentDoc = null;
    doc.hidden = true; home.hidden = false;
    renderHome();
  }
}
document.getElementById("navAll").addEventListener("click", function(ev){
  ev.preventDefault();
  state.cat = "全部"; state.q = "";
  document.getElementById("searchInput").value = "";
  location.hash = "#/"; route();
});
document.getElementById("searchInput").addEventListener("input", function(e){
  state.q = e.target.value.trim(); renderShelf();
});
window.addEventListener("hashchange", route);
route();
</script>
