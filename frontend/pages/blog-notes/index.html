<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>博客笔记</title>
  <style>
    :root {
      --bg-paper: #FBF8F3;
      --bg-card: #F4EFE6;
      --bg-card-hover: #EFE8DC;
      --bg-elevated: #FFFFFF;
      --text-main: #1C1917;
      --text-secondary: #57534E;
      --text-muted: #78716C;
      --border-subtle: #E7E0D3;
      --border-strong: #D6CCBA;
      --accent-gold: #B47824;
      --accent-gold-bg: #FEF6E6;
      --accent-gold-border: #E9C88B;
      --grid-line: rgba(180, 160, 130, 0.11);
      --book-page-bg: #FCF9F2;
      --book-page-line: #DDD3C2;
      --book-shadow: 0 8px 18px -5px rgba(28, 25, 23, 0.16), 0 2px 6px -2px rgba(28, 25, 23, 0.09);
      --book-shadow-hover: 0 18px 30px -6px rgba(28, 25, 23, 0.25), 0 6px 12px -3px rgba(28, 25, 23, 0.14);
    }
    html.dark {
      --bg-paper: #141311;
      --bg-card: #1E1C19;
      --bg-card-hover: #272420;
      --bg-elevated: #22201C;
      --text-main: #F5F2EB;
      --text-secondary: #A8A29E;
      --text-muted: #78716C;
      --border-subtle: #2E2B26;
      --border-strong: #44403C;
      --accent-gold: #E5A94C;
      --accent-gold-bg: rgba(229, 169, 76, 0.14);
      --accent-gold-border: rgba(229, 169, 76, 0.38);
      --grid-line: rgba(255, 255, 255, 0.035);
      --book-page-bg: #E6E0D4;
      --book-page-line: #B8B0A0;
      --book-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.55), 0 3px 8px -2px rgba(0, 0, 0, 0.4);
      --book-shadow-hover: 0 20px 34px -6px rgba(0, 0, 0, 0.72), 0 6px 14px -3px rgba(0, 0, 0, 0.5);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-paper);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .font-serif-reader {
      font-family: 'Noto Serif SC', Georgia, 'Songti SC', serif;
    }
    .font-sans-reader {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .paper-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    .paper-card-elevated {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
    }
    .paper-card-hover:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }
    .pro-badge {
      background-color: var(--accent-gold-bg);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold-border);
    }
    .gold-btn {
      background: linear-gradient(135deg, #D4953A 0%, #B47824 100%);
      color: #FFFDF9;
    }
    .gold-btn:hover {
      filter: brightness(1.06);
    }

    /* =====================================================================
       1. 顶部导航栏响应式布局（杜绝固定高度溢出与文字挤压）
       ===================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: rgba(251, 248, 243, 0.92);
      border-bottom: 1px solid var(--border-subtle);
    }
    html.dark .site-header {
      background-color: rgba(20, 19, 17, 0.92);
    }
    .header-inner {
      max-width: 1152px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
    }
    @media (min-width: 640px) {
      .header-inner {
        padding: 12px 24px;
      }
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }
    @media (min-width: 960px) {
      .header-brand {
        flex: 0 1 auto;
      }
    }
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      order: 3;
      width: 100%;
      padding-top: 8px;
      margin-top: 2px;
      border-top: 1px solid var(--border-subtle);
      overflow-x: auto;
    }
    .header-nav button {
      white-space: nowrap;
      flex-shrink: 0;
    }
    @media (min-width: 960px) {
      .header-nav {
        order: 2;
        width: auto;
        padding-top: 0;
        margin-top: 0;
        border-top: none;
        gap: 6px;
      }
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      order: 2;
      flex-shrink: 0;
    }
    @media (min-width: 960px) {
      .header-actions {
        order: 3;
        gap: 8px;
      }
    }
    .header-actions button {
      white-space: nowrap;
    }

    /* =====================================================================
       2. 首页“我平时使用的模型”响应式双栏与内部多列布局
       ===================================================================== */
    .models-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (min-width: 1024px) {
      .models-layout {
        grid-template-columns: 54fr 46fr;
        gap: 24px;
      }
    }
    .models-left-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    /* 第 2 行：02 高性价比执行 (2/3) + 04 图片生成 (1/3) 并排 */
    .models-row-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }
    @media (min-width: 640px) {
      .models-row-split {
        grid-template-columns: 2fr 1fr;
      }
    }
    /* 分类内部模型小卡片网格 */
    .model-cards-grid-3 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 640px) {
      .model-cards-grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
    }
    @media (max-width: 370px) {
      .model-cards-grid-3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .model-cards-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (max-width: 370px) {
      .model-cards-grid-2 {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .model-cards-grid-1 {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }

    /* =====================================================================
       3. 竖版 3:4 实体书架网格（手机 2 列 / 平板 3 列 / 桌面 4 列）
       ===================================================================== */
    .books-shelf-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 16px;
      width: 100%;
    }
    @media (min-width: 640px) {
      .books-shelf-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 32px 22px;
      }
    }
    @media (min-width: 1024px) {
      .books-shelf-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 36px 24px;
      }
    }

    .book-item-group {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      min-width: 0;
      width: 100%;
    }
    .book-stage-outer {
      width: 100%;
      padding-right: 7px; /* 预留右侧书页厚度条空间，防止溢出网格 */
      margin-bottom: 12px;
    }
    .book-3d-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 3px 10px 10px 3px;
      box-shadow: var(--book-shadow);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
    }
    .book-item-group:hover .book-3d-stage {
      transform: translateY(-5px);
      box-shadow: var(--book-shadow-hover);
    }
    .book-page-edges {
      position: absolute;
      top: 3px;
      bottom: 3px;
      right: -6px;
      width: 7px;
      border-radius: 0 4px 4px 0;
      background: repeating-linear-gradient(
        to right,
        var(--book-page-bg) 0px,
        var(--book-page-bg) 1.4px,
        var(--book-page-line) 1.4px,
        var(--book-page-line) 2.2px
      );
      border-top: 1px solid rgba(0, 0, 0, 0.12);
      border-right: 1px solid rgba(0, 0, 0, 0.18);
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
      z-index: 1;
    }
    .book-front-cover {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 3px 10px 10px 3px;
      overflow: hidden;
      z-index: 2;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.10), inset -1px 0 2px rgba(255, 255, 255, 0.22);
    }
    .book-spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 14px;
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.24) 0%,
        rgba(0, 0, 0, 0.08) 22%,
        rgba(0, 0, 0, 0.26) 54%,
        rgba(255, 255, 255, 0.32) 68%,
        rgba(0, 0, 0, 0.04) 85%,
        transparent 100%
      );
    }
    .book-cover-sheen {
      position: absolute;
      inset: 0;
      z-index: 14;
      pointer-events: none;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.0) 45%,
        rgba(0, 0, 0, 0.06) 100%
      );
    }

    /* =====================================================================
       4. 文章详情页响应式双栏阅读器（桌面左目录右正文，手机手风琴目录）
       ===================================================================== */
    .reader-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .reader-sidebar-desktop {
      display: none;
    }
    .reader-toc-mobile {
      display: block;
    }
    @media (min-width: 1024px) {
      .reader-layout {
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 32px;
      }
      .reader-sidebar-desktop {
        display: block;
        position: sticky;
        top: 84px;
      }
      .reader-toc-mobile {
        display: none;
      }
    }

    .reader-fade-mask {
      mask-image: linear-gradient(to bottom, black 35%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 35%, transparent 100%);
    }
    .diamond-list li {
      position: relative;
      padding-left: 1.35rem;
    }
    .diamond-list li::before {
      content: "✦";
      position: absolute;
      left: 0;
      top: 0.05rem;
      color: var(--accent-gold);
      font-size: 0.85em;
    }

    /* =====================================================================
       内置完整原子化与响应式 CSS 引擎（零外部 CDN 依赖、0ms 首屏渲染）
       ===================================================================== */
    ul, ol { list-style: none; margin: 0; padding: 0; }
    h1, h2, h3, h4, p, blockquote, figure { margin: 0; }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: transparent;
      border: none;
      margin: 0;
    }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; flex-shrink: 0; }

    .block { display: block; }
    .inline-block { display: inline-block; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .grid { display: grid; }
    .hidden { display: none; }
    .drop-shadow-xs { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12)); }
    .divide-\[var\(--border-subtle\)\] > :not([hidden]) ~ :not([hidden]) { border-color: var(--border-subtle); }
    html.dark .dark\:bg-white\/10 { background-color: rgba(255, 255, 255, 0.10); }
    .flex-col { flex-direction: column; }
    .flex-row { flex-direction: row; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-1 { flex: 1 1 0%; }
    .flex-grow { flex-grow: 1; }
    .flex-shrink, .shrink { flex-shrink: 1; }
    .shrink-0 { flex-shrink: 0; }
    .items-start { align-items: flex-start; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-start { justify-content: flex-start; }
    .justify-center { justify-content: center; }
    .justify-end { justify-content: flex-end; }
    .justify-between { justify-content: space-between; }
    .self-start { align-self: flex-start; }

    .relative { position: relative; }
    .absolute { position: absolute; }
    .fixed { position: fixed; }
    .sticky { position: sticky; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .bottom-5 { bottom: 1.25rem; }
    .right-5 { right: 1.25rem; }
    .z-10 { z-index: 10; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }

    .min-h-screen { min-height: 100vh; }

    .w-full { width: 100%; }
    .h-full { height: 100%; }

    .max-w-\[180px\] { max-width: 180px; }

    .max-h-\[90vh\] { max-height: 90vh; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .mx-3 { margin-left: 0.75rem; margin-right: 0.75rem; }

    .mb-8 { margin-bottom: 2rem; }
    .mb-14 { margin-bottom: 3.5rem; }

    .p-0\.5 { padding: 0.125rem; }
    .p-1\.5 { padding: 0.375rem; }
    .p-2 { padding: 0.5rem; }
    .p-2\.5 { padding: 0.625rem; }

    .p-3\.5 { padding: 0.875rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .p-6 { padding: 1.5rem; }
    .p-10 { padding: 2.5rem; }

    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }

    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-3\.5 { padding-left: 0.875rem; padding-right: 0.875rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
    .py-0\.2 { padding-top: 0.08rem; padding-bottom: 0.08rem; }
    .py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }

    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }

    .pt-1 { padding-top: 0.25rem; }

    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }

    .rounded { border-radius: 0.25rem; }
    .rounded-md { border-radius: 0.375rem; }

    .rounded-xl { border-radius: 0.75rem; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-full { border-radius: 9999px; }

    .border { border: 1px solid var(--border-subtle); }
    .border-2 { border: 2px solid var(--accent-gold-border); }
    .border-t { border-top: 1px solid var(--border-subtle); }
    .border-b { border-bottom: 1px solid var(--border-subtle); }
    .border-l-3 { border-left: 3px solid var(--accent-gold); }
    .border-dashed { border-style: dashed; }
    .border-\[var\(--border-subtle\)\] { border-color: var(--border-subtle); }
    .border-\[var\(--border-strong\)\] { border-color: var(--border-strong); }

    // 渲染 3D 竖版实体书本封皮组件 (纯矢量等比自适应，杜绝外链裂图或 alt 溢出)
    function renderPhysicalBookCover(art) {
      return `
        <div class="book-stage-outer">
          <div class="book-3d-stage">
            <div class="book-page-edges"></div>
            <div class="book-front-cover">
              <div class="book-spine-crease"></div>

              ${renderVerticalPublicationSVG(art)}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 4. 路由系统 (SPA Router)
    // =========================================================================
    function navigateTo(path) {
      stopAudio();
      state.currentRoute = path;
      state.mobileTocOpen = false;
      try {
        window.location.hash = path;
      } catch (e) {}
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderApp();
    }

    function syncRouteFromHash() {
      const rawHash = window.location.hash ? window.location.hash.slice(1) : "/";
      if (rawHash && (rawHash === "/" || rawHash === "/articles" || rawHash === "/curated" || rawHash === "/routes" || rawHash.startsWith("/articles/"))) {
        state.currentRoute = rawHash;
      } else {
        state.currentRoute = "/";
      }
      renderApp();
    }

    window.addEventListener("hashchange", syncRouteFromHash);

    // =========================================================================
    // 5. 视图渲染函数 (首页 / 原创列表 / 精选收录 / 文章详情页 / 全站路由表)
    // =========================================================================
    function updateHeaderActiveNav() {
      const isDetail = state.currentRoute.startsWith("/articles/");
      const mainNav = document.getElementById("header-main-nav");
      const domainBadge = document.getElementById("header-domain-badge");
      const bc = document.getElementById("header-breadcrumb");

      // 在文章详情页隐藏中间主导航栏，与原站一致；在首页和列表页展示中间主导航
      if (mainNav) {
        if (isDetail) {
          mainNav.style.display = "none";
        } else {
          mainNav.style.display = "flex";
        }
      }

      const navIds = {
        "/": "nav-home",
        "/articles": "nav-articles",
        "/curated": "nav-curated",
        "/routes": "nav-routes"
      };
      Object.entries(navIds).forEach(([route, elId]) => {
        const btn = document.getElementById(elId);
        if (!btn) return;
        const isActive = state.currentRoute === route;
        if (isActive) {
          btn.className = "px-2.5 py-1 text-xs sm:text-sm font-semibold rounded-md text-[var(--text-main)] underline decoration-[var(--accent-gold)] decoration-2 underline-offset-8 whitespace-nowrap";
        } else {
          btn.className = "px-2.5 py-1 text-xs sm:text-sm font-medium rounded-md text-[var(--text-secondary)] hover:text-[var(--text-main)] transition-colors whitespace-nowrap";
        }
      });

      // 更新顶部面包屑（仅在文章详情页且中大屏显示，窄屏自动隐藏防止挤压）
      if (bc) {
        if (isDetail) {
          const slug = state.currentRoute.replace("/articles/", "");
          const art = OIL_BOOK_DATA.articles.find(a => a.slug === slug);
          if (art) {
            const parentName = art.type === "original" ? "原创" : "精选收录";
            const parentRoute = art.type === "original" ? "/articles" : "/curated";
            bc.innerHTML = `
              <span class="shrink-0">/</span>
              <button type="button" onclick="navigateTo('${parentRoute}')" class="hover:text-[var(--text-main)] shrink-0 whitespace-nowrap">${parentName}</button>
              <span class="shrink-0">/</span>
              <span class="text-[var(--text-secondary)] truncate max-w-[180px] lg:max-w-[320px]">${art.title}</span>
            `;
            bc.className = "hidden md:flex items-center gap-1.5 text-xs text-[var(--text-muted)] min-w-0 truncate";
          }
        } else {
          bc.innerHTML = "";
          bc.className = "hidden";
        }
      }

      // 在文章详情页窄屏下隐藏 domainBadge
      if (domainBadge) {
        domainBadge.className = isDetail
          ? "hidden lg:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-[var(--bg-card)] border border-dashed border-[var(--border-strong)] text-[var(--text-secondary)] whitespace-nowrap"
          : "hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-[var(--bg-card)] border border-dashed border-[var(--border-strong)] text-[var(--text-secondary)] whitespace-nowrap";
      }

      // 更新 Pro 按钮与登录状态显示
      const proText = document.getElementById("header-pro-text");
      if (proText) {
        proText.textContent = state.proUnlocked ? "Pro 已解锁" : "订阅 Pro";
      }
      const loginBtn = document.getElementById("header-login-btn");
      if (loginBtn) {
        loginBtn.textContent = state.loggedInUser ? state.loggedInUser : "登录";
      }
    }

    // 渲染单个模型选择小卡片（适应 3 列 / 2 列 / 1 列紧凑网格）

                  <div class="model-cards-grid-2">

    function renderArticleCard(art) {
      const hasTopTags = (art.chapter && art.chapter !== "精选译文") || art.isPro;

          onclick="navigateTo('/articles/${art.slug}')"

              <div class="flex flex-wrap items-center gap-1.5">
                ${art.chapter && art.chapter !== "精选译文" ? `<span class="text-xs font-semibold text-[var(--accent-gold)]">${art.chapter}</span>` : ""}

              ${art.title}
            </h3>

            <div class="pt-0.5 w-full min-w-0">

                art.type === "original"
                  ? `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[var(--bg-card)] border border-[var(--border-subtle)] text-[11px] font-medium text-[var(--text-secondary)]">

                      <span class="truncate">${art.author}</span>

      } else if (state.currentRoute === "/curated") {
        mainEl.innerHTML = renderCuratedListView();
      } else if (state.currentRoute === "/routes") {
        mainEl.innerHTML = renderRoutesDirectoryView();
      } else if (state.currentRoute.startsWith("/articles/")) {
        const slug = state.currentRoute.replace("/articles/", "");
        mainEl.innerHTML = renderArticleDetailView(slug);
      } else {
        mainEl.innerHTML = renderHomeView();
      }

    // 语音伴读播放器 (Web Speech API + 计时器)
    function formatSec(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function toggleArticleAudio(slug) {
      if (state.audioPlayingSlug === slug) {
        stopAudio();
        renderApp();
        return;
      }
      stopAudio();
      const art = OIL_BOOK_DATA.articles.find(a => a.slug === slug);
      if (!art) return;

      state.audioPlayingSlug = slug;
      state.audioProgressSec = 0;

      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const textToRead = `${art.title}。作者：${art.author}。${art.summary}。` +
            art.sections.map(s => `${s.heading}。${(s.paragraphs || []).join(" ")}`).join(" ");
          const utter = new SpeechSynthesisUtterance(textToRead);
          utter.lang = "zh-CN";
          utter.rate = 1.05;
          utter.onend = () => {
            stopAudio();
            renderApp();
          };
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {}

      audioTimer = setInterval(() => {
        state.audioProgressSec += 1;
        const tEl = document.getElementById("audio-progress-time");
        if (tEl) tEl.textContent = formatSec(state.audioProgressSec) + " / ";
      }, 1000);
      renderApp();
    }

    function stopAudio() {
      if (audioTimer) {
        clearInterval(audioTimer);
        audioTimer = null;
      }
      state.audioPlayingSlug = null;
      state.audioProgressSec = 0;
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
    }

    function formatCountdown(sec) {
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${d} 天 ${String(h).padStart(2, "0")} : ${String(m).padStart(2, "0")} : ${String(s).padStart(2, "0")}`;
    }

      renderModalContent();

        countdownTimer = setInterval(() => {
          if (state.countdownSec > 0) {
            state.countdownSec -= 1;
            const el = document.getElementById("pro-modal-countdown");
            if (el) el.textContent = formatCountdown(state.countdownSec);
          }

                <div class="text-xs font-bold text-[var(--accent-gold)]">✦ 博客笔记</div>
                <h3 class="text-xl font-bold text-[var(--text-main)] mt-0.5">登录博客笔记</h3>
                <p class="text-xs text-[var(--text-secondary)] mt-1">使用 Google 账号，或通过邮箱验证码登录。</p>
              </div>
              <button type="button" onclick="closeModal()" class="text-[var(--text-muted)] hover:text-[var(--text-main)] text-lg leading-none">✕</button>
            </div>

            <button
              type="button"
              onclick="completeLogin('Google 用户')"
              class="w-full py-2.5 px-4 rounded-xl paper-card hover:border-[var(--border-strong)] text-xs sm:text-sm font-semibold flex items-center justify-center gap-2"
            >
              <span class="font-bold text-amber-600">G</span>
              <span>使用 Google 账号继续</span>
            </button>

            <div class="relative flex py-1 items-center">
              <div class="flex-grow border-t border-[var(--border-subtle)]"></div>
              <span class="flex-shrink mx-3 text-xs text-[var(--text-muted)]">或使用邮箱</span>
              <div class="flex-grow border-t border-[var(--border-subtle)]"></div>
            </div>

            <form onsubmit="handleEmailLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-[var(--text-main)] mb-1.5">邮箱地址</label>
                <input
                  type="email"
                  id="login-email-input"
                  required
                  placeholder="you@example.com"
                  class="w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm paper-card focus:outline-none focus:border-[var(--accent-gold)]"
                />
              </div>
              <label class="flex items-center gap-2 text-xs text-[var(--text-secondary)] cursor-pointer">
                <input type="checkbox" checked class="rounded border-[var(--border-strong)] text-amber-600" />
                <span>新文章上线时发邮件通知我（随时可退订）</span>
              </label>
              <button type="submit" class="w-full py-2.5 rounded-xl text-xs sm:text-sm font-bold gold-btn">
                发送验证码 →
              </button>
              <p class="text-[11px] text-center text-[var(--text-muted)]">验证码 30 分钟内有效，不设密码。</p>
            </form>
          </div>
        `;
      }
    }

    function handleSubmissionAction() {
      if (!state.loggedInUser) {
        openModal("login");
        return;
      }
      if (!state.submitDraft.trim()) {
        showToast("请先填写你的选题建议或推荐内容");
        return;
      }
      showToast(`已收到你的「${state.submitTab}」投递！`);
      state.submitDraft = "";
      closeModal();
    }

    function activateProInSpa() {
      state.proUnlocked = true;
      closeModal();
      showToast("已为你解锁全站 Pro 专享章节与语音伴读预览！");
      renderApp();
    }

    function completeLogin(userLabel) {
      state.loggedInUser = userLabel;
      closeModal();
      showToast(`欢迎回来，${userLabel}`);
      renderApp();
    }

    function handleEmailLogin(e) {
      e.preventDefault();
      const input = document.getElementById("login-email-input");
      const email = input && input.value ? input.value.trim() : "reader@example.com";
      completeLogin(email.split("@")[0]);
    }

    // =========================================================================
    // 8. 主题切换、倒计时与轻提示 (Toast)
    // =========================================================================
    function toggleTheme() {
      const root = document.documentElement;
      root.classList.toggle("dark");
      const isDark = root.classList.contains("dark");
      showToast(isDark ? "已切换至夜间护眼模式" : "已切换至米白和纸浅色模式");
    }

    function showToast(msg) {
      const container = document.getElementById("toast-container");
      const text = document.getElementById("toast-message");
      if (!container || !text) return;
      text.textContent = msg;
      container.classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        container.classList.add("hidden");
      }, 2600);
    }

    // 初始路由渲染
    window.addEventListener("DOMContentLoaded", () => {
      syncRouteFromHash();
    });
  </script>
</body>
</html>
