<style>
    /* ================= 1. 核心动态 CSS 变量体系 ================= */
    :root {
      /* 顶部弥散渐变与双光斑色值（默认01：冰川晴空） */
      --hero-bg-base: #FFFFFF;
      --orb-color-1: #BCE0FD;
      --orb-color-2: #93C5FD;
      
      /* 按钮与组件专属联动色 */
      --refresh-btn-bg: #74B9FF;       /* 刷新数据按钮底色 */
      --refresh-btn-text: #FFFFFF;     /* 刷新按钮文字色 */
      --send-circle-bg: #9CCAF9;       /* 搜索框右侧圆形按钮色 */
      --send-circle-icon: #0F172A;     /* 搜索框右侧圆形按钮箭头色 */
      
      /* 主题强调色与标签配比（联动下方列表与右上角地球图标） */
      --theme-accent: #2563EB;         /* 价格、地球图标、品牌竖条、激活色 */
      --theme-tab-text: #0F172A;       /* Tab 选中文字色 */
      --theme-tag-bg: #EBF5FF;         /* 商品卡片标签底色 */
      --theme-tag-text: #1D4ED8;       /* 商品卡片标签文字色 */
      --search-glow: rgba(147, 197, 253, 0.38); /* 搜索框弥散光晕阴影 */

      /* 下方页面背景与卡片表面色（随主题微染 + 支持深色模式） */
      --page-bg: #F4F8FC;
      --card-bg: #FFFFFF;
      --card-border: rgba(226, 232, 240, 0.75);
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --pill-surface: #FFFFFF;
      --pill-shadow: 0 6px 20px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    /* 深色模式覆盖变量（单击右上角太阳按钮切换） */
    [data-dark="true"] {
      --hero-bg-base: #0B1120;
      --page-bg: #090D16;
      --card-bg: #151F32;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --pill-surface: #1E293B;
      --pill-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --theme-tab-text: #F8FAFC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--page-bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.55s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
    }

    /* 居中移动端/平板自适应容器 */
    .app-container {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 48px;
    }

    /* ================= 2. 顶部弥散渐变区域 ================= */
    .hero-header {
      position: relative;
      background-color: var(--hero-bg-base);
      padding: 16px 18px 26px;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      box-shadow: 0 14px 34px -12px var(--search-glow);
      transition: background-color 0.55s ease, box-shadow 0.6s ease;
      z-index: 10;
    }

    /* 动态弥散光斑层（独立裁切圆角，避免遮挡下拉主题面板） */
    .aura-backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
    }

    .aura-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(48px);
      opacity: 0.82;
      transition: background-color 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-dark="true"] .aura-orb {
      opacity: 0.28;
      filter: blur(56px);
    }

    .aura-orb.orb-left {
      width: 280px;
      height: 220px;
      bottom: -60px;
      left: -40px;
      background-color: var(--orb-color-1);
    }

    .aura-orb.orb-right {
      width: 300px;
      height: 240px;
      bottom: -75px;
      right: -45px;
      background-color: var(--orb-color-2);
    }

    .aura-orb.orb-center {
      width: 260px;
      height: 190px;
      bottom: -55px;
      left: 24%;
      background-color: #9EE0C5;
      opacity: 0;
      transition: opacity 0.6s ease, background-color 0.75s ease;
    }

    /* ================= 2.5 第12号主题「视频同款·流光幻彩」专属动态呼吸呼吸极光 ================= */
    @keyframes videoHoloLeft {
      0%   { background-color: #B2E2B4; transform: translate(-8px, -4px) scale(1.04); }
      25%  { background-color: #8FDBB8; transform: translate(16px, -12px) scale(1.1); }
      50%  { background-color: #92C6F2; transform: translate(8px, 6px) scale(1.06); }
      75%  { background-color: #B9CFF8; transform: translate(-12px, -6px) scale(1.02); }
      100% { background-color: #B2E2B4; transform: translate(-8px, -4px) scale(1.04); }
    }

    @keyframes videoHoloRight {
      0%   { background-color: #98DBC5; transform: translate(10px, 6px) scale(1.05); }
      25%  { background-color: #9CC8F7; transform: translate(-16px, -8px) scale(1.1); }
      50%  { background-color: #A7D0F7; transform: translate(-8px, 8px) scale(1.04); }
      75%  { background-color: #BDE7D5; transform: translate(14px, -6px) scale(1.08); }
      100% { background-color: #98DBC5; transform: translate(10px, 6px) scale(1.05); }
    }

    @keyframes videoHoloCenter {
      0%   { background-color: #9EDDC5; transform: translateY(0px) scale(1.02); }
      33%  { background-color: #9FCAF5; transform: translateY(-14px) scale(1.12); }
      66%  { background-color: #CFE7FB; transform: translateY(6px) scale(0.98); }
      100% { background-color: #9EDDC5; transform: translateY(0px) scale(1.02); }
    }

    @keyframes videoHoloBtn {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    [data-holo="true"] .aura-orb.orb-left {
      animation: videoHoloLeft 4.8s ease-in-out infinite;
      filter: blur(42px);
      opacity: 0.9;
    }

    [data-holo="true"] .aura-orb.orb-right {
      animation: videoHoloRight 4.8s ease-in-out infinite;
      filter: blur(42px);
      opacity: 0.9;
    }

    [data-holo="true"] .aura-orb.orb-center {
      opacity: 0.78;
      animation: videoHoloCenter 4.8s ease-in-out infinite;
      filter: blur(44px);
    }

    [data-dark="true"][data-holo="true"] .aura-orb.orb-left,
    [data-dark="true"][data-holo="true"] .aura-orb.orb-right,
    [data-dark="true"][data-holo="true"] .aura-orb.orb-center {
      opacity: 0.34;
    }

    [data-holo="true"] .refresh-btn {
      background: linear-gradient(120deg, #56C596, #4FA8F6, #74B9FF, #68D391);
      background-size: 240% 240%;
      animation: videoHoloBtn 4.2s ease infinite;
    }

    [data-holo="true"] .action-circle-btn {
      background: linear-gradient(135deg, #B2E2B4 0%, #98DBC5 45%, #9CC8F7 100%);
      background-size: 200% 200%;
      animation: videoHoloBtn 4.2s ease infinite;
    }

    /* 顶部第一行：左侧品牌标识 + 右上角组件 */
    .top-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.6px;
      color: var(--text-secondary);
    }

    .brand-bar {
      width: 4px;
      height: 15px;
      background-color: var(--theme-accent);
      border-radius: 3px;
      margin-right: 8px;
      transition: background-color 0.45s ease;
    }

    /* ================= 3. 右上角语言胶囊 + 日夜圆形按钮（支持单击&长按） ================= */
    .top-right-widgets {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    /* 「🌐 中文」胶囊按钮 */
    .lang-pill-btn {
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease,
                  background-color 0.4s ease;
    }

    [data-dark="true"] .lang-pill-btn,
    [data-dark="true"] .theme-mode-btn {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .lang-pill-btn:hover {
      transform: translateY(-1px);
    }

    .lang-pill-btn:active {
      transform: scale(0.93);
    }

    .globe-svg {
      width: 18px;
      height: 18px;
      stroke: var(--theme-accent);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.45s ease, transform 0.4s ease;
    }

    .lang-pill-btn:hover .globe-svg {
      transform: rotate(15deg);
    }

    .lang-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    /* 右侧「☀️/🌙」独立圆形按钮（单击切换日夜，长按弹出12色主题面板） */
    .theme-mode-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      position: relative;
      z-index: 102;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease,
                  color 0.3s ease,
                  box-shadow 0.3s ease;
    }

    .theme-mode-btn.pressing {
      transform: scale(0.9);
      box-shadow: 0 0 0 4px var(--search-glow);
    }

    .sun-moon-svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .theme-mode-btn.rotating .sun-moon-svg {
      transform: rotate(180deg) scale(0.85);
    }

    /* ================= 3.5 长按弹出的 12 色主题悬浮面板 ================= */
    .theme-panel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 98;
      background: rgba(15, 23, 42, 0.06);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .theme-panel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .theme-popover-panel {
      position: absolute;
      top: 48px;
      right: 0;
      width: 292px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.18),
                  0 4px 16px rgba(15, 23, 42, 0.06);
      z-index: 101;
      opacity: 0;
      transform: translateY(-10px) scale(0.92);
      transform-origin: top right;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-dark="true"] .theme-popover-panel {
      background: rgba(21, 31, 50, 0.94);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 22px 44px -8px rgba(0, 0, 0, 0.55);
    }

    .theme-popover-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .panel-hint {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .theme-swatch-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .theme-swatch-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.75);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    [data-dark="true"] .theme-swatch-item {
      background: rgba(30, 41, 59, 0.75);
    }

    .theme-swatch-item.active,
    .theme-swatch-item.sliding-hover {
      background: var(--card-bg);
      border-color: var(--theme-accent);
      transform: scale(1.04);
      box-shadow: 0 6px 16px -4px var(--search-glow);
    }

    .swatch-orb-preview {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(15, 23, 42, 0.1);
    }

    .swatch-orb-preview.holo-animated {
      background: linear-gradient(135deg, #B2E2B4 0%, #8FDBB8 35%, #92C6F2 72%, #B9CFF8 100%) !important;
      background-size: 220% 220% !important;
      animation: videoHoloBtn 3.2s ease infinite;
    }

    .swatch-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* ================= 4. 主标题与刷新数据行 ================= */
    .shop-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .shop-title {
      font-size: 25px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .shop-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .update-time {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 刷新数据按钮（随12种渐变独立变色） */
    .refresh-btn {
      background-color: var(--refresh-btn-bg);
      color: var(--refresh-btn-text);
      border: none;
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 5px 15px var(--search-glow);
      transition: background-color 0.45s ease,
                  transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.45s ease;
    }

    .refresh-btn:hover {
      filter: brightness(1.04);
      transform: translateY(-1px);
    }

    .refresh-btn:active {
      transform: scale(0.94);
    }

    .refresh-svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .refresh-btn.spinning .refresh-svg {
      transform: rotate(360deg);
    }

    /* ================= 5. 悬浮滑动胶囊 Tab ================= */
    .gemini-tab-section {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .gemini-tabs {
      position: relative;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }

    [data-dark="true"] .gemini-tabs {
      background: rgba(15, 23, 42, 0.45);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .tab-glider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background-color: var(--pill-surface);
      border-radius: 999px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease;
      z-index: 0;
    }

    .gemini-tabs[data-active="shop"] .tab-glider {
      transform: translateX(100%);
    }

    .gemini-tab-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .gemini-tab-btn.active {
      color: var(--theme-tab-text);
      font-weight: 700;
    }

    /* ================= 6. 大圆角悬浮搜索框 + 变色圆形发送按钮 ================= */
    .gemini-search-card {
      background-color: var(--pill-surface);
      border-radius: 26px;
      padding: 10px 10px 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 28px -6px var(--search-glow),
                  0 2px 6px rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.92);
      transition: box-shadow 0.45s ease,
                  transform 0.25s ease,
                  border-color 0.35s ease,
                  background-color 0.4s ease;
    }

    [data-dark="true"] .gemini-search-card {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .gemini-search-card:focus-within {
      transform: translateY(-1px);
      border-color: var(--orb-color-2);
      box-shadow: 0 14px 32px -4px var(--search-glow);
    }

    .plus-action-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .plus-action-btn:hover {
      background-color: var(--theme-tag-bg);
    }

    .plus-action-btn:active {
      transform: scale(0.9);
    }
    /* 深色模式下 + 钮的悬停/点按底色改走白色微透，不再借用浅色主题的标签底色（避免点后发白） */
    [data-dark="true"] .plus-action-btn:hover {
      background-color: rgba(255, 255, 255, 0.10);
    }

    [data-dark="true"] .plus-action-btn:active {
      background-color: rgba(255, 255, 255, 0.16);
    }

    .search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: var(--text-primary);
      background: transparent;
      font-weight: 500;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .clear-input-btn {
      border: none;
      background: rgba(148, 163, 184, 0.18);
      color: var(--text-secondary);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .clear-input-btn.visible {
      display: inline-flex;
    }

    .action-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background-color: var(--send-circle-bg);
      color: var(--send-circle-icon);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.5s ease,
                  transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .action-circle-btn:hover {
      transform: scale(1.05);
    }

    .action-circle-btn:active {
      transform: scale(0.92);
    }

    .arrow-up-svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ================= 7. 下方分类胶囊栏（支持报价单分类 & 店铺目录平台标签） ================= */
    .category-bar {
      display: flex;
      gap: 8px;
      padding: 16px 18px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.28s ease;
    }

    .cat-chip.active {
      background-color: var(--theme-accent);
      color: #FFFFFF;
      border-color: var(--theme-accent);
      box-shadow: 0 4px 12px var(--search-glow);
    }

    /* ================= 8. 顶部分组摘要 8 宫格卡片（还原官网 8 个分组最低价卡片） ================= */
    .content-grid {
      padding: 12px 18px 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .content-grid.switching {
      opacity: 0;
      transform: translateY(8px);
    }

    .product-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 120px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.035);
      border: 1px solid var(--card-border);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease;
    }

    .product-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--refresh-btn-bg);
      opacity: 0;
    }

    @media (hover:hover) and (pointer:fine){
      .product-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px -6px var(--search-glow);
        border-color: var(--orb-color-2);
      }

      .product-card:hover::before {
        opacity: 1;
      }
    }

    .product-card.seen {
      box-shadow: 0 10px 24px -6px var(--search-glow);
      border-color: var(--orb-color-2);
    }

    .product-card.seen::before {
      opacity: 1;
    }

    /* Touch-first devices: no colored selection outline; keep the stripe and shadow. */
    @media (hover:none) and (pointer:coarse){
      .product-card.seen { border-color: var(--card-border); }
    }

    .product-card:active {
      transform: scale(0.97);
    }

    .card-top {
      margin-bottom: 10px;
    }

    .product-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.42;
      margin-bottom: 7px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-tag {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--theme-tag-text);
      background-color: var(--theme-tag-bg);
      padding: 2.5px 8.5px;
      border-radius: 6px;
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    [data-dark="true"] .product-tag {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--orb-color-2);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 2px;
      gap: 6px;
    }

    .product-price {
      font-size: 19px;
      font-weight: 800;
      color: var(--theme-accent);
      letter-spacing: -0.3px;
      transition: color 0.45s ease;
      flex-shrink: 0;
    }

    [data-dark="true"] .product-price {
      color: var(--orb-color-1);
    }

    .product-price .currency {
      font-size: 13px;
      margin-right: 1px;
      font-weight: 700;
    }

    .shop-name {
      font-size: 11.5px;
      color: var(--text-muted);
      max-width: 106px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      text-align: right;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 42px 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* ================= 9. 官网真实标签体系与三栏商品列表布局 ================= */
    .featured-list-hint {
      margin: -4px 18px 18px;
      padding: 11px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      border-radius: 14px;
      color: var(--text-secondary);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .featured-go-link {
      color: var(--theme-accent);
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .site-list-section {
      padding: 4px 18px 38px;
    }

    .site-list-topline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .site-list-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.35px;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .site-list-count {
      margin-left: auto;
      background: var(--theme-tag-bg);
      color: var(--theme-tag-text);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    [data-dark="true"] .site-list-count {
      background: rgba(147, 197, 253, 0.13);
      color: var(--orb-color-2);
    }

    .site-list-subhead {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0 0 14px;
    }

    /* 店铺目录内部平台筛选胶囊条（全部 / 16688 / 云猫寄售 / 自建站 / 链动小铺） */
    .shop-platform-filter {
      display: none;
      gap: 7px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .shop-platform-filter.visible {
      display: flex;
    }

    .platform-filter-chip {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-secondary);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.22s ease;
    }

    .platform-filter-chip.active {
      background: var(--text-primary);
      color: var(--card-bg);
      border-color: var(--text-primary);
    }

    .site-list-groups {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .site-list-group {
      border-radius: 22px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.035);
      overflow: hidden;
      transition: box-shadow 0.36s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.36s ease,
                  background-color 0.4s ease;
    }

    @media (hover:hover) and (pointer:fine){
.site-list-group:hover {
      box-shadow: 0 8px 22px -10px var(--search-glow), 0 4px 14px rgba(15, 23, 42, 0.04);
      border-color: var(--orb-color-2);
    }
}

    .site-list-trigger {
      display: flex;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 15px 15px 14px;
      align-items: center;
      text-align: left;
      cursor: pointer;
      gap: 11px;
      color: inherit;
    }

    .site-list-brand-icon {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      font-size: 17px;
      border-radius: 12px;
      background: var(--theme-tag-bg);
      color: var(--theme-tag-text);
      font-weight: 800;
    }

    [data-dark="true"] .site-list-brand-icon {
      background: rgba(147, 197, 253, 0.12);
    }

    .site-list-main {
      min-width: 0;
      flex: 1;
    }

    .site-list-name {
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .site-list-detail {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .site-list-minimum {
      margin-left: auto;
      text-align: right;
      flex-shrink: 0;
    }

    .site-list-minimum small {
      display: block;
      font-size: 10px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .site-list-minimum strong {
      color: var(--theme-accent);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .site-list-arrow {
      display: inline-flex;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .site-list-group.open .site-list-arrow {
      transform: rotate(180deg);
    }

    .site-list-collapsible {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .site-list-group.open .site-list-collapsible {
      grid-template-rows: 1fr;
    }

    .site-list-inner {
      min-height: 0;
      overflow: hidden;
    }

    .site-list-offers {
      border-top: 1px solid var(--card-border);
      padding: 4px 14px 10px;
    }

    /* === 真实官网三栏商品行结构 ===
       左栏：蓝色粗体价格 ¥X.XX + 下方浅灰平台徽章（链动小铺 / 16688 / 云猫寄售）
       中栏：商品完整标题 + 彩色属性胶囊 Tag（未接码/已接码/激活链接·需绑卡/成品号/代充等） + 灰字店铺名 + 同源铺货胶囊按钮
       右栏：库存状态（库存 XX / 橙红预警 只剩 X 个）+ 直达链接
    */
    .real-offer-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 2px;
    }

    .real-offer-row + .real-offer-row {
      border-top: 1px solid var(--card-border);
    }

    /* 左栏：价格 + 平台来源标签 */
    .offer-col-left {
      width: 68px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      padding-top: 1px;
    }

    .offer-price-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--theme-accent);
      letter-spacing: -0.3px;
      line-height: 1.15;
    }

    [data-dark="true"] .offer-price-val {
      color: var(--orb-color-1);
    }

    .platform-source-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: #64748B;
      background: #F1F5F9;
      border-radius: 5px;
      padding: 2px 6px;
      line-height: 1.3;
      white-space: nowrap;
    }

    [data-dark="true"] .platform-source-badge {
      background: rgba(255, 255, 255, 0.08);
      color: #94A3B8;
    }

    /* 中栏：商品标题 + 彩色规格属性Tag + 店铺名称 + 同源铺货按钮 */
    .offer-col-mid {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .offer-item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.44;
      word-break: break-word;
    }

    .offer-item-title a {
      color: inherit;
      text-decoration: none;
    }

    .offer-item-title a:hover {
      color: var(--theme-accent);
    }

    /* 官网彩色属性胶囊标签体系 */
    .offer-badges-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .attr-pill-tag {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7.5px;
      border-radius: 6px;
      line-height: 1.35;
      white-space: nowrap;
    }

    /* 绿色胶囊：未接码 / 未接马 */
    .attr-pill-tag.tag-green {
      background: #DCFCE7;
      color: #15803D;
    }

    /* 青绿胶囊：激活链接·免绑卡 */
    .attr-pill-tag.tag-teal {
      background: #CCFBF1;
      color: #0F766E;
    }

    /* 橙黄胶囊：已接码 / 已接马 / 激活链接·需绑卡 / 人机号 */
    .attr-pill-tag.tag-amber {
      background: #FEF3C7;
      color: #B45309;
    }

    .attr-pill-tag.tag-orange {
      background: #FFEDD5;
      color: #C2410C;
    }

    /* 蓝色胶囊：成品号 / Pro · 成品号 */
    .attr-pill-tag.tag-blue {
      background: #DBEAFE;
      color: #1D4ED8;
    }

    /* 紫色胶囊：代充 */
    .attr-pill-tag.tag-purple {
      background: #F3E8FF;
      color: #6D28D9;
    }

    /* 灰色胶囊：未注明 / 接码 */
    .attr-pill-tag.tag-gray {
      background: #F1F5F9;
      color: #475569;
    }

    [data-dark="true"] .attr-pill-tag.tag-green { background: rgba(34, 197, 94, 0.18); color: #86EFAC; }
    [data-dark="true"] .attr-pill-tag.tag-teal { background: rgba(20, 184, 166, 0.18); color: #5EEAD4; }
    [data-dark="true"] .attr-pill-tag.tag-amber { background: rgba(245, 158, 11, 0.18); color: #FCD34D; }
    [data-dark="true"] .attr-pill-tag.tag-orange { background: rgba(249, 115, 22, 0.18); color: #FDBA74; }
    [data-dark="true"] .attr-pill-tag.tag-blue { background: rgba(59, 130, 246, 0.2); color: #93C5FD; }
    [data-dark="true"] .attr-pill-tag.tag-purple { background: rgba(168, 85, 247, 0.2); color: #D8B4FE; }
    [data-dark="true"] .attr-pill-tag.tag-gray { background: rgba(148, 163, 184, 0.16); color: #CBD5E1; }

    /* 底部店铺名 + 同源铺货共 X 家 > 胶囊 */
    .offer-shop-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .offer-shop-title {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .same-source-btn {
      border: 1px solid var(--card-border);
      background: var(--page-bg);
      color: var(--text-secondary);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      transition: all 0.2s ease;
    }

    .same-source-btn:hover {
      border-color: var(--theme-accent);
      color: var(--theme-accent);
      background: var(--theme-tag-bg);
    }
    /* 深色模式下同源钮悬停底色同理改走白色微透，避免点后发白 */
    [data-dark="true"] .same-source-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* 右栏：库存状态 + 详情直达 */
    .offer-col-right {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      text-align: right;
      min-width: 62px;
    }

    .stock-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .stock-badge.low-stock {
      color: #DC2626;
      font-weight: 800;
    }

    [data-dark="true"] .stock-badge.low-stock {
      color: #F87171;
    }

    .site-offer-link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 5px 8.5px;
      border-radius: 9px;
      background: var(--theme-tag-bg);
      color: var(--theme-tag-text);
      text-decoration: none;
      font-size: 10.5px;
      font-weight: 800;
      transition: transform 0.22s ease, filter 0.22s ease;
      white-space: nowrap;
    }

    .site-offer-link:active {
      transform: scale(0.94);
    }

    [data-dark="true"] .site-offer-link {
      background: rgba(147, 197, 253, 0.12);
      color: var(--orb-color-2);
    }

    /* 店铺目录真实卡片样式（店名 ↗ + 平台 · 编号） */
    .site-list-shop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.03);
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .site-list-shop:hover {
      transform: translateY(-2px);
      border-color: var(--orb-color-2);
      box-shadow: 0 10px 22px -10px var(--search-glow);
    }

    .shop-dir-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .shop-dir-code {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .site-list-footer {
      padding: 16px 2px 0;
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .site-online-link {
      color: var(--theme-accent);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
    }

    /* ================= 10. 同源铺货弹窗 Modal（还原官网点击「同源铺货共 X 家 >」弹窗） ================= */
    .same-source-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .same-source-modal-backdrop.open {
      display: flex;
    }

    .same-source-modal {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.28);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .modal-close-btn {
      border: none;
      background: var(--page-bg);
      color: var(--text-secondary);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .modal-seller-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-seller-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--page-bg);
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: inherit;
    }

    .modal-seller-item:hover {
      border-color: var(--theme-accent);
    }

    .modal-seller-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--theme-accent);
      min-width: 56px;
    }

    .modal-seller-info {
      flex: 1;
      min-width: 0;
    }

    .modal-seller-shop {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-seller-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    @media (max-width: 370px) {
      .site-list-section { padding-left: 13px; padding-right: 13px; }
      .site-list-trigger { padding: 14px 11px; gap: 8px; }
      .offer-col-left { width: 58px; }
      .offer-price-val { font-size: 14.5px; }
    }

    html { scroll-behavior: smooth; }
  
/* ============ 适配层：本站逻辑沿用原有 DOM 钩子，样式对齐新稿 ============ */
.hide{display:none!important}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}

/* 元信息骨架（页头先行：时间/条数未到位时灰块流光） */
.skl{display:inline-block;border-radius:6px;color:transparent;background:linear-gradient(100deg,rgba(148,163,184,.22) 40%,rgba(148,163,184,.38) 50%,rgba(148,163,184,.22) 60%);background-size:200% 100%;animation:skshim 1.3s linear infinite;vertical-align:-2px}
.skl-time{width:118px;height:12px}
.skl-num{width:26px;height:12px}
.skblock{border-radius:6px;background:linear-gradient(100deg,rgba(148,163,184,.16) 40%,rgba(148,163,184,.30) 50%,rgba(148,163,184,.16) 60%);background-size:200% 100%;animation:skshim 1.3s linear infinite}
@keyframes skshim{to{background-position:-200% 0}}
.skrow{display:flex;gap:12px;padding:13px 2px;border-top:1px solid var(--card-border)}

/* 刷新按钮状态 */
.refresh-btn{border:none;cursor:pointer}
.refresh-btn[disabled]{opacity:.72;cursor:default}
.refresh-btn.loading .refresh-svg{animation:skspin 1s linear infinite}
@keyframes skspin{to{transform:rotate(360deg)}}
.update-time{font-size:12.5px;color:var(--text-secondary)}

/* 列表行内部（沿用原排版：店名左可横滑、库存右对齐永不换行） */
.offer-col-mid .shoprow{display:flex;align-items:center;gap:8px;font-size:11.5px;min-width:0}
.shopname{color:var(--text-secondary);font-weight:500;white-space:nowrap;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.shopname::-webkit-scrollbar{display:none}
.stk{margin-left:auto;color:var(--text-muted);white-space:nowrap;font-weight:600;flex-shrink:0}
.stk .stk-low{color:#D97706;font-weight:700}
.stk .stk-urgent{color:#E11D48;font-weight:700}
[data-dark="true"] .stk .stk-low{color:#FCD34D}
[data-dark="true"] .stk .stk-urgent{color:#FDA4AF}
.attr-pill-tag.tag-sold{background:#FEE2E2;color:#B91C1C}
[data-dark="true"] .attr-pill-tag.tag-sold{background:rgba(239,68,68,.18);color:#FCA5A5}

/* 店铺匹配块 */
.match-head{padding:15px 15px 6px}
.match-head .site-list-name{font-size:14.5px}
.match-note{padding:0 15px 8px;font-size:11.5px;color:var(--text-muted);line-height:1.5}
.more{margin:4px 15px 14px;border:1px solid var(--card-border);background:var(--page-bg);color:var(--theme-accent);font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.sub{color:var(--text-secondary);font-size:12.5px;line-height:1.65;padding:6px 2px}

.site-list-brand-icon svg{width:25px;height:25px;display:block}
.site-list-brand-icon svg.ic-gem{width:31px;height:31px}
.site-list-brand-icon svg.ic-grok{width:27px;height:27px}
.attr-pill-tag.tag-pc{background:var(--theme-tag-bg);background:color-mix(in srgb,var(--theme-accent) 15%,transparent);color:var(--theme-accent);border-color:transparent;outline:none;cursor:pointer;font-family:inherit}
[data-dark="true"] .attr-pill-tag.tag-pc{background:color-mix(in srgb,var(--theme-accent) 28%,transparent)}
.attr-pill-tag.tag-pc:hover,.attr-pill-tag.tag-pc:active,.attr-pill-tag.tag-pc:focus,.attr-pill-tag.tag-pc:focus-visible{border-color:transparent;outline:none}
.attr-pill-tag.tag-pc:active{box-shadow:0 0 0 2px var(--search-glow)}
.pc-chart{margin:12px 0 4px;background:var(--page-bg);border:1px solid var(--card-border);border-radius:14px;padding:10px 8px 4px}
.pc-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--card-border);font-size:12.5px}
.pc-row:first-child{border-top:0}
.pc-when{color:var(--text-muted);white-space:nowrap;font-size:11.5px}
.pc-price{font-weight:800}
.pc-delta{margin-left:auto;font-weight:700;white-space:nowrap}
.pc-delta.up{color:#E11D48}
.pc-delta.dn{color:#059669}
.pc-first{margin-left:auto;color:var(--text-muted);font-size:11px}
.pc-empty{padding:16px 2px;color:var(--text-muted);font-size:12.5px}
/* 同源商铺钮：被点中/聚焦时不要边框，改一圈轻微光晕 */
.same-source-btn{border-color:transparent;outline:none}
.same-source-btn:hover,.same-source-btn:active,.same-source-btn:focus,.same-source-btn:focus-visible{border-color:transparent;outline:none}
.same-source-btn:active{box-shadow:0 0 0 2px var(--search-glow)}
/* 标签行高度统一：档位/价格变动/同源商铺同高（以同源商铺为准） */
.offer-badges-line .attr-pill-tag,.offer-badges-line .same-source-btn{height:20px;box-sizing:border-box;line-height:1;padding-top:0;padding-bottom:0}
/* 店铺目录行：店名太长顶到右侧时，右侧平台·代码整行换到下一行（纯 CSS 换行，店名超长时自身横滑兜底） */
.shop{flex-wrap:wrap}
.shop .nm.nm{flex:0 1 auto;max-width:100%;overflow-x:auto;scrollbar-width:none}
.shop .nm.nm::-webkit-scrollbar{display:none}
.shop .pf.pf{max-width:100%}
.offer-col-mid .offer-badges-line{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.offer-col-mid .offer-badges-line::-webkit-scrollbar{display:none}
.offer-col-mid .offer-badges-line>*{flex:none}
/* 目录行：左右宽度 flex 自适应，店名不换行，右侧太长横向滚动（不显示滚动条） */
.shop .nm{flex:none;word-break:normal}
.shop .nm a{white-space:nowrap}
.shop .pf{flex:0 1 auto;min-width:0;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.shop .pf::-webkit-scrollbar{display:none}
[data-dark="true"] .site-list-brand-icon{color:var(--orb-color-2)}

/* 店铺目录 */
#viewShops{padding-top:12px}
/* 状态行：一行排完不换行，排版定型前透明，定型后才显示 */
.status-row{opacity:0;animation:rowIn .3s ease 1.4s forwards}
.status-row.ready{opacity:1;animation:none}
@keyframes rowIn{to{opacity:1}}
.status-row .update-time{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-row .refresh-btn{flex-shrink:1;white-space:nowrap}
/* 店铺匹配块：行左右间距与标题对齐，长代码串可断行不溢出 */
#shopMatches .real-offer-row{padding-left:15px;padding-right:15px}
#shopMatches .offer-shop-title{flex:0 1 auto;min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#shopMatches .offer-shop-title::-webkit-scrollbar{display:none}
#shopMatches .site-list-group{margin-bottom:14px}
#chips{display:flex;gap:7px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#chips::-webkit-scrollbar{display:none}
#shopMeta{font-size:12px;color:var(--text-secondary);margin:0 0 10px;line-height:1.5}
#shopList{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:4px 16px;box-shadow:0 4px 15px rgba(15,23,42,.035)}
.shop{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--card-border)}
.shop:first-child{border-top:0}
.shop .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--text-primary);word-break:break-word}
.shop .nm a{color:inherit;text-decoration:none}
.shop .nm a:hover{color:var(--theme-accent)}
.shop .pf{font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0}
.shop .only{font-size:10px;font-weight:700;background:#F1F5F9;color:#64748B;border-radius:5px;padding:2px 6px;flex-shrink:0}
[data-dark="true"] .shop .only{background:rgba(255,255,255,.08);color:#94A3B8}
#shopSentinel{height:1px}
.loadspin{text-align:center;color:var(--text-muted);font-size:12px;padding:16px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--card-border);border-top-color:var(--theme-accent);border-radius:50%;animation:skspin .8s linear infinite;vertical-align:-3px;margin-right:7px}

/* 同源弹窗（居中卡片，沿用原开关逻辑钩子） */
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.overlay[hidden]{display:none}
.overlay .shade{position:absolute;inset:0;background:rgba(2,6,17,.55);border:0;opacity:0;transition:opacity .3s ease;cursor:pointer}
.overlay.open .shade{opacity:1}
.sheet{position:relative;background:var(--card-bg);color:var(--text-primary);border:1px solid var(--card-border);border-radius:22px;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;padding:18px;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .32s ease,transform .32s cubic-bezier(.22,1,.36,1);box-shadow:0 24px 60px -12px rgba(0,0,0,.35)}
.overlay.open .sheet{opacity:1;transform:none}
.sheet .grab{display:none}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.s-head strong{font-size:14.5px;line-height:1.45;display:block}
.s-head small{display:block;color:var(--text-muted);font-size:11px;margin-top:3px;line-height:1.5}
.s-head .pill{background:var(--theme-tag-bg);color:var(--theme-tag-text);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0}
[data-dark="true"] .s-head .pill{background:rgba(255,255,255,.08);color:var(--orb-color-2)}
.src-list{margin-top:8px;display:flex;flex-direction:column}
.src-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--card-border);text-decoration:none;color:inherit}
.src-row:first-child{border-top:0}
.src-row .sp{font-weight:800;color:var(--theme-accent);min-width:62px;font-size:14px}
[data-dark="true"] .src-row .sp{color:var(--orb-color-1)}
.src-row .sm2{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.src-row .sn{font-weight:600;font-size:13px}
.src-row .si{color:var(--text-muted);font-size:11px}
.lowtag{background:#DCFCE7;color:#15803D;border-radius:5px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:6px;vertical-align:1px}
[data-dark="true"] .lowtag{background:rgba(34,197,94,.18);color:#86EFAC}
.src-row .go{color:var(--text-muted);font-size:18px}
.src-note{color:var(--text-muted);font-size:11px;margin-top:10px;line-height:1.55}
.btn-close{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:1px solid var(--card-border);background:var(--page-bg);color:var(--text-primary);font-size:13px;font-weight:700;cursor:pointer}

/* Toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--pill-surface);color:var(--text-primary);border:1px solid var(--card-border);box-shadow:var(--pill-shadow);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:300;max-width:calc(100vw - 40px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 页脚 */
.site-list-footer{margin-top:18px;font-size:11px;color:var(--text-muted);line-height:1.6}

/* 桌面宽屏：容器放宽、总览 4 列、分组两列 */
@media (min-width:1024px){
  .app-container{max-width:1180px}
  .content-grid{grid-template-columns:repeat(4,1fr)}
  .site-list-groups{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .hero-header{padding:22px 26px 30px}
  .site-list-section{padding:4px 26px 42px}
  .category-bar,.content-grid{padding-left:26px;padding-right:26px}
  .featured-list-hint{margin-left:26px;margin-right:26px}
}

</style>
</head>

  <header class="hero-header">

          <svg class="sun-moon-svg" id="sunMoonIcon" viewBox="0 0 24 24">

function stockTxt(it){

}
function norm(s){return String(s??'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');}
function subseq(needle,hay){let i=0; for(const ch of hay){if(ch===needle[i]) i++; if(i===needle.length) return true;} return i===needle.length;}
function fuzzy(q){
  const texts=Array.prototype.slice.call(arguments,1).join(' ');
  const hay=norm(texts);
  const nq=norm(q);
  if(!nq) return true;
  if(hay.includes(nq)) return true;
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(tok=>{const nt=norm(tok); return !nt||hay.includes(nt)||(nt.length>=3&&subseq(nt,hay));});
}
/* 链接粗匹配（ken 2026-11-05）：搜索框直接粘贴店铺/商品链接时，从链接里提代码
   （/shop/店铺码、/item/商品码、/goods/G号、/product/数字），目录按店铺代码对、
   看板按商品链接对（含同源来源里的链接），不用把链接拆开手打 */
function linkCodeOf(q){
  q=String(q||'');
  const m=q.match(/shop\/([A-Za-z0-9_-]{3,})/i)||q.match(/goods\/(G\d+)/i)||q.match(/item\/([A-Za-z0-9_-]+)/i)||q.match(/product\/(\d+)/i);
  if(m) return m[1].toLowerCase();
  if(/:\/\//.test(q)||/\.(cn|com|xyz|top|shop|net)\//.test(q)){
    const seg=(q.split(/[?#]/)[0].split('/').filter(Boolean).pop()||'');
    if(/^[A-Za-z0-9_-]{4,}$/.test(seg)) return seg.toLowerCase();
  }
  return '';
}
function itemLinkHit(it,code){
  if(!code) return false;
  if(String(it.url||'').toLowerCase().indexOf(code)>=0) return true;
  const ss=it.sources||[];
  for(let i=0;i<ss.length;i++){ if(String(ss[i].url||'').toLowerCase().indexOf(code)>=0) return true; }
  return false;
}

}

function renderBoard(){
  const q=$('#q').value.trim(); const lk=linkCodeOf(q);
  const searching=!!q;
  const inShops=!$('#viewShops').classList.contains('hide');
  const vis=(searching||inShops)?'none':'';
  $('#leaders').style.display=vis;
  $('#categoryBar').style.display=vis;
  $('#featuredHint').style.display=vis;
  const sm=(q&&shops)?shops.shops.filter(s=>fuzzy(q,s.name,s.platform,s.code)||(lk&&String(s.code||'').toLowerCase().indexOf(lk)>=0)):[];
  $('#shopMatches').innerHTML=!q?'':'<div class="site-list-group open"><div class="match-head"><div class="site-list-name">店铺目录匹配 '+sm.length+' 家</div></div><div class="match-note">报价单只收录每组最低 30 条，不在其中的店只在这里和店铺目录出现</div>'+
    (sm.length?sm.slice(0,20).map(s=>'<div class="real-offer-row"><div class="offer-col-mid"><div class="offer-item-title">'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+' ↗</a>':esc(s.name))+'</div><div class="offer-shop-line"><span class="offer-shop-title">'+esc(s.platform)+(s.code?' · '+esc(s.code):'')+'</span></div></div></div>').join(''):'<p class="sub" style="padding:0 15px 10px">目录 '+(shops&&shops.shops?shops.shops.length:'')+' 家里也没有匹配，去「店铺目录」换个关键词再试</p>')+
    (sm.length>20?'<p class="sub" style="padding:0 15px">只显示前 20 家</p>':'')+'<p><button class="more" id="gotoShops">在店铺目录查看全部 '+sm.length+' 家匹配 →</button></p></div>';
  $('#leaders').innerHTML=board.groups.filter(g=>curCat==='all'||GCAT(g.id)===curCat).map(g=>{
    const it=g.items[0];
    return '<div class="product-card leader'+(seenLeader===g.id?' seen':'')+'" data-gid="'+esc(g.id)+'"><div class="card-top"><div class="product-name">'+esc(g.name)+'</div>'+(it&&it.kind?'<span class="product-tag">'+esc(it.kind)+'</span>':'')+'</div><div class="card-bottom">'+(it?'<span class="product-price"><span class="currency">¥</span>'+fmtN(it.price)+'</span><span class="shop-name s">'+esc(it.shop)+'</span>':'<span class="product-price">—</span>')+'</div></div>';
  }).join('');
  fitLeaderShops();
  $('#groups').innerHTML=board.groups.map((g,gi)=>{
    if(!searching&&curCat!=='all'&&GCAT(g.id)!==curCat) return '';
    let shown=0;
    const rows=g.items.map((it,ii)=>{
        if(q&&!fuzzy(q,it.title,it.shop,it.platform)&&!itemLinkHit(it,lk)) return '';
        shown++;
        const tagrow=(it.stock===0?'<span class="attr-pill-tag tag-sold">已售罄</span>':'')+(it.kind?'<span class="attr-pill-tag '+kindCls(it.kind)+'">'+esc(it.kind)+'</span>':'')+(it.same_source>1?'<button type="button" class="same-source-btn" data-src="'+gi+':'+ii+'" aria-haspopup="dialog">同源商铺 '+it.same_source+' 家 ›</button>':'')+(it.pc?'<button type="button" class="attr-pill-tag tag-pc" data-pc="'+gi+':'+ii+'">价格变动 ›</button>':'');
        return '<div class="real-offer-row" id="it-'+esc(g.id)+'-'+ii+'"><div class="offer-col-left"><span class="offer-price-val">'+fmtP(it.price)+'</span><span class="platform-source-badge">'+esc(it.platform)+'</span></div><div class="offer-col-mid"><div class="offer-item-title"><a data-anchor="it-'+esc(g.id)+'-'+ii+'" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></div>'+(tagrow?'<div class="offer-badges-line">'+tagrow+'</div>':'')+'<div class="shoprow"><span class="shopname">'+esc(it.shop)+'</span><span class="stk">'+stockTxt(it)+'</span></div></div></div>';
      }).join('');
    if(q&&!shown) return '';
    const first=g.items[0]; const open=searching||userOpen.has('grp-'+g.id);
    return '<div class="site-list-group'+(open?' open':'')+'" id="grp-'+esc(g.id)+'"><button class="site-list-trigger" type="button" data-gtoggle aria-expanded="'+open+'"><span class="site-list-brand-icon">'+(GICON[g.id]||'✦')+'</span><span class="site-list-main"><span class="site-list-name">'+esc(g.name)+'</span><span class="site-list-detail" style="display:block">有货最低 '+g.items.length+' 条'+(g.items.length<30?'（不足 30 条，如实显示）':'')+'</span></span>'+(first?'<span class="site-list-minimum"><small>有货最低</small><strong>'+fmtP(first.price)+'</strong></span>':'')+'<span class="site-list-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span></button><div class="site-list-collapsible"><div class="site-list-inner"><div class="site-list-offers">'+rows+'</div></div></div></div>';
  }).join('')||'<p class="sub">'+(q?'没有匹配的报价。报价单只收录每组最低 30 条，找某家店请切到「店铺目录」搜。':'没有匹配的报价。')+'</p>';
  document.querySelectorAll('.leader').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(e.button===0)paintLeader(el.dataset.gid);
    });

function renderPcChart(pts){
  if(pts.length<2) return '';
  const W=320,H=118,PL=8,PR=8,PT=16,PB=18;
  const t0=pts[0].ts, t1=pts[pts.length-1].ts, span=Math.max(1,t1-t0);
  let mn=Math.min.apply(null,pts.map(p=>p.price)), mx=Math.max.apply(null,pts.map(p=>p.price));
  if(mx-mn<1e-9){ mx+=1; mn-=1; }
  const X=t=>PL+(W-PL-PR)*((t-t0)/span), Y=v=>PT+(H-PT-PB)*(1-(v-mn)/(mx-mn));
  const line=pts.map(p=>X(p.ts).toFixed(1)+','+Y(p.price).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>'<circle cx="'+X(p.ts).toFixed(1)+'" cy="'+Y(p.price).toFixed(1)+'" r="'+(i===pts.length-1?3.6:2.4)+'" fill="var(--theme-accent)"/>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="价格走势折线图">'
    +'<text x="'+PL+'" y="10" font-size="9" fill="var(--text-muted)">最高 ¥'+fmtN(mx)+'</text>'
    +'<text x="'+(W-PR)+'" y="'+(H-15)+'" font-size="9" fill="var(--text-muted)" text-anchor="end">最低 ¥'+fmtN(mn)+'</text>'
    +'<text x="'+PL+'" y="'+(H-3)+'" font-size="9" fill="var(--text-muted)">'+fmtPcT(t0)+'</text>'
    +'<text x="'+(W-PR)+'" y="'+(H-3)+'" font-size="9" fill="var(--text-muted)" text-anchor="end">'+fmtPcT(t1)+'</text>'
    +'<polyline points="'+line+'" fill="none" stroke="var(--theme-accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
}

const REFRESH_API='https://ai.jpedu.asia/api/refresh-board';
const STOCK_API='https://ai.jpedu.asia/api/stock-check';
let stockVerifiedFor=null;
async function verifyStocks(){
  if(!board||stockVerifiedFor===board.updated_at) return;
  const ver=board.updated_at; stockVerifiedFor=ver;
  try{
    const all=await Promise.all(board.groups.map(async (g,gi)=>{
      const r=await fetch(STOCK_API+'?group='+encodeURIComponent(g.id)+(gi===0?'&esc=1':'')).then(x=>x.json()).catch(()=>null);
      return (r&&r.ok)?r.results:null;
    }));
    let changed=false;
    board.groups.forEach((g,gi)=>{
      const res=all[gi]; if(!res) return;
      const kept=[];
      g.items.forEach(it=>{
        const v=Object.prototype.hasOwnProperty.call(res,it.url)?res[it.url]:undefined;
        if(typeof v==='number'&&v<=0){ changed=true; return; } // 找不到(-1)/没库存(0)：去除
        if(typeof v==='number'&&it.stock!==v){
          it.stock=v; changed=true;
          (it.sources||[]).forEach(s=>{if(s.url===it.url) s.stock=v;});
        }
        kept.push(it);
      });
      g.items=kept;
    });
    if(changed&&board&&board.updated_at===ver){ if(srcIsOpen||srcLocked||pcIsOpen||pcLockedFlag){ srcPendingRender=true; } else renderBoard(); }
  }catch(e){}
}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
async function reloadData(){const [b,s]=await Promise.all([fetch('data/board.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('data/shops.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())]);board=b;shops=s;fillMeta(b);renderBoard();renderShops();verifyStocks();}
$('#refreshBtn').onclick=async()=>{const btn=$('#refreshBtn');const oldMeta=board?board.updated_at:null;btn.disabled=true;btn.classList.add('loading');try{const r=await fetch(REFRESH_API,{method:'POST'});const j=await r.json().catch(()=>({}));if(j&&j.mode==='cooldown'){await reloadData();showToast(j.source==='auto'?'系统刚自动刷新过，数据更新中':'5 分钟内已刷新过，已加载最新快照');}else if(j&&j.ok){showToast('正在刷新，稍等片刻');let done=false;for(let i=0;i<20;i++){await new Promise(res=>setTimeout(res,8000));try{const nb=await fetch('data/board.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.json());if(nb.updated_at&&nb.updated_at!==oldMeta){await reloadData();showToast('已刷新到最新数据');done=true;break;}}catch(e){}}if(!done)showToast('刷新超时，请稍后再点一次');}else{showToast('刷新服务暂不可用');}}catch(e){showToast('刷新服务暂不可用');}btn.disabled=false;btn.classList.remove('loading');};
function fitStatusRow(){
  const row=document.querySelector('.status-row'),btn=$('#refreshBtn');
  if(!row||!btn) return;
  btn.style.fontSize=''; btn.style.padding='';
  const cs=getComputedStyle(btn); const f0=parseFloat(cs.fontSize)||13; let fs=f0;
  const pt=parseFloat(cs.paddingTop)||8, pl=parseFloat(cs.paddingLeft)||15;
  while(row.scrollWidth>row.clientWidth+0.5&&fs>10){ fs=Math.max(10,fs-0.5); btn.style.fontSize=fs+'px'; btn.style.padding=(pt*fs/f0)+'px '+(pl*fs/f0)+'px'; }
  row.classList.add('ready');
}
let statusRsz;
window.addEventListener('resize',()=>{ clearTimeout(statusRsz); statusRsz=setTimeout(fitStatusRow,150); });
function fillMeta(b){const mt=$('#metaTime'),mc=$('#metaCount');mt.textContent=b.updated_at;mt.className='';mc.textContent=b.groups.reduce((a,g)=>a+g.items.length,0);mc.className='';const lc=$('#listCount');if(lc&&$('#viewShops').classList.contains('hide'))lc.textContent=b.groups.length+' 组 · '+mc.textContent+' 条报价';requestAnimationFrame(fitStatusRow);}
if(window.INLINE_BOARD){
  board=window.INLINE_BOARD;
  fillMeta(board);
  renderBoard();
  verifyStocks();
  setTimeout(jumpToHash,60);
}else{
  $('#refreshBtn').classList.add('loading');
}
fetch('data/board.json',{cache:'no-store'}).then(r=>r.json()).then(b=>{
  $('#refreshBtn').classList.remove('loading');
  if(!board||b.updated_at!==board.updated_at){board=b;fillMeta(board);renderBoard();}
  verifyStocks();
}).catch(e=>{$('#refreshBtn').classList.remove('loading');if(!board){const mt=$('#metaTime'),mc=$('#metaCount');mt.textContent='—';mt.className='';mc.textContent='—';mc.className='';const sr=document.querySelector('.status-row');if(sr)sr.classList.add('ready');$('#leaders').innerHTML='';$('#groups').innerHTML='<p class="sub">数据加载失败，请稍后刷新。</p>';}});
fetch('data/shops.json').then(r=>r.json()).then(s=>{
  shops=s;
  const plats=['全部',...[...new Set(s.shops.map(x=>x.platform))].sort((a,b)=>s.shops.filter(x=>x.platform===b).length-s.shops.filter(x=>x.platform===a).length)];
  $('#chips').innerHTML=plats.map(p=>'<button type="button" class="platform-filter-chip'+(p==='全部'?' active':'')+'" data-p="'+esc(p)+'">'+esc(p)+' ('+(p==='全部'?s.shops.length:s.shops.filter(x=>x.platform===p).length)+')</button>').join('');
  document.querySelectorAll('#chips button').forEach(btn=>btn.onclick=()=>{shopFilter=btn.dataset.p;shopShown=300;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('active',x===btn));renderShops();});
  renderShops();
  if(board)renderBoard();
}).catch(e=>{});
</script>
<script>

/* ===== 12 色弥散主题 + 日夜模式（按新稿：报价单 6 色 / 店铺目录 6 色，页签联动） ===== */
const THEMES12=[
{name:"01 · 冰川晴空",orb1:"#BCE0FD",orb2:"#93C5FD",refreshBg:"#60A5FA",sendCircleBg:"#9CCAF9",accent:"#2563EB",tagBg:"#EBF5FF",tagText:"#1D4ED8",pageBg:"#F4F8FC",glow:"rgba(147, 197, 253, 0.38)"},
{name:"02 · 薄荷微风",orb1:"#A7F3D0",orb2:"#6EE7B7",refreshBg:"#34D399",sendCircleBg:"#86EFAC",accent:"#059669",tagBg:"#ECFDF5",tagText:"#047857",pageBg:"#F2FBF7",glow:"rgba(110, 231, 183, 0.36)"},
{name:"03 · 极光青蓝",orb1:"#A5F3FC",orb2:"#818CF8",refreshBg:"#6366F1",sendCircleBg:"#A5B4FC",accent:"#4F46E5",tagBg:"#EEF2FF",tagText:"#4338CA",pageBg:"#F4F6FC",glow:"rgba(129, 140, 248, 0.34)"},
{name:"04 · 抹茶森屿",orb1:"#D9F99D",orb2:"#86EFAC",refreshBg:"#4ADE80",sendCircleBg:"#BEF264",accent:"#16A34A",tagBg:"#F0FDF4",tagText:"#15803D",pageBg:"#F6FAF5",glow:"rgba(134, 239, 172, 0.36)"},
{name:"05 · 碧海晴空",orb1:"#99F6E4",orb2:"#7DD3FC",refreshBg:"#2DD4BF",sendCircleBg:"#67E8F9",accent:"#0D9488",tagBg:"#F0FDFA",tagText:"#0F766E",pageBg:"#F2F9FA",glow:"rgba(125, 211, 252, 0.36)"},
{name:"06 · 深海星雾",orb1:"#CBD5E1",orb2:"#93C5FD",refreshBg:"#64748B",sendCircleBg:"#CBD5E1",accent:"#334155",tagBg:"#F1F5F9",tagText:"#1E293B",pageBg:"#F5F7FA",glow:"rgba(148, 163, 184, 0.32)"},
{name:"07 · 星云幻紫",orb1:"#E9D5FF",orb2:"#C4B5FD",refreshBg:"#8B5CF6",sendCircleBg:"#A396F8",accent:"#6D28D9",tagBg:"#F3E8FF",tagText:"#6D28D9",pageBg:"#F8F5FD",glow:"rgba(167, 139, 250, 0.38)"},
{name:"08 · 蜜桃乌龙",orb1:"#FBCFE8",orb2:"#FDA4AF",refreshBg:"#F472B6",sendCircleBg:"#F9A8D4",accent:"#DB2777",tagBg:"#FDF2F8",tagText:"#BE185D",pageBg:"#FDF6F9",glow:"rgba(244, 114, 182, 0.34)"},
{name:"09 · 晨曦微光",orb1:"#FDE68A",orb2:"#FDBA74",refreshBg:"#FB923C",sendCircleBg:"#FCD34D",accent:"#EA580C",tagBg:"#FFF7ED",tagText:"#C2410C",pageBg:"#FCF9F4",glow:"rgba(251, 146, 60, 0.34)"},
{name:"10 · 落日粉紫",orb1:"#F5D0FE",orb2:"#FECDD3",refreshBg:"#C084FC",sendCircleBg:"#F0ABFC",accent:"#9333EA",tagBg:"#FAF5FF",tagText:"#7E22CE",pageBg:"#FAF6FC",glow:"rgba(192, 132, 252, 0.35)"},
{name:"11 · 香槟流金",orb1:"#FEF08A",orb2:"#FDE047",refreshBg:"#EAB308",sendCircleBg:"#FDE047",accent:"#CA8A04",tagBg:"#FEFCE8",tagText:"#A16207",pageBg:"#FAF9F2",glow:"rgba(234, 179, 8, 0.32)"},
{name:"12 · 幻彩全息",isHolo:true,orb1:"#8FDBB8",orb2:"#9CC8F7",refreshBg:"#4FA8F6",sendCircleBg:"#9EE0C5",accent:"#1A73E8",tagBg:"#E6F4EA",tagText:"#137333",pageBg:"#F3F8FA",glow:"rgba(143, 219, 184, 0.44)"}];
const SUN_PATHS='<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4.5"></line><line x1="12" y1="19.5" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.7" y2="6.7"></line><line x1="17.3" y1="17.3" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4.5" y2="12"></line><line x1="19.5" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.7" y2="17.3"></line><line x1="17.3" y1="6.7" x2="19.07" y2="4.93"></line>';
const MOON_PATHS='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
let themeState={t:0,d:false};
try{const saved=JSON.parse(localStorage.getItem('aishop.theme.v1')||'null');if(saved){if(Number.isInteger(saved.t)&&saved.t>=0&&saved.t<12)themeState.t=saved.t;else if(Number.isInteger(saved.q)&&saved.q>=0&&saved.q<6)themeState.t=saved.q;if(typeof saved.d==='boolean')themeState.d=saved.d;}}catch(e){}
let curThemeGlobal=0;
function readSharedA(){try{var m=document.cookie.match(/(?:^|;\s*)A=(\d{3,4})(?:;|$)/);if(!m)return null;var v=m[1],t=parseInt(v.slice(2),10);if(v.charAt(1)!=='0'&&v.charAt(1)!=='1')return null;if(!(t>=1&&t<=12))return null;return{l:v.charAt(0),m:v.charAt(1),t:t};}catch(e){return null;}}
function writeSharedA(){try{var a=readSharedA(),l=a?a.l:'0',h=location.hostname,s='A='+l+(themeState.d?'0':'1')+(curThemeGlobal+1)+';path=/;max-age=31536000;SameSite=Lax';if(h==='jpedu.asia'||h.slice(-11)==='.jpedu.asia')s+=';domain=jpedu.asia';if(location.protocol==='https:')s+=';Secure';document.cookie=s;}catch(e){}}
(function(){var a=readSharedA();if(a){themeState.d=a.m==='0';themeState.t=a.t-1;}curThemeGlobal=themeState.t;if(!a){try{if(localStorage.getItem('aishop.theme.v1'))writeSharedA();}catch(e){}}})();
function saveThemeState(){try{localStorage.setItem('aishop.theme.v1',JSON.stringify(themeState));}catch(e){}}
function applyTheme(idx){
  const t=THEMES12[idx]; if(!t) return;
  curThemeGlobal=idx;
  themeState.t=idx;
  const root=document.documentElement;
  root.style.setProperty('--orb-color-1',t.orb1);
  root.style.setProperty('--orb-color-2',t.orb2);
  root.style.setProperty('--refresh-btn-bg',t.refreshBg);
  root.style.setProperty('--send-circle-bg',t.sendCircleBg);
  root.style.setProperty('--theme-accent',t.accent);
  root.style.setProperty('--theme-tag-bg',t.tagBg);
  root.style.setProperty('--theme-tag-text',t.tagText);
  root.style.setProperty('--search-glow',t.glow);
  if(t.isHolo)root.setAttribute('data-holo','true'); else root.removeAttribute('data-holo');
  if(themeState.d)root.style.removeProperty('--page-bg'); else root.style.setProperty('--page-bg',t.pageBg);
  const mtc=document.querySelector('meta[name="theme-color"]');if(mtc)mtc.setAttribute('content',themeState.d?'#090D16':t.pageBg);
  const ol=document.getElementById('orbLeft'),or=document.getElementById('orbRight');
  if(ol&&or){
    if(!t.isHolo){const shift=idx%2===0?1:-1;ol.style.transform='translate('+(shift*14)+'px,'+(-shift*8)+'px) scale('+(1+shift*0.05)+')';or.style.transform='translate('+(-shift*14)+'px,'+(shift*8)+'px) scale('+(1-shift*0.05)+')';}
    else{ol.style.transform='';or.style.transform='';}
  }
  document.querySelectorAll('.theme-swatch-item').forEach(el=>{el.classList.toggle('active',Number(el.getAttribute('data-theme-idx'))===idx);});
  saveThemeState();
}
function setDark(on){
  themeState.d=on;
  const root=document.documentElement;
  if(on)root.setAttribute('data-dark','true'); else root.removeAttribute('data-dark');
  const ic=document.getElementById('sunMoonIcon');
  if(ic)ic.innerHTML=on?MOON_PATHS:SUN_PATHS;
  applyTheme(curThemeGlobal);
}
function renderSwatches(){
  const grid=document.getElementById('themeSwatchGrid');
  if(!grid) return;
  grid.innerHTML=THEMES12.map((t,idx)=>'<div class="theme-swatch-item'+(idx===curThemeGlobal?' active':'')+'" data-theme-idx="'+idx+'"><span class="swatch-orb-preview'+(t.isHolo?' holo-animated':'')+'" style="background: linear-gradient(135deg, '+t.orb1+' 0%, '+t.orb2+' 65%, '+t.refreshBg+' 100%);"></span><span class="swatch-label">'+t.name+'</span></div>').join('');
  grid.querySelectorAll('.theme-swatch-item').forEach(el=>{
    el.addEventListener('click',()=>{applyTheme(Number(el.getAttribute('data-theme-idx')));writeSharedA();closeThemePanel();});
  });
}
function openThemePanel(){
  document.getElementById('themePopover').classList.add('open');
  document.getElementById('themeBackdrop').classList.add('open');
  if(navigator.vibrate)try{navigator.vibrate(18);}catch(e){}
}
function closeThemePanel(){
  document.getElementById('themePopover').classList.remove('open');
  document.getElementById('themeBackdrop').classList.remove('open');
  document.querySelectorAll('.theme-swatch-item').forEach(el=>el.classList.remove('sliding-hover'));
}
window.__applyTabTheme=function(){}; /* 全站单槽：切页签不换主题 */
(function initTheme(){
  renderSwatches();
  setDark(themeState.d);
  document.getElementById('themeBackdrop').addEventListener('click',closeThemePanel);
  const btn=document.getElementById('darkModeBtn');
  let pressTimer=null,isLong=false,isDown=false,lastIdx=null;
  btn.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0) return;
    isDown=true;isLong=false;lastIdx=null;
    btn.classList.add('pressing');
    try{btn.setPointerCapture(e.pointerId);}catch(_){}
    pressTimer=setTimeout(()=>{if(!isDown)return;isLong=true;openThemePanel();},340);
  });
  btn.addEventListener('pointermove',e=>{
    if(!isDown||!isLong) return;
    const targetEl=document.elementFromPoint(e.clientX,e.clientY);
    const sw=targetEl?targetEl.closest('.theme-swatch-item'):null;
    document.querySelectorAll('.theme-swatch-item').forEach(el=>el.classList.toggle('sliding-hover',el===sw));
    if(sw){
      const idx=Number(sw.getAttribute('data-theme-idx'));
      if(idx!==lastIdx){lastIdx=idx;applyTheme(idx);if(navigator.vibrate)try{navigator.vibrate(8);}catch(_){}}
    }
  });
  const finish=()=>{
    if(!isDown) return;
    isDown=false;clearTimeout(pressTimer);btn.classList.remove('pressing');
    if(!isLong){
      const pop=document.getElementById('themePopover');
      if(pop.classList.contains('open'))closeThemePanel();
      else{btn.classList.add('rotating');setTimeout(()=>btn.classList.remove('rotating'),520);setDark(!themeState.d);writeSharedA();}
    }else if(lastIdx!==null){writeSharedA();closeThemePanel();}
  };
  btn.addEventListener('pointerup',finish);
  btn.addEventListener('pointercancel',finish);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
})();

</script>
