<style>
    /* ================= 1. 核心动态 CSS 变量体系 ================= */
    :root {
      /* 顶部弥散渐变与双光斑色值（默认01：冰川晴空） */
      --hero-bg-base: #FFFFFF;
      --orb-color-1: #BCE0FD;
      --orb-color-2: #93C5FD;
      
      /* 按钮与组件专属联动色 */
      --refresh-btn-bg: #74B9FF;       /* 刷新数据按钮底色 */
      --refresh-btn-text: #FFFFFF;     /* 刷新按钮文字色 */
      --send-circle-bg: #9CCAF9;       /* 搜索框右侧圆形按钮色 */
      --send-circle-icon: #0F172A;     /* 搜索框右侧圆形按钮箭头色 */
      
      /* 主题强调色与标签配比（联动下方列表与右上角地球图标） */
      --theme-accent: #2563EB;         /* 价格、地球图标、品牌竖条、激活色 */
      --theme-tab-text: #0F172A;       /* Tab 选中文字色 */
      --theme-tag-bg: #EBF5FF;         /* 商品卡片标签底色 */
      --theme-tag-text: #1D4ED8;       /* 商品卡片标签文字色 */
      --search-glow: rgba(147, 197, 253, 0.38); /* 搜索框弥散光晕阴影 */

      /* 下方页面背景与卡片表面色（随主题微染 + 支持深色模式） */
      --page-bg: #F4F8FC;
      --card-bg: #FFFFFF;
      --card-border: rgba(226, 232, 240, 0.75);
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --pill-surface: #FFFFFF;
      --pill-shadow: 0 6px 20px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    /* 深色模式覆盖变量（单击右上角太阳按钮切换） */
    [data-dark="true"] {
      --hero-bg-base: #0B1120;
      --page-bg: #090D16;
      --card-bg: #151F32;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --pill-surface: #1E293B;
      --pill-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --theme-tab-text: #F8FAFC;
    }

    [data-dark="true"] body {
      background-image: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-variant-numeric: tabular-nums;
      background-color: var(--page-bg);
      background-image:
        radial-gradient(120% 700px at 26% 0%, color-mix(in srgb, var(--orb-color-1) 8%, transparent) 0%, transparent 100%),
        radial-gradient(120% 700px at 74% 0%, color-mix(in srgb, var(--orb-color-2) 8%, transparent) 0%, transparent 100%);
      background-repeat: no-repeat;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.55s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
    }

    /* 居中移动端/平板自适应容器 */
    .app-container {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 48px;
    }

    /* ================= 2. 顶部弥散渐变区域 ================= */
    .hero-header {
      position: relative;
      background-color: var(--hero-bg-base);
      background-image:
        radial-gradient(115% 185px at 26% calc(100% - 120px), color-mix(in srgb, var(--orb-color-1) 42%, transparent) 0%, transparent 88%),
        radial-gradient(115% 185px at 74% calc(100% - 120px), color-mix(in srgb, var(--orb-color-2) 42%, transparent) 0%, transparent 88%);
      padding: 16px 18px 26px;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      box-shadow: 0 10px 24px -12px rgba(15, 23, 42, 0.12);
      transition: background-color 0.55s ease, box-shadow 0.6s ease;
      z-index: 10;
    }

    [data-dark="true"] .hero-header {
      background-image: none;
    }



    /* 第12号全息主题：按钮流光渐变（保留静态渐变与流光，去光斑后仍为该主题签名） */
    @keyframes videoHoloBtn {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    [data-holo="true"] .refresh-btn {
      background: linear-gradient(120deg, #56C596, #4FA8F6, #74B9FF, #68D391);
      background-size: 240% 240%;
      animation: videoHoloBtn 4.2s ease infinite;
    }

    [data-holo="true"] .action-circle-btn {
      background: linear-gradient(135deg, #B2E2B4 0%, #98DBC5 45%, #9CC8F7 100%);
      background-size: 200% 200%;
      animation: videoHoloBtn 4.2s ease infinite;
    }

    /* 顶部第一行：左侧品牌标识 + 右上角组件 */
    .top-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.6px;
      color: var(--text-secondary);
    }

    .brand-bar {
      width: 4px;
      height: 15px;
      background-color: var(--theme-accent);
      border-radius: 3px;
      margin-right: 8px;
      transition: background-color 0.45s ease;
    }

    /* ================= 3. 右上角语言胶囊 + 日夜圆形按钮（支持单击&长按） ================= */
    .top-right-widgets {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    /* 「🌐 中文」胶囊按钮 */
    .lang-pill-btn {
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease,
                  background-color 0.4s ease;
    }

    [data-dark="true"] .lang-pill-btn,
    [data-dark="true"] .theme-mode-btn {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .lang-pill-btn:hover {
      transform: translateY(-1px);
    }

    .lang-pill-btn:active {
      transform: scale(0.93);
    }

    .globe-svg {
      width: 18px;
      height: 18px;
      stroke: var(--theme-accent);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.45s ease, transform 0.4s ease;
    }

    .lang-pill-btn:hover .globe-svg {
      transform: rotate(15deg);
    }

    .lang-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    /* 右侧「☀️/🌙」独立圆形按钮（单击切换日夜，长按弹出12色主题面板） */
    .theme-mode-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--pill-surface);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--pill-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      position: relative;
      z-index: 102;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease,
                  color 0.3s ease,
                  box-shadow 0.3s ease;
    }

    .theme-mode-btn.pressing {
      transform: scale(0.9);
      box-shadow: 0 0 0 4px var(--search-glow);
    }

    .sun-moon-svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .theme-mode-btn.rotating .sun-moon-svg {
      transform: rotate(180deg) scale(0.85);
    }

    /* ================= 3.5 长按弹出的 12 色主题悬浮面板 ================= */
    .theme-panel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 98;
      background: rgba(15, 23, 42, 0.06);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .theme-panel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .theme-popover-panel {
      position: absolute;
      top: 48px;
      right: 0;
      width: 292px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.18),
                  0 4px 16px rgba(15, 23, 42, 0.06);
      z-index: 101;
      opacity: 0;
      transform: translateY(-10px) scale(0.92);
      transform-origin: top right;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-dark="true"] .theme-popover-panel {
      background: rgba(21, 31, 50, 0.94);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 22px 44px -8px rgba(0, 0, 0, 0.55);
    }

    .theme-popover-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .panel-hint {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .theme-swatch-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .theme-swatch-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.75);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    [data-dark="true"] .theme-swatch-item {
      background: rgba(30, 41, 59, 0.75);
    }

    [data-dark="true"] .theme-swatch-item.active,
    [data-dark="true"] .theme-swatch-item.sliding-hover {
      background: rgba(30, 41, 59, 0.75);
    }

    .theme-swatch-item.active,
    .theme-swatch-item.sliding-hover {
      background: var(--theme-tag-bg);
      border-color: var(--theme-accent);
      transform: scale(1.04);
      box-shadow: 0 6px 16px -4px var(--search-glow);
    }

    .swatch-orb-preview {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(15, 23, 42, 0.1);
    }

    .swatch-orb-preview.holo-animated {
      background: linear-gradient(135deg, #B2E2B4 0%, #8FDBB8 35%, #92C6F2 72%, #B9CFF8 100%) !important;
      background-size: 220% 220% !important;
      animation: videoHoloBtn 3.2s ease infinite;
    }

    .swatch-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* ================= 4. 主标题与刷新数据行 ================= */
    button{font-variant-numeric:inherit}
    .shop-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .shop-title {
      font-size: 25px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .shop-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .update-time {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 刷新数据按钮（随12种渐变独立变色） */
    .refresh-btn {
      background-color: var(--refresh-btn-bg);
      color: var(--refresh-btn-text);
      border: none;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
      transition: background-color 0.45s ease,
                  transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.45s ease;
    }

    .refresh-btn:hover {
      filter: brightness(1.04);
      transform: translateY(-1px);
    }

    .refresh-btn:active {
      transform: scale(0.94);
    }

    .refresh-svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .refresh-btn.spinning .refresh-svg {
      transform: rotate(360deg);
    }

    /* ================= 5. 悬浮滑动胶囊 Tab ================= */
    .gemini-tab-section {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .gemini-tabs {
      position: relative;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }

    [data-dark="true"] .gemini-tabs {
      background: rgba(15, 23, 42, 0.45);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .tab-glider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background-color: var(--pill-surface);
      border-radius: 999px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease;
      z-index: 0;
    }

    .gemini-tabs[data-active="shop"] .tab-glider {
      transform: translateX(100%);
    }

    .gemini-tab-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .gemini-tab-btn.active {
      color: var(--theme-tab-text);
      font-weight: 700;
    }

    /* ================= 6. 大圆角悬浮搜索框 + 变色圆形发送按钮 ================= */
    .gemini-search-card {
      background-color: var(--pill-surface);
      border-radius: 26px;
      padding: 10px 10px 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 28px -10px rgba(15, 23, 42, 0.10),
                  0 2px 6px rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.92);
      transition: box-shadow 0.45s ease,
                  transform 0.25s ease,
                  border-color 0.35s ease,
                  background-color 0.4s ease;
    }

    [data-dark="true"] .gemini-search-card {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .gemini-search-card:focus-within {
      transform: translateY(-1px);
      border-color: var(--orb-color-2);
      box-shadow: 0 14px 32px -4px var(--search-glow);
    }

    .plus-action-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .plus-action-btn:hover {
      background-color: var(--theme-tag-bg);
    }

    .plus-action-btn:active {
      transform: scale(0.9);
    }
    /* 深色模式下 + 钮的悬停/点按底色改走白色微透，不再借用浅色主题的标签底色（避免点后发白） */

    /* === 真实官网三栏商品行结构 ===
       左栏：蓝色粗体价格 ¥X.XX + 下方浅灰平台徽章（链动小铺 / 16688 / 云猫寄售）
       中栏：商品完整标题 + 彩色属性胶囊 Tag（未接码/已接码/激活链接·需绑卡/成品号/代充等） + 灰字店铺名 + 同源铺货胶囊按钮
       右栏：库存状态（库存 XX / 橙红预警 只剩 X 个）+ 直达链接
    */
    .real-offer-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 2px;
    }

    .real-offer-row + .real-offer-row {
      border-top: 1px solid var(--card-border);
    }

    /* 右滑操作：克制的小按钮、明确的点击热区，不再铺满整行 */
    .swipe { position: relative; overflow: hidden; isolation: isolate; }
    .swipe + .swipe { border-top: 1px solid var(--card-border); }
    .swipe .real-offer-row {
      position: relative; z-index: 1; background: var(--card-bg);
      touch-action: pan-y; -webkit-tap-highlight-color: transparent;
    }
    .swipe.is-dragging .real-offer-row { will-change: transform; user-select: none; -webkit-user-select: none; }
    .swipe[data-open="1"] .real-offer-row { will-change: transform; }
    .swipe-actions {
      position: absolute; inset: 0 auto 0 0; width: 144px;
      box-sizing: border-box; padding: 7px; gap: 6px;
      display: flex; align-items: center; z-index: 0;
      pointer-events: none;
    }
    .swipe[data-open="1"] .swipe-actions,
    .swipe.is-dragging .swipe-actions { pointer-events: auto; }
    .swipe-actions button {
      flex: 1; min-width: 0; min-height: 64px; max-height: 84px;
      height: calc(100% - 6px); box-sizing: border-box; padding: 7px 2px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      border: 1px solid transparent; border-radius: 13px;
      font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer;
      box-shadow: 0 2px 7px rgba(15, 23, 42, .055);
      -webkit-tap-highlight-color: transparent;
      transition: filter .12s ease, background-color .15s ease;
    }
    .swipe-actions button svg {
      width: 19px; height: 19px; flex-shrink: 0; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .swipe-actions button:active { filter: brightness(.93); }
    .swipe-actions button:focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 1px; }
    .swipe-actions .sw-fav { background: #fff5e5; color: #9a651b; border-color: #f5dfbc; }
    .swipe-actions .sw-del { background: #fff0ef; color: #ba4549; border-color: #f3d5d3; }
    [data-dark="true"] .swipe-actions .sw-fav { background: #423120; color: #ffd08c; border-color: #634c2f; }
    [data-dark="true"] .swipe-actions .sw-del { background: #452b30; color: #ffacb1; border-color: #694149; }

    /* 店铺目录真实卡片样式（店名 ↗ + 平台 · 编号） */
    .site-list-shop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.03);
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .site-list-shop:hover {
      transform: translateY(-2px);
      border-color: var(--orb-color-2);
      box-shadow: 0 10px 22px -10px rgba(15, 23, 42, 0.12);
    }

    .shop-dir-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .shop-dir-code {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .site-list-footer {
      padding: 16px 2px 0;
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .site-online-link {
      color: var(--theme-accent);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
    }

    /* ================= 10. 同源铺货弹窗 Modal（还原官网点击「同源铺货共 X 家 >」弹窗） ================= */
    .same-source-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .same-source-modal-backdrop.open {
      display: flex;
    }

    .same-source-modal {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.28);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .modal-close-btn {
      border: none;
      background: var(--page-bg);
      color: var(--text-secondary);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .modal-seller-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-seller-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--page-bg);
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: inherit;
    }

    .modal-seller-item:hover {
      border-color: var(--theme-accent);
    }

    .modal-seller-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--theme-accent);
      min-width: 56px;
    }

    .modal-seller-info {
      flex: 1;
      min-width: 0;
    }

    .modal-seller-shop {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-seller-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    @media (max-width: 370px) {
      .site-list-section { padding-left: 13px; padding-right: 13px; }
      .site-list-trigger { padding: 14px 11px; gap: 8px; }
      .offer-col-left { width: 58px; }
      .offer-price-val { font-size: 14.5px; }
    }

    html { scroll-behavior: smooth; }
  
/* ============ 适配层：本站逻辑沿用原有 DOM 钩子，样式对齐新稿 ============ */
.hide{display:none!important}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}

/* 元信息骨架（页头先行：时间/条数未到位时灰块流光） */
.skl{display:inline-block;border-radius:6px;color:transparent;background:linear-gradient(100deg,rgba(148,163,184,.22) 40%,rgba(148,163,184,.38) 50%,rgba(148,163,184,.22) 60%);background-size:200% 100%;animation:skshim 1.3s linear infinite;vertical-align:-2px}
.skl-time{width:118px;height:12px}
.skl-num{width:26px;height:12px}
.skblock{border-radius:6px;background:linear-gradient(100deg,rgba(148,163,184,.16) 40%,rgba(148,163,184,.30) 50%,rgba(148,163,184,.16) 60%);background-size:200% 100%;animation:skshim 1.3s linear infinite}
@keyframes skshim{to{background-position:-200% 0}}
.skrow{display:flex;gap:12px;padding:13px 2px;border-top:1px solid var(--card-border)}

/* 刷新按钮状态 */
.refresh-btn{border:none;cursor:pointer}
.refresh-btn[disabled]{opacity:.72;cursor:default}
.refresh-btn.loading .refresh-svg{animation:skspin 1s linear infinite}
@keyframes skspin{to{transform:rotate(360deg)}}
.update-time{font-size:12.5px;color:var(--text-secondary)}

/* 列表行内部（沿用原排版：店名左可横滑、库存右对齐永不换行） */
.offer-col-mid .shoprow{display:flex;align-items:center;gap:8px;font-size:11.5px;min-width:0}
.shopname{color:var(--text-secondary);font-weight:500;white-space:nowrap;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.shopname::-webkit-scrollbar{display:none}
.stk{margin-left:auto;color:var(--text-muted);white-space:nowrap;font-weight:600;flex-shrink:0}
.stk .stk-low{color:#D97706;font-weight:700}
.stk .stk-urgent{color:#E11D48;font-weight:700}
[data-dark="true"] .stk .stk-low{color:#FCD34D}
[data-dark="true"] .stk .stk-urgent{color:#FDA4AF}
.attr-pill-tag.tag-sold{background:#FEE2E2;color:#B91C1C}
[data-dark="true"] .attr-pill-tag.tag-sold{background:rgba(239,68,68,.18);color:#FCA5A5}

/* 店铺匹配块 */
.match-head{padding:15px 15px 6px}
.match-head .site-list-name{font-size:14.5px}
.match-note{padding:0 15px 8px;font-size:11.5px;color:var(--text-muted);line-height:1.5}
.more{margin:4px 15px 14px;border:1px solid var(--card-border);background:var(--page-bg);color:var(--theme-accent);font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.sub{color:var(--text-secondary);font-size:12.5px;line-height:1.65;padding:6px 2px}

.site-list-brand-icon svg{width:25px;height:25px;display:block}
.site-list-brand-icon svg.ic-gem{width:31px;height:31px}
.site-list-brand-icon svg.ic-grok{width:27px;height:27px}
.attr-pill-tag.tag-pc{background:var(--theme-tag-bg);background:color-mix(in srgb,var(--theme-accent) 15%,transparent);color:var(--theme-accent);border-color:transparent;outline:none;cursor:pointer;font-family:inherit}
[data-dark="true"] .attr-pill-tag.tag-pc{background:color-mix(in srgb,var(--theme-accent) 28%,transparent)}
.attr-pill-tag.tag-pc:hover,.attr-pill-tag.tag-pc:active,.attr-pill-tag.tag-pc:focus,.attr-pill-tag.tag-pc:focus-visible{border-color:transparent;outline:none}
.attr-pill-tag.tag-pc:active{box-shadow:0 0 0 2px var(--search-glow)}
.pc-chart{margin:12px 0 4px;background:var(--page-bg);border:1px solid var(--card-border);border-radius:14px;padding:10px 8px 4px}
.pc-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--card-border);font-size:12.5px}
.pc-row:first-child{border-top:0}
.pc-when{color:var(--text-muted);white-space:nowrap;font-size:11.5px}
.pc-price{font-weight:800}
.pc-delta{margin-left:auto;font-weight:700;white-space:nowrap}
.pc-delta.up{color:#E11D48}
.pc-delta.dn{color:#059669}
.pc-first{margin-left:auto;color:var(--text-muted);font-size:11px}
.pc-empty{padding:16px 2px;color:var(--text-muted);font-size:12.5px}
/* 同源商铺钮：被点中/聚焦时不要边框，改一圈轻微光晕 */
.same-source-btn{border-color:transparent;outline:none}
.same-source-btn:hover,.same-source-btn:active,.same-source-btn:focus,.same-source-btn:focus-visible{border-color:transparent;outline:none}
.same-source-btn:active{box-shadow:0 0 0 2px var(--search-glow)}
/* 标签行高度统一：档位/价格变动/同源商铺同高（以同源商铺为准） */
.offer-badges-line .attr-pill-tag,.offer-badges-line .same-source-btn{height:20px;box-sizing:border-box;line-height:1;padding-top:0;padding-bottom:0}
/* 店铺目录行：店名太长顶到右侧时，右侧平台·代码整行换到下一行（纯 CSS 换行，店名超长时自身横滑兜底） */
.shop{flex-wrap:wrap}
.shop .nm.nm{flex:0 1 auto;max-width:100%;overflow-x:auto;scrollbar-width:none}
.shop .nm.nm::-webkit-scrollbar{display:none}
.shop .pf.pf{max-width:100%}
.offer-col-mid .offer-badges-line{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;touch-action:pan-y}
.offer-col-mid .offer-badges-line::-webkit-scrollbar{display:none}
.offer-col-mid .offer-badges-line>*{flex:none}
/* 目录行：左右宽度 flex 自适应，店名不换行，右侧太长横向滚动（不显示滚动条） */
.shop .nm{flex:none;word-break:normal}
.shop .nm a{white-space:nowrap}
.shop .pf{flex:0 1 auto;min-width:0;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.shop .pf::-webkit-scrollbar{display:none}
[data-dark="true"] .site-list-brand-icon{color:var(--orb-color-2)}

/* 店铺目录 */
#viewShops{padding-top:12px}
/* 状态行：一行排完不换行，排版定型前透明，定型后才显示 */
.status-row{opacity:0;animation:rowIn .3s ease 1.4s forwards}
.status-row.ready{opacity:1;animation:none}
@keyframes rowIn{to{opacity:1}}
.status-row .update-time{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-row .refresh-btn{flex-shrink:1;white-space:nowrap}
/* 店铺匹配块：行左右间距与标题对齐，长代码串可断行不溢出 */
#shopMatches .real-offer-row{padding-left:15px;padding-right:15px}
#shopMatches .offer-shop-title{flex:0 1 auto;min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#shopMatches .offer-shop-title::-webkit-scrollbar{display:none}
#shopMatches .site-list-group{margin-bottom:14px}
#chips{display:flex;gap:7px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#chips::-webkit-scrollbar{display:none}
#shopMeta{font-size:12px;color:var(--text-secondary);margin:0 0 10px;line-height:1.5}
#shopList{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:4px 16px;box-shadow:0 4px 15px rgba(15,23,42,.035)}
.shop{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--card-border)}
.shop:first-child{border-top:0}
.shop .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--text-primary);word-break:break-word}
.shop .nm a{color:inherit;text-decoration:none}
.shop .nm a:hover{color:var(--theme-accent)}
.shop .pf{font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0}
.shop .only{font-size:10px;font-weight:700;background:#F1F5F9;color:#64748B;border-radius:5px;padding:2px 6px;flex-shrink:0}
[data-dark="true"] .shop .only{background:rgba(255,255,255,.08);color:#94A3B8}
#shopSentinel{height:1px}
.loadspin{text-align:center;color:var(--text-muted);font-size:12px;padding:16px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--card-border);border-top-color:var(--theme-accent);border-radius:50%;animation:skspin .8s linear infinite;vertical-align:-3px;margin-right:7px}

/* 同源弹窗（居中卡片，沿用原开关逻辑钩子） */
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.overlay[hidden]{display:none}
.overlay .shade{position:absolute;inset:0;background:rgba(2,6,17,.55);border:0;opacity:0;transition:opacity .3s ease;cursor:pointer}
.overlay.open .shade{opacity:1}
.sheet{position:relative;background:var(--card-bg);color:var(--text-primary);border:1px solid var(--card-border);border-radius:22px;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;padding:18px;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .32s ease,transform .32s cubic-bezier(.22,1,.36,1);box-shadow:0 24px 60px -12px rgba(0,0,0,.35)}
.overlay.open .sheet{opacity:1;transform:none}
.sheet .grab{display:none}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.s-head strong{font-size:14.5px;line-height:1.45;display:block}
.s-head small{display:block;color:var(--text-muted);font-size:11px;margin-top:3px;line-height:1.5}
.s-head .pill{background:var(--theme-tag-bg);color:var(--theme-tag-text);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0}
[data-dark="true"] .s-head .pill{background:rgba(255,255,255,.08);color:var(--orb-color-2)}
.src-list{margin-top:8px;display:flex;flex-direction:column}
.src-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--card-border);text-decoration:none;color:inherit}
.src-row:first-child{border-top:0}
.src-row .sp{font-weight:800;color:var(--theme-accent);min-width:62px;font-size:14px}
[data-dark="true"] .src-row .sp{color:var(--orb-color-1)}
.src-row .sm2{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.src-row .sn{font-weight:600;font-size:13px}
.src-row .si{color:var(--text-muted);font-size:11px}
.lowtag{background:#DCFCE7;color:#15803D;border-radius:5px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:6px;vertical-align:1px}
[data-dark="true"] .lowtag{background:rgba(34,197,94,.18);color:#86EFAC}
.src-row .go{color:var(--text-muted);font-size:18px}
.src-note{color:var(--text-muted);font-size:11px;margin-top:10px;line-height:1.55}
.btn-close{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:1px solid var(--card-border);background:var(--page-bg);color:var(--text-primary);font-size:13px;font-weight:700;cursor:pointer}

/* Toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--pill-surface);color:var(--text-primary);border:1px solid var(--card-border);box-shadow:var(--pill-shadow);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:300;max-width:calc(100vw - 40px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 页脚 */
.site-list-footer{margin-top:18px;font-size:11px;color:var(--text-muted);line-height:1.6}

/* 桌面宽屏：容器放宽、总览 4 列、分组两列 */
@media (min-width:700px){.content-grid{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:1024px){
  .app-container{max-width:1180px}
  .content-grid{grid-template-columns:repeat(4,1fr)}
  .site-list-groups{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .hero-header{padding:22px 26px 30px}
  .site-list-section{padding:4px 26px 42px}
  .category-bar,.content-grid{padding-left:26px;padding-right:26px}
  .featured-list-hint{margin-left:26px;margin-right:26px}
}

</style>
</head>

/* 右滑：轻划/快划直接展开。仅锁定明确的横向手势，纵向页面滚动交给浏览器。 */
(function(){
  const box=$('#groups'); if(!box) return;
  const WIDTH=144, START=5, DISTANCE=16, FLICK_DISTANCE=8, FLICK_SPEED=.15;
  const SNAP='transform .22s cubic-bezier(.22, 1, .36, 1)';
  let openRow=null, frame=0, suppressedRow=null, suppressUntil=0;
  const clamp=v=>Math.max(0,Math.min(WIDTH,v));
  const position=(row,x)=>{ row.style.transform='translate3d('+x+'px,0,0)'; };
  function snap(row,open){
    if(!row||!row.isConnected) return;
    row.style.transition=SNAP;
    position(row,open?WIDTH:0);
    row.parentElement.dataset.open=open?'1':'';
    if(open){openRow=row;const tags=row.querySelector('.offer-badges-line');if(tags)tags.scrollLeft=0;}
    else if(openRow===row) openRow=null;
  }
  function closeOther(keep){
    let other=openRow&&openRow.isConnected?openRow:box.querySelector('.swipe[data-open="1"] .real-offer-row');
    if(other&&other!==keep) snap(other,false);
    if(openRow&&!openRow.isConnected)openRow=null;
  }
  window.addEventListener('aishop:openrestore',e=>{
    const w=[...box.querySelectorAll('.swipe')].find(x=>x.dataset.surl===e.detail);
    if(!w) return;
    const row=w.querySelector('.real-offer-row');
    if(!row) return;
    row.style.transition='none';
    position(row,WIDTH);
    w.dataset.open='1';
    openRow=row;
  });
  box.addEventListener('pointerdown',()=>{ suppressedRow=null; },true);
  box.addEventListener('pointerdown',e=>{
    if(e.isPrimary===false||e.button!==0) return;
    const row=e.target.closest('.swipe .real-offer-row');
    if(!row||!box.contains(row)) return;
    if(drag) return;
    closeOther(row);
    const isOpen=row.parentElement.dataset.open==='1';
    drag={id:e.pointerId,row,wrap:row.parentElement,x:e.clientX,y:e.clientY,
      base:isOpen?WIDTH:0,value:isOpen?WIDTH:0,wasOpen:isOpen,axis:null,tag:e.target.closest('.offer-badges-line'),
      samples:[{x:e.clientX,t:performance.now()}]};
  });
  box.addEventListener('pointermove',e=>{
    const g=drag;
    if(!g||e.pointerId!==g.id||!g.row.isConnected) return;
    const dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(g.axis===null){
      if(Math.abs(dy)>9&&Math.abs(dy)>Math.abs(dx)*1.12) return;
      if(Math.abs(dx)<START||Math.abs(dx)<=Math.abs(dy)*1.12) return;
      if(g.tag&&dx<0&&!g.wasOpen){g.axis='tag';g.tagStart=g.tag.scrollLeft;}
      else {

        g.wrap.classList.add('is-dragging');
        g.row.style.transition='none';
        try{g.row.setPointerCapture(g.id);}catch(_){}
      }
    }
    if(g.axis==='tag'){

      return;
    }
    if(g.axis!=='x') return;
    if(e.cancelable)e.preventDefault();
    g.value=clamp(g.base+dx);

    g.samples.push({x:e.clientX,t});
    while(g.samples.length>2&&g.samples[0].t<t-110)g.samples.shift();

    if(frame){cancelAnimationFrame(frame);frame=0;}
    if(pendingSwipeRender){
      pendingSwipeRender=false; renderBoard();
      const w=[...box.querySelectorAll('.swipe')].find(w=>w.dataset.surl===g.wrap.dataset.surl);
      if(w){g.wrap=w;g.row=w.querySelector('.real-offer-row');}
    }
    if(g.axis==='x'){
      const dx=e.clientX-g.x;
      const t=performance.now(), first=g.samples[0];
      const velocity=(e.clientX-first.x)/Math.max(1,t-first.t);
      let shouldOpen=g.wasOpen;
      if(!cancelled){
        if(dx>=DISTANCE||(dx>=FLICK_DISTANCE&&velocity>=FLICK_SPEED))shouldOpen=true;
        else if(dx<=-DISTANCE||(dx<=-FLICK_DISTANCE&&velocity<=-FLICK_SPEED))shouldOpen=false;
      }
      snap(g.row,shouldOpen);
      if(shouldOpen)closeOther(g.row);
      suppressedRow=g.row;
      suppressUntil=performance.now()+350;
    }
    if(g.axis==='tag'&&!cancelled){suppressedRow=g.row;suppressUntil=performance.now()+350;}
    g.wrap.classList.remove('is-dragging');
    try{if(g.row.hasPointerCapture(g.id))g.row.releasePointerCapture(g.id);}catch(_){}
  }
  box.addEventListener('pointerup',e=>finish(e,false));
  box.addEventListener('pointercancel',e=>finish(e,true));
  box.addEventListener('lostpointercapture',e=>{if(drag&&e.target===drag.row)finish(e,true);});
  box.addEventListener('click',e=>{
    const btn=e.target.closest('.swipe-actions button');
    if(btn){
      e.preventDefault();e.stopImmediatePropagation();
      const wrap=btn.closest('.swipe'), url=wrap&&wrap.dataset.surl;
      if(!url)return;

        hiddenSet.add(url);saveHidden();wrap.remove();showToast('已从当前列表隐藏');requestAnimationFrame(()=>renderBoard());

    }
    const row=e.target.closest('.swipe .real-offer-row');
    if(!row)return;
    if((row===suppressedRow&&performance.now()<suppressUntil)||row.parentElement.dataset.open==='1'){
      e.preventDefault();e.stopImmediatePropagation();
      if(row.parentElement.dataset.open==='1'&&(row!==suppressedRow||performance.now()>=suppressUntil))snap(row,false);
      suppressedRow=null;
    }
  },true);
})();

          (it.sources||[]).forEach(s=>{if(s.url===it.url) s.stock=v;});
        }
        kept.push(it);
      });
      g.items=kept;
    });
    if(changed&&board&&board.updated_at===ver){ if(srcIsOpen||srcLocked||pcIsOpen||pcLockedFlag){ srcPendingRender=true; } else renderBoard(); }
  }catch(e){}
}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
async function reloadData(){const [b,s]=await Promise.all([fetch('data/board.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('data/shops.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())]);board=b;shops=s;fillMeta(b);renderBoard();renderShops();verifyStocks();}
$('#refreshBtn').onclick=async()=>{const btn=$('#refreshBtn');const oldMeta=board?board.updated_at:null;btn.disabled=true;btn.classList.add('loading');try{const r=await fetch(REFRESH_API,{method:'POST'});const j=await r.json().catch(()=>({}));if(j&&j.mode==='cooldown'){await reloadData();showToast(j.source==='auto'?'系统刚自动刷新过，数据更新中':'5 分钟内已刷新过，已加载最新快照');}else if(j&&j.ok){showToast('正在刷新，稍等片刻');let done=false;for(let i=0;i<20;i++){await new Promise(res=>setTimeout(res,8000));try{const nb=await fetch('data/board.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.json());if(nb.updated_at&&nb.updated_at!==oldMeta){await reloadData();showToast('已刷新到最新数据');done=true;break;}}catch(e){}}if(!done)showToast('刷新超时，请稍后再点一次');}else{showToast('刷新服务暂不可用');}}catch(e){showToast('刷新服务暂不可用');}btn.disabled=false;btn.classList.remove('loading');};
function fitStatusRow(){
  const row=document.querySelector('.status-row'),btn=$('#refreshBtn');
  if(!row||!btn) return;
  btn.style.fontSize=''; btn.style.padding='';
  const cs=getComputedStyle(btn); const f0=parseFloat(cs.fontSize)||13; let fs=f0;
  const pt=parseFloat(cs.paddingTop)||8, pl=parseFloat(cs.paddingLeft)||15;
  while(row.scrollWidth>row.clientWidth+0.5&&fs>10){ fs=Math.max(10,fs-0.5); btn.style.fontSize=fs+'px'; btn.style.padding=(pt*fs/f0)+'px '+(pl*fs/f0)+'px'; }
  row.classList.add('ready');
}
let statusRsz;
window.addEventListener('resize',()=>{ clearTimeout(statusRsz); statusRsz=setTimeout(fitStatusRow,150); });
function fillMeta(b){const mt=$('#metaTime'),mc=$('#metaCount');mt.textContent=b.updated_at.replace(/^\d{4}-/,'');mt.className='';mc.textContent=b.groups.reduce((a,g)=>a+g.items.length,0);mc.className='';const lc=$('#listCount');if(lc&&$('#viewShops').classList.contains('hide'))lc.textContent=b.groups.length+' 组 · '+mc.textContent+' 条报价';requestAnimationFrame(fitStatusRow);}
if(window.INLINE_BOARD){
  board=window.INLINE_BOARD;
  fillMeta(board);
  renderBoard();
  verifyStocks();
  setTimeout(jumpToHash,60);
}else{
  $('#refreshBtn').classList.add('loading');
}
fetch('data/board.json',{cache:'no-store'}).then(r=>r.json()).then(b=>{
  $('#refreshBtn').classList.remove('loading');
  if(!board||b.updated_at!==board.updated_at){board=b;fillMeta(board);renderBoard();}
  verifyStocks();
}).catch(e=>{$('#refreshBtn').classList.remove('loading');if(!board){const mt=$('#metaTime'),mc=$('#metaCount');mt.textContent='—';mt.className='';mc.textContent='—';mc.className='';const sr=document.querySelector('.status-row');if(sr)sr.classList.add('ready');$('#leaders').innerHTML='';$('#groups').innerHTML='<p class="sub">数据加载失败，请稍后刷新。</p>';}});
function loadShops(){ fetch('data/shops.json').then(r=>r.json()).then(s=>{
  shops=s;
  const plats=['全部',...[...new Set(s.shops.map(x=>x.platform))].sort((a,b)=>s.shops.filter(x=>x.platform===b).length-s.shops.filter(x=>x.platform===a).length)];
  $('#chips').innerHTML=plats.map(p=>'<button type="button" class="platform-filter-chip'+(p==='全部'?' active':'')+'" data-p="'+esc(p)+'">'+esc(p)+' ('+(p==='全部'?s.shops.length:s.shops.filter(x=>x.platform===p).length)+')</button>').join('');
  document.querySelectorAll('#chips button').forEach(btn=>btn.onclick=()=>{shopFilter=btn.dataset.p;shopShown=300;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('active',x===btn));renderShops();});
  renderShops();
  if(board)renderBoard();
}).catch(e=>{ if(shopsRetry<2){ shopsRetry++; setTimeout(loadShops,1500); } else { shopsFailed=true; if($('#q').value.trim()) renderBoard(); } }); } loadShops();
</script>
<script>

/* ===== 12 色弥散主题 + 日夜模式（按新稿：报价单 6 色 / 店铺目录 6 色，页签联动） ===== */
const THEMES12=[

{name:"07 · 星云幻紫",orb1:"#E9D5FF",orb2:"#C4B5FD",refreshBg:"#8B5CF6",sendCircleBg:"#A396F8",accent:"#6D28D9",tagBg:"#F3E8FF",tagText:"#6D28D9",pageBg:"#F8F5FD",glow:"rgba(167, 139, 250, 0.38)"},
{name:"08 · 蜜桃乌龙",orb1:"#FBCFE8",orb2:"#FDA4AF",refreshBg:"#F472B6",sendCircleBg:"#F9A8D4",accent:"#DB2777",tagBg:"#FDF2F8",tagText:"#BE185D",pageBg:"#FDF6F9",glow:"rgba(244, 114, 182, 0.34)"},
{name:"09 · 晨曦微光",orb1:"#FDE68A",orb2:"#FDBA74",refreshBg:"#FB923C",sendCircleBg:"#FCD34D",accent:"#EA580C",tagBg:"#FFF7ED",tagText:"#C2410C",pageBg:"#FCF9F4",glow:"rgba(251, 146, 60, 0.34)"},
{name:"10 · 落日粉紫",orb1:"#F5D0FE",orb2:"#FECDD3",refreshBg:"#C084FC",sendCircleBg:"#F0ABFC",accent:"#9333EA",tagBg:"#FAF5FF",tagText:"#7E22CE",pageBg:"#FAF6FC",glow:"rgba(192, 132, 252, 0.35)"},
{name:"11 · 香槟流金",orb1:"#FEF08A",orb2:"#FDE047",refreshBg:"#EAB308",sendCircleBg:"#FDE047",accent:"#CA8A04",tagBg:"#FEFCE8",tagText:"#A16207",pageBg:"#FAF9F2",glow:"rgba(234, 179, 8, 0.32)"},
{name:"12 · 幻彩全息",isHolo:true,orb1:"#8FDBB8",orb2:"#9CC8F7",refreshBg:"#4FA8F6",sendCircleBg:"#9EE0C5",accent:"#1A73E8",tagBg:"#E6F4EA",tagText:"#137333",pageBg:"#F3F8FA",glow:"rgba(143, 219, 184, 0.44)"}];
const SUN_PATHS='<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4.5"></line><line x1="12" y1="19.5" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.7" y2="6.7"></line><line x1="17.3" y1="17.3" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4.5" y2="12"></line><line x1="19.5" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.7" y2="17.3"></line><line x1="17.3" y1="6.7" x2="19.07" y2="4.93"></line>';
const MOON_PATHS='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
let themeState={t:0,d:false};
try{const saved=JSON.parse(localStorage.getItem('aishop.theme.v1')||'null');if(saved){if(Number.isInteger(saved.t)&&saved.t>=0&&saved.t<12)themeState.t=saved.t;else if(Number.isInteger(saved.q)&&saved.q>=0&&saved.q<6)themeState.t=saved.q;if(typeof saved.d==='boolean')themeState.d=saved.d;}}catch(e){}
let curThemeGlobal=0;
function readSharedA(){try{var m=document.cookie.match(/(?:^|;\s*)A=(\d{3,4})(?:;|$)/);if(!m)return null;var v=m[1],t=parseInt(v.slice(2),10);if(v.charAt(1)!=='0'&&v.charAt(1)!=='1')return null;if(!(t>=1&&t<=12))return null;return{l:v.charAt(0),m:v.charAt(1),t:t};}catch(e){return null;}}
function writeSharedA(){try{var a=readSharedA(),l=a?a.l:'0',h=location.hostname,s='A='+l+(themeState.d?'0':'1')+(curThemeGlobal+1)+';path=/;max-age=31536000;SameSite=Lax';if(h==='jpedu.asia'||h.slice(-11)==='.jpedu.asia')s+=';domain=jpedu.asia';if(location.protocol==='https:')s+=';Secure';document.cookie=s;}catch(e){}}
(function(){var a=readSharedA();if(a){themeState.d=a.m==='0';themeState.t=a.t-1;}curThemeGlobal=themeState.t;if(!a){try{if(localStorage.getItem('aishop.theme.v1'))writeSharedA();}catch(e){}}})();
function saveThemeState(){try{localStorage.setItem('aishop.theme.v1',JSON.stringify(themeState));}catch(e){}}
function applyTheme(idx){
  const t=THEMES12[idx]; if(!t) return;
  curThemeGlobal=idx;
  themeState.t=idx;
  const root=document.documentElement;
  root.style.setProperty('--orb-color-1',t.orb1);
  root.style.setProperty('--orb-color-2',t.orb2);
  root.style.setProperty('--refresh-btn-bg',t.refreshBg);
  root.style.setProperty('--send-circle-bg',t.sendCircleBg);
  root.style.setProperty('--theme-accent',t.accent);
  root.style.setProperty('--theme-tag-bg',t.tagBg);
  root.style.setProperty('--theme-tag-text',t.tagText);
  root.style.setProperty('--search-glow',t.glow);
  if(t.isHolo)root.setAttribute('data-holo','true'); else root.removeAttribute('data-holo');
  if(themeState.d)root.style.removeProperty('--page-bg'); else root.style.setProperty('--page-bg',t.pageBg);
  const mtc=document.querySelector('meta[name="theme-color"]');if(mtc)mtc.setAttribute('content',themeState.d?'#090D16':t.pageBg);
  document.querySelectorAll('.theme-swatch-item').forEach(el=>{el.classList.toggle('active',Number(el.getAttribute('data-theme-idx'))===idx);});
  saveThemeState();
}
function setDark(on){
  themeState.d=on;
  const root=document.documentElement;
  if(on)root.setAttribute('data-dark','true'); else root.removeAttribute('data-dark');
  const ic=document.getElementById('sunMoonIcon');
  if(ic)ic.innerHTML=on?MOON_PATHS:SUN_PATHS;
  applyTheme(curThemeGlobal);
}
function renderSwatches(){
  const grid=document.getElementById('themeSwatchGrid');
  if(!grid) return;
  grid.innerHTML=THEMES12.map((t,idx)=>'<div class="theme-swatch-item'+(idx===curThemeGlobal?' active':'')+'" data-theme-idx="'+idx+'"><span class="swatch-orb-preview'+(t.isHolo?' holo-animated':'')+'" style="background: linear-gradient(135deg, '+t.orb1+' 0%, '+t.orb2+' 65%, '+t.refreshBg+' 100%);"></span><span class="swatch-label">'+t.name+'</span></div>').join('');
  grid.querySelectorAll('.theme-swatch-item').forEach(el=>{
    el.addEventListener('click',()=>{applyTheme(Number(el.getAttribute('data-theme-idx')));writeSharedA();closeThemePanel();});
  });
}
function openThemePanel(){
  document.getElementById('themePopover').classList.add('open');
  document.getElementById('themeBackdrop').classList.add('open');
  if(navigator.vibrate)try{navigator.vibrate(18);}catch(e){}
}
function closeThemePanel(){
  document.getElementById('themePopover').classList.remove('open');
  document.getElementById('themeBackdrop').classList.remove('open');
  document.querySelectorAll('.theme-swatch-item').forEach(el=>el.classList.remove('sliding-hover'));
}
window.__applyTabTheme=function(){}; /* 全站单槽：切页签不换主题 */
(function initTheme(){
  renderSwatches();
  setDark(themeState.d);
  document.getElementById('themeBackdrop').addEventListener('click',closeThemePanel);
  const btn=document.getElementById('darkModeBtn');
  let pressTimer=null,isLong=false,isDown=false,lastIdx=null;
  btn.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0) return;
    isDown=true;isLong=false;lastIdx=null;
    btn.classList.add('pressing');
    try{btn.setPointerCapture(e.pointerId);}catch(_){}
    pressTimer=setTimeout(()=>{if(!isDown)return;isLong=true;openThemePanel();},340);
  });
  btn.addEventListener('pointermove',e=>{
    if(!isDown||!isLong) return;
    const targetEl=document.elementFromPoint(e.clientX,e.clientY);
    const sw=targetEl?targetEl.closest('.theme-swatch-item'):null;
    document.querySelectorAll('.theme-swatch-item').forEach(el=>el.classList.toggle('sliding-hover',el===sw));
    if(sw){
      const idx=Number(sw.getAttribute('data-theme-idx'));
      if(idx!==lastIdx){lastIdx=idx;applyTheme(idx);if(navigator.vibrate)try{navigator.vibrate(8);}catch(_){}}
    }
  });
  const finish=()=>{
    if(!isDown) return;
    isDown=false;clearTimeout(pressTimer);btn.classList.remove('pressing');
    if(!isLong){
      const pop=document.getElementById('themePopover');
      if(pop.classList.contains('open'))closeThemePanel();
      else{btn.classList.add('rotating');setTimeout(()=>btn.classList.remove('rotating'),520);setDark(!themeState.d);writeSharedA();}
    }else if(lastIdx!==null){writeSharedA();closeThemePanel();}
  };
  btn.addEventListener('pointerup',finish);
  btn.addEventListener('pointercancel',finish);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
})();
