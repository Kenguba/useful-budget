<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>云电脑矩阵框架图</title>
  <style>
    :root[data-theme="dark"] {
      --bg-page: #0b0e14;
      --bg-dot: rgba(148, 163, 184, 0.11);
      --toolbar-bg: #0f131c;
      --toolbar-border: #1e2533;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #8b95a5;
      --text-faint: #64748b;

      /* 第一层：首脑（强调色突出） */
      --head-bg: #111d38;
      --head-border: #3b82f6;
      --head-divider: rgba(59, 130, 246, 0.25);
      --head-badge-bg: rgba(37, 99, 235, 0.22);
      --head-badge-border: rgba(96, 165, 250, 0.4);
      --head-badge-text: #93c5fd;
      --head-title: #ffffff;
      --head-desc: #dbeafe;

      /* 第二层：机器卡（中性底色） */
      --machine-bg: #151922;
      --machine-border: #262d3b;
      --machine-hover-border: #3b465c;
      --machine-icon-bg: #1e2433;
      --machine-icon-color: #cbd5e1;
      --machine-divider: #202634;

      /* 状态标签 */
      --tag-ok-bg: rgba(16, 185, 129, 0.12);
      --tag-ok-border: rgba(16, 185, 129, 0.35);
      --tag-ok-text: #34d399;
      --tag-browser-bg: rgba(245, 158, 11, 0.12);
      --tag-browser-border: rgba(245, 158, 11, 0.35);
      --tag-browser-text: #fbbf24;

      /* 第三层：产出层（再降一档，无外框包裹） */
      --output-card-bg: #10141c;
      --output-card-border: #1c222e;
      --output-title: #8b95a5;
      --output-desc: #cbd5e1;

      /* 第四层：底部小字 */
      --footer-text: #64748b;
      --footer-label: #8b95a5;

      /* 树形连接线与标注 */
      --tree-line-primary: #3b82f6;
      --tree-line-secondary: #334155;
      --tree-node-fill: #0b0e14;
      --pill-bg: #131b2e;
      --pill-border: #2b4470;
      --pill-text: #93c5fd;
      --pill-sub-bg: #131720;
      --pill-sub-border: #283040;
      --pill-sub-text: #94a3b8;

      --btn-bg: #171c27;
      --btn-border: #262f40;
      --btn-hover: #222a3a;
      --btn-active-bg: rgba(59, 130, 246, 0.2);
      --btn-active-border: #3b82f6;
      --btn-active-text: #93c5fd;
    }

    :root[data-theme="light"] {
      --bg-page: #f4f6f9;
      --bg-dot: rgba(100, 116, 139, 0.15);
      --toolbar-bg: #ffffff;
      --toolbar-border: #dce2ec;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-faint: #94a3b8;

      /* 第一层：首脑（强调色突出） */
      --head-bg: #eff6ff;
      --head-border: #2563eb;
      --head-divider: rgba(37, 99, 235, 0.18);
      --head-badge-bg: rgba(37, 99, 235, 0.1);
      --head-badge-border: rgba(37, 99, 235, 0.3);
      --head-badge-text: #1d4ed8;
      --head-title: #0f172a;
      --head-desc: #1e3a8a;

      /* 第二层：机器卡（中性底色） */
      --machine-bg: #ffffff;
      --machine-border: #cbd5e1;
      --machine-hover-border: #94a3b8;
      --machine-icon-bg: #f1f5f9;
      --machine-icon-color: #334155;
      --machine-divider: #e2e8f0;

      /* 状态标签 */
      --tag-ok-bg: #ecfdf5;
      --tag-ok-border: #6ee7b7;
      --tag-ok-text: #047857;
      --tag-browser-bg: #fffbeb;
      --tag-browser-border: #fcd34d;
      --tag-browser-text: #b45309;

      /* 第三层：产出层（再降一档，无外框包裹） */
      --output-card-bg: #edf1f7;
      --output-card-border: #d5deeb;
      --output-title: #64748b;
      --output-desc: #334155;

      /* 第四层：底部小字 */
      --footer-text: #64748b;
      --footer-label: #475569;

      /* 树形连接线与标注 */
      --tree-line-primary: #2563eb;
      --tree-line-secondary: #94a3b8;
      --tree-node-fill: #f4f6f9;
      --pill-bg: #eff6ff;
      --pill-border: #93c5fd;
      --pill-text: #1d4ed8;
      --pill-sub-bg: #eaeff7;
      --pill-sub-border: #cbd5e1;
      --pill-sub-text: #475569;

      --btn-bg: #f8fafc;
      --btn-border: #cbd5e1;
      --btn-hover: #e2e8f0;
      --btn-active-bg: #dbeafe;
      --btn-active-border: #2563eb;
      --btn-active-text: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100vh;
      height: auto;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      height: auto;
      overflow-x: hidden;
      background-color: var(--bg-page);
      background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 28px;
      user-select: none;
    }

    /* 顶部控制栏：无外框限制，直接融入 body 顶部 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0 14px;
      width: 100%;
      z-index: 60;
      position: relative;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .topbar-title svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--head-border);
    }

    .topbar-hint {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .ctrl-btn:hover {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .ctrl-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* 矩阵主体：直接位于 body 内，无外层边框或固定高度裁剪 */
    .matrix-stage {
      position: relative;
      width: 100%;
      flex: 1 0 auto;
    }

    /* 动态树形连接线 SVG 图层 */
    .tree-svg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    #matrix-content {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* 通用节点定位（静态布局，位置按默认排版写死） */
    .node {
      position: relative;
      z-index: 2;
    }

    /* 可跳转节点：整卡可点，悬停时边框略亮 */
    .is-link {
      cursor: pointer;
    }

    .output-card.is-link:hover {
      border-color: var(--machine-hover-border);
    }

    .footer-line.is-link:hover {
      color: var(--text-secondary);
    }

    /* 外链小箭头 */
    .ext-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-faint);
    }

    .ext-arrow svg {
      width: 12px;
      height: 12px;
    }

    .output-card .ext-arrow {
      margin-left: auto;
      align-self: center;
    }

    /* 第一层：首脑卡（整行，强调色突出） */
    .layer-head-wrap {
      width: 100%;
    }

    .head-card {
      width: 100%;
      background: var(--head-bg);
      border: 1.5px solid var(--head-border);
      border-radius: 10px;
      padding: 14px 18px;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .head-top-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .head-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--head-badge-text);
      background: var(--head-badge-bg);
      border: 1px solid var(--head-badge-border);
      border-radius: 5px;
    }

    .head-badge svg {
      width: 13px;
      height: 13px;
    }

    .head-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--head-title);
      letter-spacing: 0.01em;
    }

    .collapse-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .collapse-btn:hover {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text-primary);
    }

    .collapse-btn svg {
      width: 15px;
      height: 15px;
    }

    .is-collapsed .collapse-btn svg {
      transform: rotate(-90deg);
    }

    .head-body {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--head-divider);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13.5px;
      color: var(--head-desc);
    }

    .is-collapsed .card-body-collapsible {
      display: none;
    }

    .tree-prefix {
      color: var(--head-border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.4;
      flex-shrink: 0;
      user-select: none;
    }

    /* 树干连接区（预留给 SVG 树形分叉线与中间胶囊标签） */
    .tree-connector-zone {
      position: relative;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    .tree-connector-zone.zone-secondary {
      height: 60px;
    }

    .connector-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--pill-text);
      pointer-events: auto;
    }

    .connector-pill.pill-secondary {
      background: var(--pill-sub-bg);
      border: 1px solid var(--pill-sub-border);
      color: var(--pill-sub-text);
    }

    .connector-pill svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* 第二层：四台机器（始终四卡并排，构成树形四分叉） */
    .machines-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      align-items: stretch;
    }

    .machine-card {
      background: var(--machine-bg);
      border: 1px solid var(--machine-border);
      border-radius: 10px;
      padding: 13px 13px;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .machine-card.is-collapsed {
      align-self: start;
    }

    .machine-card:hover {
      border-color: var(--machine-hover-border);
    }

    .machine-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .machine-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .machine-icon-box {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--machine-icon-bg);
      color: var(--machine-icon-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .machine-icon-box svg {
      width: 15px;
      height: 15px;
    }

    .machine-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .machine-tag-row {
      margin-top: 8px;
    }

    .machine-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      max-width: 100%;
      line-height: 1.35;
    }

    .machine-tag svg {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
    }

    .machine-tag.tone-ok {
      background: var(--tag-ok-bg);
      border: 1px solid var(--tag-ok-border);
      color: var(--tag-ok-text);
    }

    .machine-tag.tone-browser {
      background: var(--tag-browser-bg);
      border: 1px solid var(--tag-browser-border);
      color: var(--tag-browser-text);
    }

    .machine-list {
      list-style: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--machine-divider);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .machine-list-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
      word-break: break-word;
    }

    .branch-char {
      color: var(--text-faint);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      flex-shrink: 0;
      user-select: none;
    }

    /* 第三层：产出层（无外框限制，四块直接并排，层级底色再降一档） */
    .output-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .output-card {
      background: var(--output-card-bg);
      border: 1px solid var(--output-card-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-width: 0;
    }

    .output-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: rgba(148, 163, 184, 0.08);
      color: var(--output-title);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .output-icon svg {
      width: 13px;
      height: 13px;
    }

    .output-text-wrap {
      min-width: 0;
      flex: 1;
    }

    .output-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--output-title);
    }

    .output-desc {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--output-desc);
      margin-top: 2px;
      word-break: break-word;
    }

    /* 第四层：底部小字两行（无外框包裹，干净克制） */
    .footer-layer {
      margin-top: 16px;
      padding: 4px 2px 0;
      width: 100%;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .footer-line {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--footer-text);
      line-height: 1.45;
      word-break: break-word;
    }

    .footer-line svg {
      width: 13px;
      height: 13px;
      color: var(--footer-label);
      flex-shrink: 0;
    }

    .footer-key {
      color: var(--footer-label);
      font-weight: 600;
    }

    /* 手机端与窄屏适配：保持四卡并排树形结构、完整显示机器名且不横向溢出 */
    @media (max-width: 768px) {
      body {
        padding: 8px 6px 20px;
      }
      .topbar {
        padding: 2px 2px 10px;
        gap: 6px;
      }
      .topbar-title {
        font-size: 13px;
      }
      .topbar-hint {
        display: none;
      }
      .ctrl-btn {
        height: 26px;
        padding: 0 7px;
        font-size: 11px;
        gap: 3px;
      }
      .ctrl-btn svg {
        width: 12px;
        height: 12px;
      }
      .head-card {
        padding: 10px 12px;
      }
      .head-title {
        font-size: 14px;
      }
      .head-body {
        font-size: 11.5px;
        margin-top: 8px;
        padding-top: 8px;
      }
      .tree-connector-zone {
        height: 50px;
      }
      .tree-connector-zone.zone-secondary {
        height: 46px;
      }
      .connector-pill {
        font-size: 10.5px;
        padding: 2px 9px;
      }
      .machines-row {
        gap: 5px;
      }
      .machine-card {
        padding: 7px 5px;
        border-radius: 8px;
      }
      .machine-header {
        gap: 2px;
      }
      .machine-icon-box {
        width: 15px;
        height: 15px;
        background: transparent;
        border-radius: 0;
      }
      .machine-icon-box svg {
        width: 12px;
        height: 12px;
      }
      .machine-title-group {
        gap: 3px;
      }
      .machine-name {
        font-size: 11px;
        letter-spacing: -0.01em;
      }
      .collapse-btn {
        width: 15px;
        height: 15px;
      }
      .collapse-btn svg {
        width: 11px;
        height: 11px;
      }
      .machine-tag-row {
        margin-top: 5px;
      }
      .machine-tag {
        font-size: 9px;
        padding: 2px 4px;
        gap: 2px;
        line-height: 1.25;
      }
      .machine-tag svg {
        width: 8.5px;
        height: 8.5px;
      }
      .machine-list {
        margin-top: 6px;
        padding-top: 6px;
        gap: 5px;
      }
      .machine-list-item {
        font-size: 10px;
        gap: 2px;
        line-height: 1.35;
      }
      .branch-char {
        font-size: 9px;
      }
      .output-grid {
        gap: 5px;
      }
      .output-card {
        padding: 6px 5px;
        flex-direction: column;
        gap: 3px;
      }
      .output-icon {
        width: 16px;
        height: 16px;
      }
      .output-icon svg {
        width: 10px;
        height: 10px;
      }
      .output-label {
        font-size: 10px;
      }
      .output-desc {
        font-size: 9.5px;
        line-height: 1.3;
      }
      .footer-layer {
        margin-top: 12px;
        padding: 2px 2px 0;
      }
      .footer-line {
        font-size: 10.5px;
        align-items: flex-start;
      }
      .footer-line svg {
        margin-top: 2px;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部工具栏（直接位于 body 内） -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-title" id="ui-page-title"></div>
      <span class="topbar-hint" id="ui-page-hint"></span>
    </div>
    <div class="topbar-controls">
      <button type="button" class="ctrl-btn" id="btn-toggle-all">
        <span id="icon-toggle-all"></span>
        <span id="label-toggle-all">全部收起</span>
      </button>
      <button type="button" class="ctrl-btn" id="btn-theme">
        <span id="icon-theme"></span>
        <span id="label-theme">浅色</span>
      </button>
    </div>
  </header>

  <!-- 矩阵主体（直接位于 body 内，无外框限制） -->
  <main class="matrix-stage" id="matrix-stage">
    <svg class="tree-svg-layer" id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="matrix-content"></div>
  </main>

  <script>
    /**
     * ============================================================================
     * 数据驱动配置对象（修改此对象即可更新全部界面文字与层级内容，无需改动下方视图代码）
     * 注意：严格遵守每行文字末尾不加句号
     * ============================================================================
     */
    const MATRIX_DATA = {
      meta: {

    /**
     * 预创建持久化 SVG 节点池，后续拖动时只改属性，零 DOM 销毁重建
     */
    function initSvgPool(machineCount, outputCount) {
      const svg = domCache.svg;
      const ns = "http://www.w3.org/2000/svg";
      svg.innerHTML = "";

      function createEl(tag, attrs) {
        const el = document.createElementNS(ns, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        svg.appendChild(el);
        return el;
      }

      const pool = {
        trunkTop: createEl("path", { stroke: "var(--tree-line-primary)", "stroke-width": "2", fill: "none" }),
        busTop: createEl("path", { stroke: "var(--tree-line-primary)", "stroke-width": "2", fill: "none" }),
        machineTopStems: [],
        machineTopDots: [],
        headDot: createEl("circle", { r: "3.5", fill: "var(--tree-node-fill)", stroke: "var(--tree-line-primary)", "stroke-width": "2" }),
        busTopJoint: createEl("circle", { r: "3", fill: "var(--tree-line-primary)" }),
        busBottom: createEl("path", { stroke: "var(--tree-line-secondary)", "stroke-width": "1.5", "stroke-dasharray": "4 3", fill: "none" }),
        machineBottomStems: [],
        machineBottomDots: [],
        outputTopStems: [],
        outputTopDots: []
      };

      for (let i = 0; i < machineCount; i++) {
        pool.machineTopStems.push(
          createEl("path", { stroke: "var(--tree-line-primary)", "stroke-width": "2", fill: "none" })
        );
        pool.machineTopDots.push(
          createEl("circle", { r: "3.5", fill: "var(--tree-node-fill)", stroke: "var(--tree-line-primary)", "stroke-width": "2" })
        );
        pool.machineBottomStems.push(
          createEl("path", { stroke: "var(--tree-line-secondary)", "stroke-width": "1.5", "stroke-dasharray": "4 3", fill: "none" })
        );
        pool.machineBottomDots.push(
          createEl("circle", { r: "2.8", fill: "var(--tree-node-fill)", stroke: "var(--tree-line-secondary)", "stroke-width": "1.6" })
        );
      }

      for (let j = 0; j < outputCount; j++) {
        pool.outputTopStems.push(
          createEl("path", { stroke: "var(--tree-line-secondary)", "stroke-width": "1.5", "stroke-dasharray": "4 3", fill: "none" })
        );
        pool.outputTopDots.push(
          createEl("circle", { r: "2.8", fill: "var(--tree-node-fill)", stroke: "var(--tree-line-secondary)", "stroke-width": "1.6" })
        );
      }

      domCache.svgNodes = pool;
    }

    /**
     * 仅在初始化、窗口缩放、卡片展开/收起时测量一次基准坐标
     */
    function measureBaseGeometry() {
      const stageRect = domCache.stage.getBoundingClientRect();
      domCache.baseBoxes = {};

      for (const id in domCache.nodes) {
        const el = domCache.nodes[id];
        const r = el.getBoundingClientRect();
        const left = r.left - stageRect.left;
        const top = r.top - stageRect.top;
        domCache.baseBoxes[id] = {
          left,
          top,
          right: left + r.width,
          bottom: top + r.height,
          cx: left + r.width * 0.5,
          cy: top + r.height * 0.5,
          width: r.width,
          height: r.height
        };
      }
    }

    function getLiveBox(id) {
      return domCache.baseBoxes[id] || null;
    }

    /**
     * 纯内存数值计算更新 SVG 属性（零布局回流）
     */
    function updateTreePathsFast() {
      domCache.rafId = 0;
      const pool = domCache.svgNodes;
      if (!pool) return;

      const headBox = getLiveBox(MATRIX_DATA.layer1Head.id);
      if (!headBox) return;

      const pillDispatchBox = getLiveBox(MATRIX_DATA.dispatchConnector.id);
      const pillOutputBox = getLiveBox(MATRIX_DATA.outputConnector.id);
      const machineBoxes = MATRIX_DATA.layer2Machines.map((m) => getLiveBox(m.id));
      const outputBoxes = MATRIX_DATA.layer3Outputs.map((o) => getLiveBox(o.id));

      // 第一层 → 第二层 一分四树形线
      const startX = headBox.cx;
      const startY = headBox.bottom;
      let minMachineTop = Infinity;
      let leftMostX1 = startX;
      let rightMostX1 = startX;

      for (let i = 0; i < machineBoxes.length; i++) {
        const mb = machineBoxes[i];
        if (mb.top < minMachineTop) minMachineTop = mb.top;
        if (mb.cx < leftMostX1) leftMostX1 = mb.cx;
        if (mb.cx > rightMostX1) rightMostX1 = mb.cx;
      }

      let busY1 = startY + (minMachineTop - startY) * 0.72;
      if (pillDispatchBox) {
        busY1 = Math.max(pillDispatchBox.bottom + 8, Math.min(minMachineTop - 8, (pillDispatchBox.bottom + minMachineTop) * 0.5));
      }

      pool.trunkTop.setAttribute("d", `M ${startX.toFixed(1)} ${startY.toFixed(1)} L ${startX.toFixed(1)} ${busY1.toFixed(1)}`);
      pool.busTop.setAttribute("d", `M ${leftMostX1.toFixed(1)} ${busY1.toFixed(1)} L ${rightMostX1.toFixed(1)} ${busY1.toFixed(1)}`);

      pool.headDot.setAttribute("cx", startX.toFixed(1));
      pool.headDot.setAttribute("cy", startY.toFixed(1));
      pool.busTopJoint.setAttribute("cx", startX.toFixed(1));
      pool.busTopJoint.setAttribute("cy", busY1.toFixed(1));

      for (let i = 0; i < machineBoxes.length; i++) {
        const mb = machineBoxes[i];
        pool.machineTopStems[i].setAttribute("d", `M ${mb.cx.toFixed(1)} ${busY1.toFixed(1)} L ${mb.cx.toFixed(1)} ${mb.top.toFixed(1)}`);
        pool.machineTopDots[i].setAttribute("cx", mb.cx.toFixed(1));
        pool.machineTopDots[i].setAttribute("cy", mb.top.toFixed(1));
      }

      // 第二层 → 第三层 四合一汇聚分发线
      if (outputBoxes.length > 0) {
        let maxMachineBottom = -Infinity;
        let minOutputTop = Infinity;
        let leftMostX2 = Infinity;
        let rightMostX2 = -Infinity;

        for (let i = 0; i < machineBoxes.length; i++) {
          const mb = machineBoxes[i];
          if (mb.bottom > maxMachineBottom) maxMachineBottom = mb.bottom;
          if (mb.cx < leftMostX2) leftMostX2 = mb.cx;
          if (mb.cx > rightMostX2) rightMostX2 = mb.cx;
        }
        for (let j = 0; j < outputBoxes.length; j++) {
          const ob = outputBoxes[j];
          if (ob.top < minOutputTop) minOutputTop = ob.top;
          if (ob.cx < leftMostX2) leftMostX2 = ob.cx;
          if (ob.cx > rightMostX2) rightMostX2 = ob.cx;
        }

        let busY2 = maxMachineBottom + (minOutputTop - maxMachineBottom) * 0.5;
        if (pillOutputBox) {
          busY2 = pillOutputBox.cy;
        }

        pool.busBottom.setAttribute("d", `M ${leftMostX2.toFixed(1)} ${busY2.toFixed(1)} L ${rightMostX2.toFixed(1)} ${busY2.toFixed(1)}`);

        for (let i = 0; i < machineBoxes.length; i++) {
          const mb = machineBoxes[i];
          pool.machineBottomStems[i].setAttribute("d", `M ${mb.cx.toFixed(1)} ${mb.bottom.toFixed(1)} L ${mb.cx.toFixed(1)} ${busY2.toFixed(1)}`);
          pool.machineBottomDots[i].setAttribute("cx", mb.cx.toFixed(1));
          pool.machineBottomDots[i].setAttribute("cy", mb.bottom.toFixed(1));
        }

        for (let j = 0; j < outputBoxes.length; j++) {
          const ob = outputBoxes[j];
          pool.outputTopStems[j].setAttribute("d", `M ${ob.cx.toFixed(1)} ${busY2.toFixed(1)} L ${ob.cx.toFixed(1)} ${ob.top.toFixed(1)}`);
          pool.outputTopDots[j].setAttribute("cx", ob.cx.toFixed(1));
          pool.outputTopDots[j].setAttribute("cy", ob.top.toFixed(1));
        }
      }
    }

    function refreshLayoutCacheAndDraw() {
      if (domCache.rafId) cancelAnimationFrame(domCache.rafId);
      domCache.rafId = requestAnimationFrame(() => {
        domCache.rafId = 0;
        measureBaseGeometry();
        updateTreePathsFast();
      });
    }

    /**
     * 事件委托绑定：
     * 1. 收起箭头只展开/收起，不跳转
     * 2. 带 data-url 的卡/块/行整块点击，在新标签页打开对应地址
     */
    let interactionsBound = false;
    function bindInteractions() {
      if (interactionsBound) return;
      interactionsBound = true;

      const contentEl = domCache.content;

      contentEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-toggle-id]");
        if (btn) {
          e.stopPropagation();
          const id = btn.getAttribute("data-toggle-id");
          state.collapsedMap[id] = !state.collapsedMap[id];
          const card = domCache.nodes[id];
          if (card) {
            card.classList.toggle("is-collapsed", !!state.collapsedMap[id]);
          }
          syncToggleAllStatus();
          refreshLayoutCacheAndDraw();
          return;
        }

        const linkEl = e.target.closest("[data-url]");
        if (linkEl) {
          window.open(linkEl.getAttribute("data-url"), "_blank", "noopener");
        }
      });
    }

    function syncToggleAllStatus() {
      const collapsibleIds = [
        MATRIX_DATA.layer1Head.id,
        ...MATRIX_DATA.layer2Machines.map((m) => m.id)
      ];
      state.allCollapsed = collapsibleIds.every((id) => !!state.collapsedMap[id]);
      updateToolbarLabels();
    }

    function updateToolbarLabels() {
      const labelToggle = document.getElementById("label-toggle-all");
      const labelTheme = document.getElementById("label-theme");
      const iconTheme = document.getElementById("icon-theme");

      if (labelToggle) {
        labelToggle.textContent = state.allCollapsed
          ? MATRIX_DATA.meta.expandAllText
          : MATRIX_DATA.meta.collapseAllText;
      }
      if (labelTheme && iconTheme) {
        if (state.theme === "dark") {
          labelTheme.textContent = MATRIX_DATA.meta.lightModeText;
          iconTheme.innerHTML = getIcon("sun");
        } else {
          labelTheme.textContent = MATRIX_DATA.meta.darkModeText;
          iconTheme.innerHTML = getIcon("moon");
        }
      }
    }

    // 绑定顶部工具栏事件
    document.getElementById("btn-toggle-all").addEventListener("click", () => {
      const nextCollapsed = !state.allCollapsed;
      const collapsibleIds = [
        MATRIX_DATA.layer1Head.id,
        ...MATRIX_DATA.layer2Machines.map((m) => m.id)
      ];
      collapsibleIds.forEach((id) => {
        state.collapsedMap[id] = nextCollapsed;
        const el = domCache.nodes[id];
        if (el) el.classList.toggle("is-collapsed", nextCollapsed);
      });
      state.allCollapsed = nextCollapsed;
      updateToolbarLabels();
      refreshLayoutCacheAndDraw();
    });

    document.getElementById("btn-theme").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", state.theme);
      updateToolbarLabels();
    });

    window.addEventListener("resize", () => {
      refreshLayoutCacheAndDraw();
    }, { passive: true });

    // 初始化渲染
    renderMatrix(MATRIX_DATA);
  </script>
</body>
</html>
