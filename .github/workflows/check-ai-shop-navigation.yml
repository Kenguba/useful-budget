name: AI shop navigation regression

on:
  push:
    paths:
      - 'frontend/ai-shop/index.html'
      - 'frontend/ai-shop/scripts/check-navigation.mjs'
      - '.github/workflows/check-ai-shop-navigation.yml'
  pull_request:
    paths:
      - 'frontend/ai-shop/index.html'
      - 'frontend/ai-shop/scripts/check-navigation.mjs'
      - '.github/workflows/check-ai-shop-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected card stays last clicked
        run: node frontend/ai-shop/scripts/check-navigation.mjs
