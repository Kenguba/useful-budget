# GitHub Pages 方案：每小时自动刷新数据、提交回仓库，并发布 Pages
# 用法：把整个包推到一个 GitHub 仓库，仓库 Settings > Pages 里 Source 选 GitHub Actions 即可
name: refresh-and-deploy
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 frontend/pages/skill-board/scripts/refresh.py & p_skill=$!
          python3 frontend/pages/ai-shop/scripts/refresh.py & p_ai=$!
          p_phone=""
          if [ "$(TZ=Asia/Shanghai date +%u)" = "1" ] || [ "$(TZ=Asia/Shanghai date +%u)" = "4" ]; then
            python3 frontend/pages/phone-cloud/scripts/refresh.py & p_phone=$!
          fi
          rc=0
          wait "$p_skill" || rc=$?
          wait "$p_ai" || rc=$?
          if [ -n "$p_phone" ]; then
            wait "$p_phone" || echo "::warning::phone-cloud refresh failed, keeping previous data"
          fi
          exit "$rc"
      - name: Commit data
        run: |
          git config user.name "skills-board-bot"
          git config user.email "bot@localhost"
          git add frontend/pages/skill-board/data/ frontend/pages/ai-shop/data/ frontend/pages/phone-cloud/data/ frontend/pages/ai-shop/index.html
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
